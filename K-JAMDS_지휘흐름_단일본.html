  if (Date.now() - userScrollAt < 4000) return;
  const wrap = el('graph-wrap'), svg = el('graph');
  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;
  const dots = svg.querySelectorAll('#lyr-dots circle');
  if (!dots.length) return;
  const vb = (svg.getAttribute('viewBox') || '').split(/\s+/);
  const vh = +vb[3] || 0;
  if (!vh) return;
  const scale = wrap.scrollHeight / vh;          // viewBox 좌표 → 화면 픽셀
  let sum = 0;
  dots.forEach((d) => { sum += +d.getAttribute('cy') || 0; });
  const y = (sum / dots.length) * scale;
  const top = wrap.scrollTop, bot = top + wrap.clientHeight;
  if (y > top + 70 && y < bot - 70) return;      // 이미 보이면 두 번 움직이지 않는다
  autoScrolling = true;
  wrap.scrollTop = Math.max(0, Math.min(wrap.scrollHeight - wrap.clientHeight, y - wrap.clientHeight / 2));
}

/** 노드 작업 종류 → 「무엇을 하려는 중인가」. 큐에 선 작업의 **다음 할 일**을 말해 준다. */
const JOB_LABEL = {
  iads_track: '위협판단·표적할당 준비',
  approval: '교전 승인',
  approval_return: '승인 회신 처리·교전명령',   // ADR-093 — C2A가 승인 회신을 접수해 사수 확정·명령을 내는 작업
  directive_issue: '교전명령 발령',            // ADR-096 — 결심 노드가 명령을 작성해 계선에 올리는 작업
  directive_relay: 'ICC 중계 인가',            // ADR-094 — ICC가 교전명령을 접수·인가(필요시 권역 내 재배정)하는 작업
  directive_reception: '교전명령 접수',
  engage: '발사 처리'
};

/**
 * 시각 t에서 이 항적이 **어디서 무엇을 기다리는가**를 판정한다.
 *
 * 종전 화면은 점의 유무·꼬리 길이로 **추론하게** 했다. 같은 정보를 문장으로 말해 주는 것이
 * 이 함수의 목적이다 — 「지금 KAMDOC 큐에서 앞에 12건 두고 48초째 대기」처럼.
 *
 * ⚠️ 「가야 할 방향」을 아는 경우와 모르는 경우를 **섞지 않는다**:
 *    · 채널 막힘 — 목적지가 정해져 있다(from→to). 화살표로 그린다.
 *    · 노드 큐 대기 — 다음 목적지는 **아직 결정 전**이다(결심이 서비스 중에 난다).
 *      그래서 방향이 아니라 **그 노드에서 무엇을 기다리는지**만 적는다. 방향을 지어내지 않는다.
 *    · 공백 — 어느 계통도 일하지 않는다. 교전 가능 상태(사격통제·체공창)를 기다리는 구간이며,
 *      C2가 막은 것이 아니다. 그렇게 적는다.
 */
function trackSignals(t) {
  const out = [];
  if (!sel) return out;
  if (t < sel.spawnT) return [{ cls: 'idle', text: '아직 생성 전' }];
  if (sel.exitT != null && t >= sel.exitT) {
    const oc = outcomeInfo(sel);
    return [oc.leaked
      ? { cls: 'stop', text: '누수 — ' + oc.text, sub: oc.code || '' }
      : { cls: 'go', text: '격추 완료' }];
  }

  // ① 채널에 막혀 못 가는 전문 — 목적지가 정해진 유일한 경우
  (sel.blocks || []).forEach((b) => {
    if (b.kind !== 'wait' || t < b.t0 || t > b.t1) return;
    out.push({ cls: 'stop', kind: 'blocked', from: b.from, to: b.to,
      text: `${nodeName(b.from)} → ${nodeName(b.to)} 못 감`,
      sub: `채널이 안 비어 ${(t - b.t0).toFixed(0)}초째 대기` });
  });

  // ② 노드에서 대기/처리 중 — 앞에 몇 건인지까지 센다(전역 체류에서 직접).
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (t < s.arrive || t > endT) return;
    if (s.start != null && t >= s.start) {
      out.push({ cls: 'go', kind: 'service', node: s.at,
        text: `${nodeName(s.at)} 처리 중`,
        sub: `${JOB_LABEL[s.jk] || s.jk} · ${(t - s.start).toFixed(0)}초째` });
    } else {
      // 같은 노드에서 나보다 먼저 도착해 아직 서비스에 못 들어간 작업 수 = 내 앞 대기줄
      let ahead = 0;
      run.allSpans.forEach((o) => {
        if (o.at !== s.at || o === s) return;
        if (o.arrive > t || o.arrive >= s.arrive) return;
        const oe = o.drop != null ? o.drop : (o.done != null ? o.done : Infinity);
        if (t <= oe && !(o.start != null && t >= o.start)) ahead++;
      });
      out.push({ cls: 'wait', kind: 'queue', node: s.at,
        text: `${nodeName(s.at)}에서 ${JOB_LABEL[s.jk] || s.jk} 대기`,
        sub: `앞에 ${ahead}건 · ${(t - s.arrive).toFixed(0)}초째` });
    }
  });

  // ②-b 이미 다른 계통이 이 표적에 쐈다 — 중복교전이 성립한 뒤로는 계속 알린다.
  if (sel.dupT != null && t >= sel.dupT) {
    out.push({ cls: 'stop', kind: 'dup',
      text: `중복교전 — ${sel.fireShooters.length}개 사수가 각각 발사`,
      sub: sel.fireShooters.map((s) => nodeName(s)).join(' + ') });
  }

  // ③ 이동 중 — 선 위에 떠 있는 전문
  let moving = 0, slowest = null;
  sel.flows.forEach((f) => {
    if (f.d <= 0 || t < f.t0 || t > f.t1) return;
    moving++;
    if (!slowest || f.d > slowest.d) slowest = f;
  });
  if (moving) {
    out.push({ cls: 'go', kind: 'move',
      text: `전문 ${moving}건 이동 중`,
      sub: slowest ? `최장 ${media(slowest.mt).label} ${slowest.d.toFixed(0)}초` : '' });
  }

  // ④ 아무것도 없으면 — 공백. C2가 막은 게 아니라는 것을 분명히 적는다.
  if (!out.length) {
    out.push({ cls: 'idle',
      text: '교전 가능 상태 대기',
      sub: '어느 계통도 처리 중이 아님 — 사격통제·체공창을 기다리는 구간' });
  }
  return out;
}

function renderSignals(sigs) {
  const box = el('signal');
  if (view !== 'track' || !sel) { box.hidden = true; return; }
  box.hidden = false;
  // 붉은 것(막힘)을 앞으로 — 화면에서 먼저 읽혀야 한다.
  const order = { stop: 0, wait: 1, go: 2, idle: 3 };
  const shown = sigs.slice().sort((a, b) => order[a.cls] - order[b.cls]).slice(0, 4);
  box.innerHTML = shown.map((s) =>
    `<span class="sig ${s.cls}"><span class="lamp"></span>${esc(s.text)}` +
    (s.sub ? `<span class="sub">${esc(s.sub)}</span>` : '') + `</span>`).join('');
}

function drawFrameTrack() {
  if (!sel || !geo) return;
  const dots = el('graph').querySelector('#lyr-dots');
  const showSensor = el('show-sensor').checked;
  let out = '';

  const liveCols = new Set();
  const talking = new Map();   // nodeId → 지금 이 항적의 전문이 나는 계선 끝점의 전송 시간
  // 킬체인 프론티어 — 이 항적의 계선이 **지금까지 도달한** 가장 오른쪽 열.
  // 「항적이 움직이니 C2가 왼쪽부터 차례로 반응한다」를 한 줄로 못박는 표시다.
  let frontier = -1;

  // 「닿지 못한」 노드·계선 — 실패 증거의 최초 시각을 지나면 또렷해진다.
  if (geo.ghostEls) geo.ghostEls.forEach((g) => g.el.classList.toggle('on', simT >= g.t));

  sel.flows.forEach((f) => {
    const e = geo.edgeByKey[edgeKey(f)];
    if (!e || !e.el) return;
    // 도착이 끝난 전문은 프론티어를 그만큼 밀어 둔다(역방향 도착은 밀지 않는다).
    if (simT >= f.t1 && !e.back && e.cb != null) frontier = Math.max(frontier, e.cb);
    // 순간 전달(지연 0 — 병렬 통보)은 도착 직후 잠깐만 깜빡인다. 0초를 "이동"으로 그리면
    // 없는 시간을 지어내는 것이고, 아예 안 그리면 통보가 없었던 것처럼 보인다.
    const inFlight = f.d > 0 ? (simT >= f.t0 && simT <= f.t1) : (simT >= f.t0 && simT <= f.t0 + 1.5);
    if (!inFlight) return;
    if (e.ca != null) { liveCols.add(e.ca); liveCols.add(e.cb); }
    // 교신 맥동 재료 — 전체 보기와 같은 규칙(센서 보고 제외).
    if (f.d > 0 && f.mt !== 'report-cycle') {
      [f.from, f.to].forEach((id) => {
        const p = talking.get(id);
        if (p == null || f.d > p) talking.set(id, f.d);
      });
    }
    // 프론티어·열 밝기는 「센서 보고 표시」 토글과 무관하다(전체 보기와 같은 규율) —
    // 토글은 점의 혼잡을 줄이는 손잡이일 뿐이다. 점만 여기서 거른다.
    if (!showSensor && f.mt === 'report-cycle') return;
    const p = f.d > 0 ? (simT - f.t0) / f.d : 1;
    const pt = e.el.getPointAtLength(e.len * Math.min(1, Math.max(0, p)));
    const m = media(f.mt);
    out += `<circle class="dot" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5.5" fill="${m.color}"></circle>`;
    // 느린 매체는 이름표를 달아 준다 — 빠른 것에 달면 깜빡임만 늘어난다.
    if (f.d >= 10) {
      out += `<text class="dotlab" x="${(pt.x + 8).toFixed(1)}" y="${(pt.y - 7).toFixed(1)}">` +
        `${esc(m.label)} ${f.d.toFixed(0)}초</text>`;
    }
  });
  // 이 항적의 작업이 놓인 노드의 열도 밝힌다 — 대기든 처리든 「반응 중」이다.
  // 선 위의 이동만 세면 노드에서 시간을 다 보내는 구간이 통째로 꺼져 보인다.
  const myNodes = new Set();
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (simT >= s.arrive && simT <= endT) myNodes.add(s.at);
  });
  Object.keys(geo.nodes).forEach((k) => {
    if (myNodes.has(geo.nodes[k].id)) liveCols.add(geo.nodes[k].col);
  });
  paintLiveCols(geo, liveCols);

  // 킬체인 프론티어 — 왼쪽은 이미 지나온 단계, 오른쪽은 아직 도달 못 한 단계.
  // ⚠️ 좌표를 지어내는 것이 아니다. 「도착이 끝난 전문의 도착 열」 중 최댓값일 뿐이고,
  //    그 도착 시각은 실행이 기록한 t1이다.
  if (frontier >= 0 && frontier < COLS.length) {
    const fx = geo.colW * (frontier + 1);
    const fy = 40;   // 열 머리글(18·30) 바로 아래에서 시작해 그래프 바닥까지
    out += `<line class="frontier" x1="${fx.toFixed(1)}" y1="${fy.toFixed(1)}" x2="${fx.toFixed(1)}" y2="${geo.H}"></line>` +
      `<text class="frontier-lab" x="${(fx - 5).toFixed(1)}" y="${(fy + 11).toFixed(1)}" text-anchor="end">` +
      `킬체인 진행 ▸ ${esc(COLS[frontier].label)}</text>`;
  }

  // 이 항적의 전문 중 계선 입구에서 막힌 것 — 개별 보기에서도 같은 규칙으로 그린다.
  out += renderBlocks(sel.blocks, geo);

  // 신호등이 가리키는 지점을 그래프에서도 짚는다 — 문장과 그림이 같은 곳을 가리켜야
  // 「어디서」에 답이 된다. 붉은 맥동 = 막힘, 노랑 맥동 = 큐 대기.
  const sigs = trackSignals(simT);
  sigs.forEach((s) => {
    if (s.kind === 'queue' || s.kind === 'service') {
      if (s.kind !== 'queue') return;                 // 처리 중은 정상이라 표시하지 않는다
      const p = slotPos(geo, s.node);
      if (p) out += `<circle class="blockmark wait" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="15"></circle>`;
    } else if (s.kind === 'blocked') {
      const es = geo.edges.filter((e) => e.from === s.from && e.to === s.to);
      const e = es.find((x) => x.kind === 'status') || es[0];
      if (e) out += `<path class="wantpath" d="${e.d}"></path>`;   // 가야 할 방향을 흐르는 점선으로
      const p = geo.nodes[s.from];
      if (p) out += `<circle class="blockmark" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="15"></circle>`;
    }
  });
  renderSignals(sigs);

  // 종결 표시 — 이 항적이 어떻게 끝났는지. 종전에는 **아무것도 그리지 않아** 누수가
  // 「그냥 움직임이 멎음」으로만 보였다. 모델은 사유·계열·구조성을 다 갖고 있다(ADR-050).
  const oc = outcomeInfo(sel);
  if (sel.exitT != null && simT >= sel.exitT) {
    const W = geo.W, y = 34;
    if (oc.leaked) {
      out += `<g class="endbanner leak"><rect x="${(W / 2 - 230).toFixed(0)}" y="${y}" width="460" height="34" rx="6"></rect>` +
        `<text x="${(W / 2).toFixed(0)}" y="${y + 15}" text-anchor="middle">` +
        `누수 ${esc(fmt(sel.exitT))} — ${esc(oc.text)}</text>` +
        `<text class="sub" x="${(W / 2).toFixed(0)}" y="${y + 28}" text-anchor="middle">` +
        `${esc(oc.code || '')}${oc.family ? ` · ${esc(oc.family)} 계열 · ${esc(oc.struct)}` : ''}` +
        `${oc.contributors.length ? ` · 기여 ${esc(oc.contributors.join(', '))}` : ''}</text></g>`;
    } else {
      out += `<g class="endbanner kill"><rect x="${(W / 2 - 110).toFixed(0)}" y="${y}" width="220" height="22" rx="6"></rect>` +
        `<text x="${(W / 2).toFixed(0)}" y="${y + 15}" text-anchor="middle">격추 ${esc(fmt(sel.exitT))}</text></g>`;
    }
  }

  dots.innerHTML = out;

  // 노드 케파 — **전역 부하**를 그리고, 그 위에 이 항적의 작업이 몇 번째인지 표시한다.
  // ⚠️ 종전에는 `sel.spans`(이 항적 몫)만 세어 노드 상태를 그렸다. 그러면 앞에 남의 작업이
  //    20건 쌓여 있어도 「대기 1」로 보인다 — 왜 안 나아가는지 설명이 안 되는 화면이었다.
  const gstate = stateAt(simT);
  const mineAt = {};
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (simT < s.arrive || simT > endT) return;
    if (s.start != null && simT >= s.start) { mineAt[s.at] = { kind: 'service' }; return; }
    // 내 앞에 선 건수 = 같은 노드에서 나보다 먼저 도착했고 아직 서비스에 못 들어간 작업
    let ahead = 0;
    run.allSpans.forEach((o) => {
      if (o.at !== s.at || o === s || o.arrive > simT || o.arrive >= s.arrive) return;
      const oe = o.drop != null ? o.drop : (o.done != null ? o.done : Infinity);
      if (simT <= oe && !(o.start != null && simT >= o.start)) ahead++;
    });
    if (!mineAt[s.at] || mineAt[s.at].kind !== 'service') mineAt[s.at] = { kind: 'queue', pos: ahead };
  });
  Object.keys(geo.nodeEls).forEach((k) => {
    const els = geo.nodeEls[k], id = els.id, n = run.nodes[id] || {};
    const cap = nodeCap(n); const c = cap ? cap.c : null;
    const st = gstate[id] || { busy: 0, q: 0 };
    const talkD = talking.get(id);
    if (els.fill && c) {
      paintCyl(els, geo.nodes[k], c, st, mineAt[id] || null);
      // 교신 맥동 — 처리 중이면 작업 맥동이 우선한다(전체 보기와 같은 규칙).
      const talkOn = talkD != null && !(st.busy > 0);
      els.cyl.classList.toggle('talking', talkOn);
      if (talkOn) commPulse(els.rim, talkD);
      return;
    }
    if (els.circ) {
      // ⚠️ 종전에는 대기중(queue)에도 `busy`를 걸었다. 그때는 색만 바뀌어 넘어갔지만
      //    이제 `busy`는 **맥동**한다 — 줄만 서 있는 노드가 일하는 것처럼 깜빡이면 안 된다.
      const mn = mineAt[id];
      const svcNow = !!(mn && mn.kind === 'service');
      els.circ.classList.toggle('busy', svcNow);
      els.circ.classList.toggle('queued', !!(mn && mn.kind === 'queue'));
      // 주기는 **전역 상태**에서 잡는다 — 실린더와 같은 규칙이라야 같은 노드가 두 보기에서
      // 다른 속도로 깜빡이지 않는다.
      if (svcNow) applyPulse(els.circ, st);
      const talkOn = talkD != null && !svcNow;
      els.circ.classList.toggle('talking', talkOn);
      if (talkOn) commPulse(els.circ, talkD);
    }
    if (els.badge) els.badge.textContent = st.q ? '대기 ' + st.q : '';
  });

  // 센서 점등 — 이 항적을 탐지·추적·사격통제 중인 센서의 테두리에 불이 들어온다.
  // 상태는 SENSOR_* 전이 마크의 구간 재생이라, 여러 센서가 동시에 켜지는 순간이 그대로 보인다.
  const SENSOR_BADGE = { det: '탐지', trk: '추적', fc: '사통' };
  if (sel.sensorStates) Object.keys(sel.sensorStates).forEach((sid) => {
    const evs = sel.sensorStates[sid];
    let st = null;
    for (let i = 0; i < evs.length && evs[i].t <= simT; i++) st = evs[i].st;
    Object.keys(geo.nodeEls).forEach((k) => {
      const els = geo.nodeEls[k];
      if (els.id !== sid) return;
      els.g.classList.remove('s-det', 's-trk', 's-fc');
      if (st) els.g.classList.add('s-' + st);
      if (els.badge) els.badge.textContent = st ? SENSOR_BADGE[st] : '';
    });
  });

  paintLog();
  paintClock();
}

/**
 * 「가야 할 방향은 있는데 못 가는」 전문을 계선 **입구에 줄 세워** 그린다.
 *
 * 움직이는 점(전송 중)과 반드시 달라 보여야 한다 — 채운 원이 아니라 **점선 테두리 빈 원**이고,
 * 시각이 흘러도 제자리다. 그것이 "선은 있는데 못 건넌다"의 그림이다.
 *
 * ⚠️ 대기 위치는 표시 관례일 뿐 모델의 좌표가 아니다(모델에 대기 위치라는 개념은 없다).
 *    실제인 것은 **언제부터 언제까지 못 갔는가**이며, 그것만 라벨과 툴팁에 적는다.
 * @param geoRef layoutGraph/layoutAll이 만든 geo 객체 (edges·nodes)
 */
function renderBlocks(blocks, geoRef) {
  if (!blocks || !blocks.length || !geoRef) return '';
  let out = '';
  const byEdge = {};
  blocks.forEach((b) => {
    if (b.kind === 'wait') { if (simT < b.t0 || simT > b.t1) return; }
    else if (simT < b.t0 || simT > b.t0 + 1.8) return;   // 드롭은 순간 — 잠깐만 튄다
    const k = b.from + '>' + b.to;
    (byEdge[k] = byEdge[k] || []).push(b);
  });
  Object.keys(byEdge).forEach((k) => {
    const items = byEdge[k];
    const [from, to] = k.split('>');
    // 그 쌍의 계선 중 status(교전현황)를 먼저 찾고, 없으면 아무 계선, 그것도 없으면 노드.
    const es = geoRef.edges.filter((e) => e.from === from && e.to === to);
    const edge = es.find((e) => e.kind === 'status') || es[0] || null;
    const at = (frac) => {
      if (edge && edge.el) return edge.el.getPointAtLength(edge.len * frac);
      const n = slotPos(geoRef, from, 'up');
      return n ? { x: n.x + 14, y: n.y } : null;
    };
    const waits = items.filter((b) => b.kind === 'wait');
    const drops = items.filter((b) => b.kind === 'drop');
    waits.slice(0, 8).forEach((b, i) => {
      const p = at(0.10 + i * 0.05);
      if (!p) return;
      const forever = !isFinite(b.t1);
      out += `<circle class="wait-dot${forever ? ' forever' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5">` +
        `<title>${esc((b.th || '') + ' — ' + fmt(b.t0) + '부터 대기 중' +
          (forever ? ' (관측 종료까지 못 감)' : ' → ' + fmt(b.t1) + ' 출발') +
          '\n계선은 있으나 채널이 비지 않아 떠나지 못한다')}</title></circle>`;
    });
    if (waits.length) {
      const p = at(0.10);
      const oldest = Math.min.apply(null, waits.map((b) => b.t0));
      if (p) out += `<text class="blocklab" x="${(p.x + 9).toFixed(1)}" y="${(p.y - 9).toFixed(1)}">` +
        `막힘 ${waits.length}건 · ${(simT - oldest).toFixed(0)}초째</text>`;
    }
    drops.forEach((b) => {
      const p = at(0.10);
      if (!p) return;
      const age = (simT - b.t0) / 1.8;
      out += `<g class="drop-x" opacity="${(1 - age).toFixed(2)}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">` +
        `<line x1="-6" y1="-6" x2="6" y2="6"></line><line x1="-6" y1="6" x2="6" y2="-6"></line>` +
        `<title>${esc((b.th || '') + ' — ' + fmt(b.t0) + ' 채널 용량 초과로 버려짐(출발 못 함)')}</title></g>`;
    });
  });
  return out;
}

function paintClock() {
  if (!run || (view === 'track' && !sel)) { el('clock').textContent = '—'; return; }
  el('clock').textContent = fmt(simT) + ' / ' + fmt(viewT1());
  const t0 = viewT0(), span = Math.max(1e-6, viewT1() - t0);
  el('scrub').value = String(Math.round((simT - t0) / span * 1000));
}

/**
 * ⚠️ 재생 시계를 `requestAnimationFrame`으로 돌리지 않는다. 탭이 배경으로 가면 rAF는
 *    **정지**하고, 재생 버튼은 눌린 채로 시계만 멈춰 버린다(실측 — 2.5초 동안 시각 불변).
 *    타이머는 배경에서 느려질 뿐 계속 돌고, 경과는 벽시계(performance.now)에서 재므로
 *    화면이 끊길지언정 **시각이 어긋나지는 않는다**.
 */
function tick() {
  if (!playing || !run) return;
  const wall = performance.now();
  const dt = Math.min(.5, (wall - lastWall) / 1000);   // 탭 복귀 시 한 번에 튀는 것을 막는다
  lastWall = wall;
  simT += dt * speed;
  if (simT >= viewT1()) { simT = viewT1(); setPlaying(false); }
  drawFrame();
}

function setPlaying(on) {
  playing = on;
  el('play').textContent = on ? '❚❚' : '▶';
  el('play').classList.toggle('on', on);
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (on) {
    if (run && simT >= viewT1()) simT = viewT0();
    lastWall = performance.now();
    timerId = setInterval(tick, 33);
  }
}

el('lm-c2').addEventListener('click', () => { if (run && view === 'all') { allLogMode = 'c2'; renderAllLog(); } });
el('lm-bot').addEventListener('click', () => { if (run && view === 'all') { allLogMode = 'bot'; renderAllLog(); } });
el('log-trk-sel').addEventListener('change', (e) => { allLogC2Id = e.target.value; renderAllLog(); });
/** 그래프 칸의 크기가 바뀌면 다시 세운다 — 창 크기 변경과 패널 접기가 **같은 길**을 쓴다. */
function relayout() {
  if (view === 'all' && run) { layoutAll(); drawFrame(); }
  else if (sel) { layoutGraph(); drawFrame(); }
}
window.addEventListener('resize', relayout);

/**
 * 왼쪽 패널 접기/펴기.
 *
 * 접으면 그래프 칸이 549 → 889px로 넓어지고 열폭이 61 → 98.8px가 된다(800px 창 실측).
 * 그제서야 중앙 C2·ICC의 **이름과 케파 실린더가 읽히고**, 왼쪽 `ICC C1 ↑중계`와 오른쪽
 * `ICC C1`이 같은 부대라는 것이 눈에 들어온다 — 좁을 때 좌우가 서로 다른 조직처럼
 * 보이던 오독의 원인 하나가 그냥 폭 부족이었다.
 *
 * ⚠️ 그래도 **없애지 않는다.** 병목 로그의 줄은 항적 개별로 내려가는 입구이고(openRowTracks),
 *    그것을 지우면 그래프의 느린 점을 찍는 길 — 105개 항적이 겹친 화면에서 사실상 닿지 않는
 *    길 — 로 되돌아간다. 접는 것은 발표용 상태이지 기본 상태가 아니다.
 * ⚠️ 밀집 열(센서 19 · ECS 15 · 사수 15)은 접어도 나아지지 않는다(노드당 33.4 → 35.3px).
 *    그 자리는 세로 공간에 묶여 있어서, 열 너비 배분을 고치기 전에는 안 풀린다.
 */
function setSide(open) {
  el('side').hidden = !open;
  const b = el('side-toggle');
  b.textContent = open ? '‹ 패널 접기' : '› 패널 펴기';
  b.title = open ? '왼쪽 패널을 접고 그래프를 넓게 쓴다'
    : '노드 부하 순위·이벤트 로그를 다시 연다 — 로그 줄이 항적 개별로 내려가는 입구다';
  b.classList.toggle('on', !open);
  relayout();
}
el('side-toggle').addEventListener('click', () => setSide(el('side').hidden));

// 보기 전환
el('v-all').addEventListener('click', () => { if (run) setView('all'); });
el('v-track').addEventListener('click', () => { if (run) setView('track'); });

// 전체 보기의 느린 전문 점 클릭 → 그 항적의 개별 보기로 내려간다.
// 점은 매 프레임 다시 만들어지므로 위임으로 받는다.
el('graph').addEventListener('click', (ev) => {
  const dot = ev.target.closest && ev.target.closest('.dot[data-th]');
  if (!dot || view !== 'all' || !run) return;
  ev.stopPropagation();
  // 점을 눌렀을 때 보던 시각을 그대로 넘긴다 — 개별 보기로 내려가며 처음으로 되감기면
  // 문맥이 끊긴다. 로그 줄 클릭과 **같은 함수**를 쓴다(두 벌을 두면 동선이 갈라진다).
  drillToTrack(dot.dataset.th, simT);
}, true);

el('status').textContent = '커널 로딩 완료 — [실행]을 누르세요.';
</script>
</body>
</html>
