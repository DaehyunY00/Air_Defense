<text x="20" y="352" font-size="11.2" fill="#44525e">KAMDOC의 제안(35.9 발신)이 THAAD 지휘소에 54.0에, THAAD 지휘소의 제안(51.7 발신)이 KAMDOC에 78.6에 닿아 서로 「내 자산이 최적」으로 회신 — 음성 지연 속에 두 지휘소가 각자 사수를 지정합니다.</text>
<text x="20" y="369" font-size="11.2" fill="#44525e">THAAD 1발 빗나감(272.8) 뒤 재협조(273.3 → 292.8 → 317.6)는 음성이라 늦지만, 중복 지정된 L-SAM 중북이 282.7에 쏘아 324.2에 명중. 결심 지휘소 2곳 · 음성 왕복 4회 · 교신 노드 11 · 발사 2 · 중복이 보험이 된 경우.</text>
<text x="20" y="404" font-size="15" font-weight="700" fill="#143d5c">To-Be (Kill-web 통합형) — srbm#3 · 통합공중작전통제소가 1초 만에 중북 L-SAM 한 곳을 지정(THAAD 양보) · 그 한 발이 빗나가 360.2초 누수</text>
