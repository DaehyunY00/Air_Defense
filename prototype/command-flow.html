<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지휘 흐름 — 케파·병목과 항적별 전문 이동 (프로토타입)</title>
<!--
  무엇을 보는 화면인가
  ────────────────────
  지도가 아니라 **계선(간선)** 위에서 전문이 움직이는 것을 본다. 두 보기가 있다.

  · [전체 흐름] — 배치 전체(251노드)를 세우고 전 항적을 겹친다. 노드 테두리 링이
    처리중/서버수만큼 차오르고(가득=노랑, 가득+대기=빨강), 큐 대기는 점 꼬리로 쌓이고,
    대기실 초과 즉시 드롭은 붉은 섬광으로 튄다. 좌측에 부하 순위와 「C2 처리|병목」 로그
    (C2 처리 = 노드 하나의 도착·대기·처리·드롭 — 실린더가 차오르는 것을 줄로 읽는 자리).
    느린 매체(≥10초)만 개별 점으로 그리고 빠른 매체는 선 맥동으로 집약한다.
  · [항적 개별] — 항적 하나의 전문 이동을 따라간다. 점 하나가 전문 한 건이고,
    점이 선을 건너는 데 걸리는 시간이 곧 그 계선의 실제 지연이다. 그래서 **빠르면
    데이터링크, 기어가면 음성·문자·VTC**로 눈에 바로 들어온다.
  전체 보기의 느린 점을 클릭하면 그 항적의 개별 보기로 내려간다. **병목 로그의 줄도 같은
  입구다** — 항적이 걸린 줄(누수·중복교전·계선 막힘·넘침)을 누르면 그 사건이 난 시각으로
  맞춰진 채 개별 보기가 열리고, 여러 항적이 묶인 줄은 눌러서 펼친 뒤 고른다.

  좌→우를 읽는 장치 (두 보기 공통)
  ──────────────────────────────
  · **작업 맥동** — 지금 일하는 노드가 깜빡이고, **그 주기가 곧 처리 중인 작업의 실제
    서비스 시간**이다. ECS(평균 3.5초)는 빠르게 깜빡이고 MCRC·KAMDOC(37.5초)·사수
    (40~60초)는 느리게 고동친다. 속도를 읽는 자리가 흐름이 벌어지는 자리와 같아야
    하므로 **별도의 속도계를 화면 위쪽에 따로 세우지 않는다**(사용자 결정).
    ⚠️ 노드 글리프에 초를 **글자로 적지 않는다**(사용자 결정) — 빠르기는 맥동으로만
       말한다. 시각별 수치는 왼쪽 「어디서 막혔나」·이벤트 로그가 이미 초 단위로 적는다.
  · **교신 맥동** — 전문을 주고받는 중인 노드의 테두리가 고동친다. 주기 = 그 전문의
    실제 전송 시간(작업 맥동과 같은 클립 규칙). 처리 중이면 작업 맥동이 우선하고,
    센서 보고(report-cycle)는 세지 않는다. 열 띠(밝아진 열)는 히스테리시스를 두어
    깜빡이지 않는다 — **깜빡임은 노드의 몫, 띠는 배경**이다(사용자 결정 2026-08-30).
  · **화살촉** — 점이 지나가지 않는 동안에도 계선의 방향이 보인다. 붉은 화살촉은
    역방향(승인 협조·교전명령 하달)이다.
  · **밝아진 열 · 킬체인 프론티어** — 지금 일이 벌어지는 단계가 밝아지고, 항적 개별
    보기에서는 계선이 도달한 가장 오른쪽 열에 파란 점선이 선다. 시간이 흐르면 밝은
    띠와 점선이 왼쪽에서 오른쪽으로 옮겨 간다 — 그것이 「항적이 움직이니 C2가
    차례로 반응한다」의 그림이다.

  ⚠️ 좌표·시각을 지어내지 않는다. 모든 점의 출발·도착 시각은 `KJ.runDES({flowTrace:true})`가
     기록한 실제 실행값이다(엔진 `_recordLink`/`_flowEvent` — 순수 관측, RNG·동역학 불변).
     지연 분포가 뽑은 값 그대로이므로 같은 매체라도 건마다 시간이 다르다.

  이 파일은 **프로토타입**이다. 본 앱(index.html)에는 아직 붙이지 않았다.
  실행: 저장소 루트에서 정적 서버를 띄우고 /prototype/command-flow.html 을 연다.
        (file:// 로는 안 된다 — ES 모듈 import가 막힌다)
-->
<style>
  :root {
    --bg: #0b1017; --panel: #111823; --panel2: #0d1117; --line: #1e2937;
    --fg: #dbe4f0; --dim: #7d8ba0; --accent: #4da3ff;
    --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input { font: inherit; color: var(--fg); background: #16202e;
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ── 상단 실행 바 ── */
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: -.01em; }
  header label { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  #status { margin-left: auto; color: var(--dim); font-size: 12px; }
  .modesw { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .modesw button { border: 0; border-radius: 0; padding: 4px 12px; }

  /* 조작 손잡이 줄은 걷어냈다(URL 파라미터로만 조작). 남은 것은 재실행 알림뿐. */
  .dim { color: var(--dim); }
  /* 고정 배치 표기 — 조작은 못 하되 어떤 배치인지는 늘 보여야 한다 */
  #dep-fixed { color: var(--dim); font-size: 12px; }
  #dep-fixed b { color: var(--fg); font-weight: 600; }
  #dirty { margin-left: auto; color: #04121f; background: var(--warn); font-weight: 700;
    padding: 2px 9px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  header #status { margin-left: 10px; }

  /* 계선 매체 교체 팝오버 */
  #pop { position: fixed; z-index: 40; width: 300px; padding: 10px;
    background: var(--panel); border: 1px solid #33456b; border-radius: 8px;
    box-shadow: 0 12px 34px rgba(0,0,0,.6); font-size: 12px; }
  #pop-title { font-weight: 700; margin-bottom: 2px; }
  #pop-body { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
  #pop-body button { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
  #pop-body button .h { color: var(--dim); font-size: 11px; }
  #pop-warn { color: var(--warn); font-size: 11px; line-height: 1.45; margin-bottom: 8px; }
  .edge.hot { opacity: .95 !important; }
  .edge { cursor: pointer; }
  .edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  .edge.overridden { stroke-dasharray: 1 5 !important; }
  .ovrmark { fill: var(--warn); font-size: 11px; }

  /* ── 본문 3분할 ── */
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 340px; flex: none; display: flex; flex-direction: column;
    background: var(--panel2); border-right: 1px solid var(--line); min-height: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* 패널 접기 — 발표할 때는 그래프가 주인공이고, 분석할 때는 로그가 항적으로 내려가는
     입구다. 둘 중 하나를 고를 이유가 없어 **없애지 않고 접는다**.
     ⚠️ `#side{display:flex}`가 UA 기본 `[hidden]{display:none}`을 **이긴다** — 바로 아래
        .sec에서 이미 겪은 그 함정이라, hidden 규칙을 여기서도 명시해야 한다. */
  #side[hidden] { display: none; }

  .sec { display: flex; flex-direction: column; min-height: 0; }
  /* ⚠️ `.sec{display:flex}`는 브라우저 기본 `[hidden]{display:none}`을 **이긴다**(작성자 규칙이
     UA 규칙보다 우선). 이 한 줄이 없으면 hidden을 걸어도 그대로 보인다 — 실제로 전체 흐름
     보기에서 「어디서 막혔나」 빈 제목이 남았다. */
  .sec[hidden] { display: none; }
  .sec > h2 { font-size: 11px; margin: 0; padding: 7px 10px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--line);
    text-transform: none; letter-spacing: .02em; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .scroll { overflow-y: auto; overflow-x: hidden; }

  /* 항적 목록 */
  #tracks { flex: 0 0 34%; }
  #track-list { padding: 2px 0; }
  .trk { display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer;
    border-left: 3px solid transparent; }
  .trk:hover { background: #16202e; }
  .trk.sel { background: #17293f; border-left-color: var(--accent); }
  .trk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk .sub { color: var(--dim); font-size: 11px; }
  .pill { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: #1c6448; }
  .pill.bad { color: var(--bad); border-color: #6b2b2b; }
  .pill.idle { color: var(--dim); border-color: var(--line); }
  .pill.dup { color: #f0a060; border-color: #6b4a20; }

  #tracks { flex: 0 0 34%; }

  /* 이벤트 로그 */
  #log { flex: 1; }
  #log-body { padding: 2px 0 40px; }
  /* 전체 흐름 좌하단 로그의 모드 스위치(항적/병목)·항적 선택줄.
     ⚠️ display를 직접 주는 요소는 [hidden]을 이긴다(#signal과 같은 함정) — 짝을 꼭 둔다. */
  .minisw { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex: none; }
  .minisw[hidden] { display: none; }
  .minisw button { border: 0; border-radius: 0; padding: 1px 8px; font-size: 11px; }
  #log-trk-bar { display: flex; gap: 6px; padding: 4px 10px 3px; align-items: center;
    border-bottom: 1px solid var(--line); }
  #log-trk-bar[hidden] { display: none; }
  #log-trk-bar select { flex: 1; min-width: 0; font-size: 12px; padding: 2px 6px; }
  #log-trk-bar button { flex: none; font-size: 11px; padding: 2px 8px; white-space: nowrap; }
  .ev { display: flex; gap: 7px; padding: 2px 10px; border-left: 3px solid transparent; align-items: baseline; }
  .ev .t { color: var(--dim); flex: none; width: 52px; text-align: right; font-size: 11px; }
  .ev .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 줄 사이에 흐른 시간. **붉은 것은 병목(대기·막힘)뿐이다** — 공백은 C2가 막은 것이
     아니고(ADR-083 ④) 처리·이동은 일한 시간이라, 같이 붉히면 「C2가 막았다」가 부풀려진다.
     ⚠️ .now/.past보다 **먼저** 선언한다. 붉은 배경이 현재 줄 강조를 덮으면 어디를
        재생 중인지 놓친다(왼쪽 붉은 띠는 inset 그림자라 그대로 남는다). */
  .ev .gap { flex: none; font-size: 10px; color: var(--dim); white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .ev.stall { background: rgba(248,113,113,.09); box-shadow: inset 3px 0 0 var(--bad); }
  .ev.stall .gap { color: var(--bad); font-weight: 700; }
  .ev.future { opacity: .32; }
  .ev.now { background: #17293f; border-left-color: var(--accent); }
  .ev.past { opacity: .72; }
  .ev.link .x::before { content: '↦ '; color: var(--dim); }
  .ev.mark .x::before { content: '· '; color: var(--dim); }
  .ev .med { font-size: 10px; padding: 0 4px; border-radius: 3px; margin-left: 4px; }
  /* 지휘 축 꼬리표 — 같은 문구의 마크(승인완료 등)가 어느 계통 것인지 가른다 */
  .ev .lane { color: var(--dim); border: 1px solid var(--line); }
  /* 요격탄 단가 대 위협 가치 — 고가 유도탄(≥5 M$)은 붉게 */
  .ev .cost { color: var(--dim); border: 1px solid var(--line); }
  .ev .cost.hi { color: var(--bad); border-color: #6b2b2b; font-weight: 700; }

  /* 신호등 — 그래프 **하단 빈 공간**에 띄운다. 노드는 위쪽에 몰리고 아래가 비므로
     그림을 가리지 않고, 바로 밑 재생 컨트롤과 붙어 스크럽하며 읽기 좋다. */
  #signal { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 5;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; pointer-events: none; }
  /* ⚠️ `.sec`와 **똑같은 함정**이다(위 주석 참조) — 작성자의 `display:flex`가 UA 기본
     `[hidden]{display:none}`을 이긴다. 이 한 줄이 없으면 setView('all')이 hidden을 걸어도
     신호등이 그대로 남아, 전체 흐름 보기에 **직전에 보던 항적의** 「격추 완료」가 떠 있다
     (실측). 전 항적을 겹쳐 보는 화면에 항적 하나의 상태를 띄우는 것이라 그냥 오답이다. */
  #signal[hidden] { display: none; }
  .sig { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 13px; font-size: 12px; font-weight: 600;
    background: rgba(11,16,23,.92); border: 1px solid; backdrop-filter: blur(2px); }
  .sig .lamp { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sig .sub { font-weight: 400; opacity: .75; font-size: 11px; }
  .sig.go    { border-color: #1c6448; color: var(--ok); }
  .sig.go    .lamp { background: var(--ok); }
  .sig.wait  { border-color: #6b5220; color: var(--warn); }
  .sig.wait  .lamp { background: var(--warn); animation: blink 1.1s infinite; }
  .sig.stop  { border-color: #6b2b2b; color: var(--bad); }
  .sig.stop  .lamp { background: var(--bad); animation: blink .7s infinite; }
  .sig.idle  { border-color: var(--line); color: var(--dim); }
  .sig.idle  .lamp { background: #44506a; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* 막힌 지점 강조 — 신호등이 가리키는 곳을 그래프에서도 짚는다 */
  .blockmark { fill: none; stroke: var(--bad); stroke-width: 2.5; animation: blink 1.1s infinite; }
  .blockmark.wait { stroke: var(--warn); }
  .wantpath { fill: none; stroke: var(--bad); stroke-width: 5; opacity: .3;
    stroke-dasharray: 9 6; animation: crawl 1.4s linear infinite; }
  @keyframes crawl { to { stroke-dashoffset: -15; } }

  /* 그래프 */
  /* ⚠️ 종전에는 overflow:hidden + svg height:100% + preserveAspectRatio meet 이라
     **세로가 길어질수록 전체가 축소**됐다 — 노드를 더 그리면 정작 봐야 할 것이 작아지는
     구조였다(사용자 지적 2026-09-02). 이제 세로로 스크롤한다: viewBox가 길어지면 그린 것이
     작아지는 게 아니라 화면이 길어진다. 가로는 항상 폭에 맞춘다. */
  #graph-wrap { flex: 1; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; }
  svg#graph { width: 100%; height: auto; display: block; }
  .colhdr { fill: #55637a; font-size: 10px; }
  .colband { fill: #0e1520; }
  .colband.alt { fill: #0b1017; }
  .nlabel { fill: #b7c4d6; font-size: 10px; }
  .nsub { fill: #61708a; font-size: 9px; }
  .ncirc { fill: #16202e; stroke: #34435a; stroke-width: 1.5; }
  .ncirc.sensor { stroke: #22d3ee; }
  .ncirc.c2 { stroke: #4da3ff; }
  .ncirc.shooter { stroke: #34d399; }
  .ncirc.busy { fill: #1d3a52; stroke-width: 2.5; }
  .ncirc.queued { stroke-dasharray: 3 2; }
  /* 이 항적과 무관한 노드 — [전체 흐름]과 **같은 자리**에 흐릿하게 남긴다.
     자리를 지워 버리면 「어디를 안 거쳤나」가 안 보이고, 탭을 오갈 때 배치가 달라져
     눈이 매번 다시 익혀야 한다(사용자 결정 2026-09-02). */
  .idleg { opacity: .34; }
  .idleg:hover { opacity: .85; }
  .idlen { fill: #131c28; stroke: #33445c; stroke-width: 1.2; }
  .idlen.sensor { stroke: #1c8ea3; }
  .idlen.c2 { stroke: #3a72b0; }
  .idlen.shooter { stroke: #2a8f6c; }
  .idlelabel { fill: #6b7a91; font-size: 9px; }
  .edge { fill: none; stroke-linecap: round; }
  .dot { stroke: #04121f; stroke-width: .8; }
  .dotlab { font-size: 9px; fill: #cfe0f5; paint-order: stroke; stroke: #04121f; stroke-width: 2.5; }
  .qbadge { font-size: 9px; fill: #fbbf24; }

  /* ── 좌→우 방향 표기 (ADR-088) ────────────────────────────────────────────
     간선이 어느 쪽으로 흐르는지 **정지 상태에서도** 보여야 한다. 종전에는 점이
     지나갈 때만 방향을 알 수 있었고, 점이 없는 동안(대부분의 시간)에는 선이
     양방향처럼 보였다. 화살촉을 선 위 62% 지점에 접선 방향으로 박는다. */
  .earrow { opacity: .55; }
  .earrow.back { opacity: .8; }
  /* 열 활성 — 지금 무슨 일이 벌어지는 열을 밝힌다. 시간이 흐르면 밝은 띠가
     좌에서 우로 옮겨 가고, 그것이 곧 「항적의 움직임에 C2가 반응하는」 그림이다. */
  .colband { transition: fill .18s linear; }
  .colband.live { fill: #15212f; }
  .colband.alt.live { fill: #111c28; }
  /* 킬체인 진행 프론티어 — 이 항적의 계선이 지금까지 도달한 가장 오른쪽 열 */
  .frontier { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .7; }
  .frontier-lab { font-size: 10px; fill: var(--accent); font-weight: 700;
    paint-order: stroke; stroke: #0b1017; stroke-width: 3; }


  /* ── 전체 흐름 보기 ── */
  /* (케파 링은 DB 실린더로 대체됐다 — ADR-088 이전 표기) */

  /* DB 실린더 케파 — 처리 슬롯이 아래에서 차오르고 대기는 위로 쌓인다 */
  .cyl-bg { fill: #131c28; }
  .cyl-edge { fill: none; stroke: #34435a; stroke-width: 1.4; }
  .cyl-cap { fill: #1b2637; stroke: #34435a; stroke-width: 1.4; }
  .cyl-fill { fill: var(--accent); opacity: .85; transition: none; }
  .cyl.full .cyl-fill { fill: var(--warn); }
  .cyl.jam  .cyl-fill { fill: var(--bad); }
  /* ── 작업 맥동 — 「빠르면 빨리, 느리면 천천히 깜빡인다」 (ADR-088) ─────────
     작업중인 노드가 깜빡이고, **그 주기가 곧 지금 처리 중인 작업의 서비스 시간**이다.
     ECS(평균 3.5초)는 빠르게 깜빡이고 MCRC·KAMDOC(평균 37.5초)는 느리게 고동친다 —
     화면 어디가 빠르고 어디가 굼뜬지를 숫자 이전에 눈이 잡는다.

     ⚠️ 주기는 **인라인 style로만** 준다(applyPulse). 여기 duration을 적으면 인라인을
        덮거나 덮여서 「같은 속도로 깜빡이는 화면」으로 조용히 되돌아간다.
     ⚠️ 높이·색은 건드리지 않는다 — 처리중/서버수와 포화 단계는 계속 읽혀야 한다.
        흔드는 것은 투명도뿐이고, .25까지 떨구면 눈금이 사라지므로 .42에서 멈춘다. */
  .cyl.working .cyl-fill { animation: cylwork ease-in-out infinite; }
  .cyl.working .cyl-edge { animation: cylrim ease-in-out infinite; }
  @keyframes cylwork { 0%, 100% { opacity: .88 } 50% { opacity: .42 } }
  /* 테두리는 색과 굵기를 함께 흔든다 — 색만 바꾸면 어두운 배경에서 진폭이 안 보인다. */
  @keyframes cylrim  { 0%, 100% { stroke: #34435a; stroke-width: 1.2 } 50% { stroke: #7fb6ff; stroke-width: 2.6 } }
  .cyl.full.working .cyl-edge { animation-name: cylrim-full; }
  .cyl.jam.working  .cyl-edge { animation-name: cylrim-jam; }
  @keyframes cylrim-full { 0%, 100% { stroke: #34435a; stroke-width: 1.2 } 50% { stroke: var(--warn); stroke-width: 2.6 } }
  @keyframes cylrim-jam  { 0%, 100% { stroke: var(--bad); stroke-width: 2 } 50% { stroke: #ffd0d0; stroke-width: 3 } }
  /* 실린더를 못 그린 자리(밀집 열·센서·사수)의 동그라미도 **같은 규칙으로** 깜빡인다.
     사수의 발사 처리는 40~60초라 눈에 띄게 느리게 고동친다 — 그것이 사실이다. */
  .ncirc.busy { animation: circwork ease-in-out infinite; }
  @keyframes circwork { 0%, 100% { fill: #3b6f9c; stroke: #7fb6ff; stroke-width: 2.6 } 50% { fill: #16202e; stroke: #34435a; stroke-width: 1.5 } }
  /* ── 교신 맥동 — 전문을 실제로 주고받는 중인 노드의 테두리가 고동친다 ─────────
     처리(작업 맥동)와 별개의 신호다: 지금 이 노드를 끝점으로 전문이 계선 위에 떠 있는
     동안 테두리만 흔든다. 주기 = 그 전문의 실제 전송 시간(배속 나눔·PULSE 클립 —
     작업 맥동과 같은 규칙, 지어낸 주기가 아니다).
     ⚠️ 처리 중이면 작업 맥동이 이긴다(:not 가드) — 두 애니메이션이 같은 요소를 두고
        싸우면 어느 쪽도 읽히지 않는다.
     ⚠️ 센서 보고(report-cycle)는 세지 않는다 — 주기 보고가 상시 흐르는 센서·ECS 열이
        영영 깜빡여 신호가 아니라 소음이 된다(점 표시의 SLOW 집약과 같은 이유). */
  .ncirc.talking:not(.busy) { animation: circtalk ease-in-out infinite; }
  @keyframes circtalk { 0%, 100% { stroke-width: 1.5 } 50% { stroke: #7fb6ff; stroke-width: 3.2 } }
  .cyl.talking:not(.working) .cyl-edge { animation: cylrim ease-in-out infinite; }
  .cyl.jam  .cyl-edge { stroke: var(--bad); stroke-width: 2; }
  .cyl-tick { stroke: #0b1017; stroke-width: 1; opacity: .8; }
  .cyl-num { font-size: 9.5px; font-weight: 700; fill: #dbe4f0;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.4; pointer-events: none; }
  /* 케파 단위 — C2 「석」(결심 슬롯) · 포대 「발」(동시교전 채널). 두 실린더가 같은 모양이라
     단위 없이 숫자만 견주면 서로 다른 양을 비교하게 된다(실제 오독 문답). */
  .cyl-num .u { font-size: 6.5px; font-weight: 400; fill: var(--dim); }
  /* 대기 디스크 — 쌓일수록 위로 자란다 */
  .cyl-qd { fill: var(--warn); opacity: .9; }
  .cyl.jam .cyl-qd { fill: var(--bad); }
  .cyl-qn { font-size: 9px; font-weight: 700; fill: var(--bad);
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.4; }
  /* 이 항적의 작업 — 남의 줄 속에서 내 것이 어디인지 */
  .cyl-qd.mine { fill: #fff; stroke: var(--accent); stroke-width: 1.4; }
  .cyl.mine-service .cyl-edge { stroke: #fff; stroke-width: 2.2; }
  .cyl-mine { font-size: 9px; font-weight: 700; fill: #fff;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.6; pointer-events: none; }
  .nodeg.idle { opacity: .28; }
  .nodeg { cursor: pointer; }
  .nodeg.focus .ncirc { stroke: #fff; stroke-width: 2.2; }
  /* 「가야 했으나 닿지 못한」 노드·계선 — 실패 증거(failure.evidence·unreached·commanders)의
     관측 표시. 실패 시각 전에는 옅게(아직 벌어지지 않은 일), 지나면 또렷하게. */
  .nodeg.ghost { opacity: .28; }
  .nodeg.ghost.on { opacity: .92; }
  .nodeg.ghost .ncirc { fill: none; stroke: var(--bad); stroke-dasharray: 3 3; }
  .nodeg.ghost .nlabel { fill: var(--bad); }
  .gedge { opacity: .22; }
  .gedge.on { opacity: .85; }
  .gedge path { fill: none; stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 6 4; }
  .gedge .gx { stroke: var(--bad); stroke-width: 2; }
  /* 센서 점등 — 이 항적을 잡고 있는 센서의 테두리 불. 탐지(하늘) → 추적(파랑) → 사통(초록). */
  .nodeg.s-det .ncirc { stroke: #22d3ee; stroke-width: 2.6; filter: drop-shadow(0 0 3px #22d3ee); }
  .nodeg.s-trk .ncirc { stroke: #4da3ff; stroke-width: 3; filter: drop-shadow(0 0 4px #4da3ff); }
  .nodeg.s-fc  .ncirc { stroke: var(--ok); stroke-width: 3; filter: drop-shadow(0 0 5px #34d399); }
  .nodeg.s-det .qbadge { fill: #22d3ee; }
  .nodeg.s-trk .qbadge { fill: #4da3ff; }
  .nodeg.s-fc  .qbadge { fill: var(--ok); }
  .qtail { font-size: 9px; fill: var(--warn); paint-order: stroke; stroke: #0b1017; stroke-width: 2; }
  .flash { fill: none; stroke: var(--bad); stroke-width: 2; opacity: .9; pointer-events: none; }
  /* 「못 가는」 전문 — 움직이는 점(채운 원)과 반드시 달라 보여야 한다: 점선 테두리 빈 원 */
  .wait-dot { fill: rgba(251,191,36,.12); stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 3 2; }
  .wait-dot.forever { stroke: var(--bad); fill: rgba(248,113,113,.14); }
  .blocklab { font-size: 9.5px; fill: var(--warn); font-weight: 700;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.6; }
  .drop-x line { stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
  /* 종결 배너 — 격추/누수를 그래프 위에 못박는다 */
  .endbanner { pointer-events: none; }
  .endbanner rect { fill: rgba(11,16,23,.9); stroke-width: 1.5; }
  .endbanner text { font-size: 12px; font-weight: 700; }
  .endbanner .sub { font-size: 10px; font-weight: 400; }
  .endbanner.leak rect { stroke: var(--bad); }
  .endbanner.leak text { fill: var(--bad); }
  .endbanner.leak .sub { fill: #c9899a; }
  .endbanner.kill rect { stroke: #1c6448; }
  .endbanner.kill text { fill: var(--ok); }
  .edge.hot { opacity: .95 !important; }
  svg.hide-sensor .sensor-edge { display: none; }
  .dot[data-th] { cursor: pointer; }

  /* 부하 순위 */
  .rk { display: flex; align-items: center; gap: 7px; padding: 3px 10px; cursor: pointer;
    border-left: 3px solid transparent; font-size: 12px; }
  .rk:hover { background: #16202e; }
  .rk.focus { background: #17293f; border-left-color: var(--accent); }
  .rk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .bar { flex: none; width: 64px; height: 7px; background: #1a2534; border-radius: 3px; overflow: hidden; }
  .rk .bar i { display: block; height: 100%; background: var(--accent); }
  .rk.full .bar i { background: var(--warn); }
  .rk.jam .bar i { background: var(--bad); }
  .rk .st { flex: none; width: 86px; text-align: right; color: var(--dim); font-size: 11px; }
  .rk .st b { color: var(--fg); font-weight: 600; }
  .rk .st .dr { color: var(--bad); }

  /* 병목 로그 색 — 넘침·기한 만료(둘 다 실제 드롭)는 붉게, 큐 정리(항적 종결)는 흐리게 */
  .ev.overflow .x { color: var(--bad); }
  .ev.ttl .x { color: #f0a060; }
  .ev.dead .x { color: var(--dim); }
  .ev.sat .x { color: var(--warn); }
  .ev.chdrop .x { color: var(--bad); font-weight: 600; }
  .ev.leak .x { color: var(--bad); font-weight: 700; }
  .ev.leak .t { color: var(--bad); }
  .ev.dup .x { color: #f0a060; font-weight: 600; }
  .ev.chwait .x { color: var(--warn); }
  .ev.block .x { color: var(--warn); }
  /* 항적이 걸린 줄은 눌러서 그 항적의 개별 보기로 내려간다. 화살표는 **별도 칸**으로 둔다 —
     .x 안에 넣으면 말줄임(ellipsis)에 잘려 「누를 수 있다」가 긴 줄에서만 사라진다. */
  .ev.hit { cursor: pointer; }
  .ev.hit:hover { background: #17293f; }
  .ev .go { flex: none; font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ev.hit:hover .go { color: var(--accent); }
  /* 여러 항적이 묶인 줄을 펼친 목록 — 시각 칸(52px+간격) 밑으로 들여 쓴다 */
  .evsub { padding: 1px 10px 5px 62px; }
  .evtrk { display: flex; gap: 6px; align-items: baseline; padding: 2px 7px; cursor: pointer;
    border-left: 2px solid var(--line); }
  .evtrk:hover { background: #17293f; border-left-color: var(--accent); }
  .evtrk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #ticks i.bad { background: var(--bad); height: 9px; }

  /* 하단 재생 바 */
  #transport { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
  /* 스크럽 막대 위에 사건 눈금을 겹쳐 둔다 — 눈금이 없는 넓은 구간이 곧 「아무 일도
     일어나지 않는 시간」이고, 그것을 안 보이게 두면 재생이 멈춘 것으로 오해된다. */
  #scrub-wrap { flex: 1; min-width: 180px; position: relative; display: block; }
  #ticks { position: absolute; left: 0; right: 0; top: 2px; height: 7px; pointer-events: none; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 7px; background: #64809f; }
  #scrub { width: 100%; accent-color: var(--accent); margin-top: 6px; }
  #clock { font-size: 12px; color: var(--fg); min-width: 118px; }
  .spd button { padding: 3px 7px; font-size: 11px; }
  /* 접이식 범례 — 접힌 줄만 상시 보이고, 펼치면 전체가 나온다 */
  #legend-box { flex: none; background: var(--panel2); border-top: 1px solid var(--line);
    max-height: 46%; overflow-y: auto; }
  #legend-box > summary { list-style: none; cursor: pointer; user-select: none;
    padding: 5px 12px; font-size: 11px; color: var(--dim); }
  #legend-box > summary::-webkit-details-marker { display: none; }
  #legend-box > summary::before { content: '▸ '; color: var(--accent); }
  #legend-box[open] > summary::before { content: '▾ '; }
  #legend-box > summary:hover { color: var(--fg); background: #16202e; }
  #legend { display: flex; gap: 4px 10px; flex-wrap: wrap; padding: 2px 12px 8px;
    font-size: 11px; color: var(--dim); }
  #legend b { color: var(--fg); font-weight: 600; }
  .lg { display: inline-flex; align-items: center; gap: 5px; }
  .lg i { width: 20px; height: 0; border-top-width: 3px; border-top-style: solid; display: inline-block; }

  .empty { padding: 24px 14px; color: var(--dim); text-align: center; line-height: 1.7; font-size: 12px; }
  .note { padding: 6px 10px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }
  code { background: #16202e; padding: 0 3px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>🛰 지휘 흐름</h1>
  <label>시나리오 <select id="sc"></select></label>
  <span id="dep-fixed" title="이 화면은 배치를 고정한다 — 본 앱·기준선과 같은 legacy 정상 배치">배치 <b></b></span>
  <span class="modesw">
    <button id="m-asis" class="on">As-Is 분절형</button><button id="m-tobe">To-Be 통합형</button>
  </span>
  <label>seed <input id="seed" class="mono" type="number" value="29" style="width:78px"></label>
  <label>관측 <input id="dur" class="mono" type="number" value="600" step="60" style="width:64px">초</label>
  <button id="run">▶ 실행</button>
  <span class="modesw" id="viewsw">
    <button id="v-all" class="on" title="전 항적을 겹쳐 노드 케파·병목을 본다">전체 흐름</button><button id="v-track" title="항적 하나의 전문 이동을 따라간다">항적 개별</button>
  </span>
  <button id="side-toggle" title="왼쪽 패널을 접고 그래프를 넓게 쓴다">‹ 패널 접기</button>
  <span id="dirty" hidden>⟳ 조건이 바뀌었습니다 — [실행]</span>
  <span id="status">실행을 눌러 시작합니다.</span>
</header>

<!--
  실험 조건 손잡이는 화면에서 걷어냈다(사용자 결정). 전부 **URL 파라미터**로만 준다.
  ⚠️ 손잡이가 안 보이면 「이 수치가 어떤 조건에서 나왔는가」를 화면만 보고 알 수 없다.
     그래서 **기본값이 아닌 조건은 상태줄에 반드시 표기**한다(activeConfigChips) — 숨기는 것은
     조작 수단이지 조건 자체가 아니다. 파라미터 목록은 로드 시 콘솔에도 찍는다.
-->

<!-- 계선 매체 교체 팝오버 -->
<div id="pop" hidden>
  <div id="pop-title"></div>
  <div id="pop-body"></div>
  <div id="pop-warn">⚠️ 반사실입니다. 매체를 바꾸면 난수 소비가 달라져 <b>실행 전체가 다른 표본</b>이 됩니다 —
    기준 실행과 나란히 놓고 “차이 = 이 계선의 몫”으로 읽으면 안 됩니다.</div>
  <div style="display:flex;gap:6px;justify-content:flex-end">
    <button id="ovr-clear" hidden>전부 되돌리기</button><button id="pop-close">닫기</button>
  </div>
</div>

<main>
  <aside id="side">
    <section class="sec" id="tracks">
      <h2><span id="tracks-label">항적 (이벤트)</span><span id="track-count"></span></h2>
      <div class="scroll" id="track-list"><div class="empty">아직 실행하지 않았습니다.</div></div>
    </section>
    <section class="sec" id="log">
      <h2><span id="log-title">이벤트 로그</span><span class="minisw" id="log-mode" hidden><button id="lm-c2" title="C2 노드 하나를 골라 그 노드의 처리 로그(도착·대기·처리·드롭)를 읽는다 — 전체 화면은 그대로 둔다">C2 처리</button><button id="lm-bot" title="넘침·큐 이탈·포화 등 병목 사건만 모아 본다">병목</button></span><span id="log-hint"></span></h2>
      <div id="log-trk-bar" hidden>
        <select id="log-trk-sel" title="처리 로그를 볼 C2 노드"></select>
      </div>
      <div class="scroll" id="log-body"></div>
    </section>
  </aside>

  <section id="stage">
    <!-- 신호등 — 「지금 이 항적이 어디서 무엇을 기다리는가」를 추론하게 두지 않고 직접 적는다. -->
    <div id="graph-wrap"><div id="signal" hidden></div><svg id="graph"></svg></div>

const slotKey = (id, dup) => (dup ? id + '#' + dup : id);
const slotNodeId = (key) => key.split('#')[0];
/** 실린더(용량)를 그릴 자리인가 — 중복 노드는 **하행 자리만**(ECS의 큐가 거기 쌓인다). */
const isWorkSlot = (dup) => dup !== 'up';

/**
 * 간선의 양 끝 인스턴스를 고른다: **앞으로 가면서 가장 짧은 조합**.
 * 그래야 센서→ECS↑, ICC↓→ECS↓ 처럼 뜻에 맞는 자리끼리 이어진다.
 */
function pickSlots(fromNode, toNode) {
  const A = nodeSlots(fromNode), B = nodeSlots(toNode);
  let best = null;
  A.forEach((a) => B.forEach((b) => {
    const span = b.col - a.col;
    const fwd = span > 0;
    const score = (fwd ? 0 : 1000) + Math.abs(span);
    if (!best || score < best.score) best = { a: a, b: b, score: score };
  }));
  return best;
}

    scenario: KJ.scenarioById(el('sc').value), mode: mode,
    // 본 앱 [시뮬레이션] 탭의 강도 슬라이더와 같은 의미(도착률 배율) — 엔진이 이미
    // 지원하는 값이라 여기서 새 의미를 지어내는 것이 아니다.
    intensity: INTENSITY,
    seed: Math.max(0, Math.floor(+el('seed').value || 0)),
    endTimeSec: Math.min(7200, Math.max(60, Math.floor(+el('dur').value || 600))),
    deploymentId: DEPLOYMENT, modelFidelity: 'iads-c2',
    trace: true, traceCap: 300, flowTrace: true, features: features()
  };
  if (Object.keys(overrides).length) cfg.linkMediaOverrides = Object.assign({}, overrides);
  el('status').textContent = '실행 중…';
  el('run').disabled = true;
  // "실행 중" 표시가 실제로 그려진 뒤에 계산을 시작한다(동기 실행이라 그 사이 UI가 멈춘다).
  // ⚠️ rAF로 미루면 안 된다 — 탭이 배경에 있을 때 rAF는 정지하고, 실행이 **영영 시작되지
  //    않은 채** "실행 중…"에서 굳는다(실측). 타이머는 배경에서도 (느려질 뿐) 돈다.
  setTimeout(() => {
    const t0 = performance.now();
    let res;
    try {
      res = KJ.runDES(cfg);
    } catch (err) {
      el('status').textContent = '실행 실패: ' + err.message;
      el('run').disabled = false;
      return;
    }
    const wall = performance.now() - t0;
    const catalog = KJ.resolveModelCatalog(cfg);
    EDGE_META = buildEdgeMeta(catalog, mode);   // 계선 종류·등급 색인(표시 전용)
    const nodes = {};
    KJ.nodesInMode(mode, catalog).forEach((n) => { nodes[n.id] = n; });
    const built = buildTracks(res);
    run = { res, cfg, catalog, nodes, tracks: built.tracks,
      allFlows: built.allFlows, allSpans: built.allSpans, allBlocks: built.allBlocks };
    gv = buildGlobal(run);
    el('run').disabled = false;
    el('dirty').hidden = true;
    const ovr = res.linkMediaOverrides;
    const chips = activeConfigChips();
    const co = res.global.coordination || null;
    const multiFire = run.tracks.filter((t) => t.fireShooters.length > 1).length;
    el('status').innerHTML =
      `${run.tracks.length}개 항적 · 전문 ${res.flowEvents.filter((e) => e.k === 'link').length}건` +
      (res.flowTruncated ? ' (관측 상한 절삭)' : '') +
      ` · 격추 ${res.global.killed} / 누수 ${res.global.leaked}` +
      // ADR-086: 「값싼 표적을 고가 유도탄으로」가 눈에 띄게 상시 표출한다(KJADS 원칙 5-1).
      // 고가유도탄 보존율 = 1 − (≥5 M$ 요격탄 소모액 / 전체 요격탄 소모액) — 엔진 정의 그대로.
      ` · <span title="요격탄 총 소모액(개념값) / 고가유도탄(≥5 M$) 보존율 — 낮을수록 비싼 탄을 많이 쓴 것">` +
      `요격비 ${res.global.cost.interceptM.toFixed(0)} M$ · 고가탄 보존 ` +
      `<b style="color:${res.global.highValuePreservation < 0.5 ? 'var(--bad)' : 'var(--ok)'}">` +
      `${(res.global.highValuePreservation * 100).toFixed(0)}%</b></span>` +
      ` · 계산 ${(wall / 1000).toFixed(1)}초` +
      (ovr && ovr.applied.length
        ? ` · <b style="color:var(--warn)">반사실 ${ovr.applied.length}건 적용</b>` : '') +
      (ovr && ovr.unmatched.length
        ? ` · <b style="color:var(--bad)">못 맞춘 계선 ${ovr.unmatched.length}건</b>` : '') +
      (res.usfkTrackSharing
        ? ` · <b style="color:var(--warn)">연합 항적공유 ${esc(media(res.usfkTrackSharing.media).label)}` +
          ` ${res.usfkTrackSharing.activeInMode}가닥(반사실)</b>` : '') +
      // 손잡이를 숨겼으므로 **기본값이 아닌 조건은 반드시 화면에 남긴다** — 안 그러면
      // 같은 화면이 다른 조건의 결과를 같은 모양으로 보여준다.
      // 중복교전 — As-Is의 핵심 실패인데 종전 화면에는 아예 없었다(엔진은 계속 세고 있었다).
      // ⚠️ 엔진 카운터와 화면 관측을 **나란히** 적는다. 정의가 달라 값이 다르므로 하나로
      //    합치면 어느 쪽도 인용할 수 없게 된다.
      (co ? ` · <b style="color:${co.duplicates ? 'var(--bad)' : 'var(--dim)'}"` +
        ` title="엔진 계정: 협조 실패로 두 계통이 각각 교전한 건수 / COP·협조로 해소한 건수">` +
        `중복교전 ${co.duplicates} · 해소 ${co.deconflicted}</b>` +
        ` <span style="color:var(--dim)" title="관측: 서로 다른 사수가 같은 항적에 발사한 항적 수">` +
        `(복수 사수 발사 ${multiFire}건)</span>` : '') +
      (chips.length ? ` · <b style="color:var(--warn)">${esc(chips.join(' · '))}</b>` : '');
    // 같은 항적을 계속 보게 한다 — 조건을 바꿔 가며 한 항적을 쫓는 것이 이 화면의 쓰임이다.
    if (view === 'track') {
      renderTrackList();
      const keep = sel ? run.tracks.findIndex((t) => t.id === sel.id && t.flows.length) : -1;
      selectTrack(keep >= 0 ? keep : run.tracks.findIndex((t) => t.flows.length > 0));
    } else {
      sel = null;
      setView('all');
    }
  }, 30);
}

/** 실행 조건이 바뀌었음을 알린다 — 화면 수치는 아직 옛 실행의 것이다. */
function markDirty() { el('dirty').hidden = false; }

/**
 * 실행 결과를 **항적 단위 뷰모델**로 접는다.
 * flowEvents는 전 항적이 뒤섞인 한 벌이라, 여기서 한 번만 갈라 둔다.
 *
 * 노드 체류(대기 + 처리)는 도착(na) → 개시(ns) → 완료(nd)를 `id`로 이어 만든다.
 * ns/nd에는 항적 id가 실리지 않으므로(같은 값을 세 번 싣지 않는다) na에서 물려받는다.
 */
function buildTracks(res) {
  const byId = {};
  const spanById = {};
  (res.threatTraces || []).forEach((tr) => {
    byId[tr.id] = { id: tr.id, type: tr.type, axis: tr.axis, spawnT: tr.spawnT,
      exitT: tr.exitT, outcome: tr.outcome, stages: tr.stages || [], flows: [], spans: [],
      // ⚠️ `failure`(ADR-050 실패 분류 v2 — 주원인·기여원인·계열·구조성)를 반드시 옮긴다.
      //    빠뜨리면 누수 배너가 코드만 찍고 「왜」가 사라진다(실제로 그렇게 빠뜨렸다).
      failure: tr.failure || null,
      // 격추 항적의 거절·실패 증거 — 「승인까지 받고 못 쏜 축」의 사유(누수는 failure.evidence).
      evidence: tr.evidence || null,
      // ⚠️ 유령 노드 재료 셋을 **전부** 옮긴다. 종전에는 evidence 계열만 옮겨, selectTrack이
      //    읽는 unreached(경로 부재로 끊긴 계선)·commanders(책임 C2 명단)가 항상 undefined였다
      //    — 엔진이 103/105 항적에 commanders를 실어 보내는데 화면이 전부 버렸고,
      //    failure.evidence가 빈 누수 항적은 아무 실패 표시 없이 끝났다(실측 2건).
      //    바로 위 failure를 빠뜨렸던 것과 같은 실수의 재판이라, 같은 자리에 같이 적는다.
      unreached: tr.unreached || [], commanders: tr.commanders || [] };
  });
  (res.flowEvents || []).forEach((e) => {
    if (e.k === 'link') { const t = byId[e.th]; if (t) t.flows.push(e); return; }
    if (e.k === 'na') {
      const t = byId[e.th];
      const sp = { id: e.id, at: e.at, jk: e.jk, arrive: e.t, start: null, done: null, drop: null };
      spanById[e.id] = sp;
      if (t) { sp.track = t; t.spans.push(sp); }
      return;
    }
    const sp = spanById[e.id];
    if (!sp) return;
    if (e.k === 'ns') sp.start = e.t;
    else if (e.k === 'nd') sp.done = e.t;
    else if (e.k === 'nx') { sp.drop = e.t; sp.dropR = e.r; } // r: over(넘침)·ttl(기한)·dead(항적 종결)
  });
  // 발사 이력 — 「한 항적에 몇 개 계통이 각각 쐈나」(중복교전)를 세려면 필요하다.
  // ⚠️ 이것은 **관측된 발사**이지 엔진의 중복교전 카운터(global.coordination.duplicates)와
  //    같은 정의가 아니다. 엔진은 「협조 실패로 두 계통이 각각 교전」을 세고, 여기서는
  //    「서로 다른 사수가 이 항적에 발사」를 센다. 둘을 섞어 적지 않는다(화면에서 구분 표기).
  Object.keys(byId).forEach((k) => {
    const t = byId[k];
    t.fires = [];
    t.stages.forEach((s) => {
      const m = s.name.match(/^발사:([^/]+)/);
      if (m) t.fires.push({ t: s.t, shooter: m[1] });
    });
    const uniq = [];
    t.fires.forEach((f) => { if (uniq.indexOf(f.shooter) < 0) uniq.push(f.shooter); });
    t.fireShooters = uniq;
    // 두 번째 **다른 사수**가 쏜 시각 = 중복이 성립한 순간
    t.dupT = null;
    if (uniq.length > 1) {
      const second = uniq[1];
      const hit = t.fires.find((f) => f.shooter === second);
      t.dupT = hit ? hit.t : null;
    }
  });

  const list = Object.keys(byId).map((k) => byId[k]);
  list.sort((a, b) => a.spawnT - b.spawnT);
  list.forEach((t) => {
    t.flows.sort((a, b) => a.t0 - b.t0 || a.t1 - b.t1);
    t.spans.sort((a, b) => a.arrive - b.arrive);
    t.endT = t.exitT != null ? t.exitT
      : Math.max(t.spawnT, ...t.flows.map((f) => f.t1), ...t.stages.map((s) => s.t));
  });
  // ── 채널 적체 — 「가야 할 방향은 있는데 못 가는」 전문 ────────────────────────
  // 종전 관측은 **실제로 출발한 전문만** 기록했다(_recordLink). 그래서 교전현황 채널이
  // 1채널·4건 용량에 막혀 대기하거나 버려진 전문은 화면에 흔적조차 없었다 —
  // As-Is 실측으로 보낸 15건 중 2건만 건너가는데 그 2건만 보였다.
  //   · wait — 대기줄에 섰다. t1이 Infinity면 **관측 끝까지 못 갔다.**
  //   · drop — 대기줄에도 못 서고 버려졌다. 이 전문은 영영 출발하지 않는다.
  const departByMid = new Map();
  (res.flowEvents || []).forEach((e) => {
    if (e.k === 'link' && e.mid != null) departByMid.set(e.mid, e);
  });
  const allBlocks = [];
  (res.flowEvents || []).forEach((e) => {
    if (e.k === 'cq') {
      const d = departByMid.get(e.id);
      allBlocks.push({ kind: 'wait', from: e.from, to: e.to, th: e.th,
        t0: e.t, t1: d ? d.t0 : Infinity, freed: !!d });
    } else if (e.k === 'cx') {
      allBlocks.push({ kind: 'drop', from: e.from, to: e.to, th: e.th, t0: e.t, t1: e.t });
    }
  });
  allBlocks.sort((a, b) => a.t0 - b.t0);
  allBlocks.forEach((b) => { const t = byId[b.th]; if (t) (t.blocks = t.blocks || []).push(b); });
  list.forEach((t) => { t.blocks = t.blocks || []; });

  // 전체 흐름 보기용 전역 배열 — 항적으로 갈라지기 전의 전량.
  // ⚠️ threatTraces에 없는 항적(traceCap 초과분)의 사건도 flowEvents에는 실려 있으므로,
  //    항적별 배열을 다시 합치면 안 되고 원본에서 다시 걸러야 한다.
  const allFlows = (res.flowEvents || []).filter((e) => e.k === 'link')
    .sort((a, b) => a.t0 - b.t0);
  const allSpans = Object.keys(spanById).map((k) => spanById[k])
    .sort((a, b) => a.arrive - b.arrive);
  return { tracks: list, allFlows, allSpans, allBlocks };
}

/* ══════════════════════════════════════════════════════════════════════════
   4-b. 전체 흐름 뷰모델 — 노드별 케파 이력과 병목 사건
   ══════════════════════════════════════════════════════════════════════════ */
/**
 * 전역 사건에서 세 가지를 뽑는다.
 *  · nodeStats — 노드별 총 도착·이탈(정렬·놀고 있는 장비 판별용)
 *  · rows — 병목 사건 로그: 도착 즉시 드롭(넘침) · 큐 이탈(포기·기한) · 포화 진입/해소
 *  · c/K — 카탈로그 선언 용량. ⚠️ 지어내지 않는다 — queue 선언이 없는 노드(포대·센서)는
 *    링을 비워 두고 포화 판정도 하지 않는다(0과 미측정을 가르는 ADR-062 규율).
 */
function buildGlobal(run) {
  const stats = {};   // id -> { arr, drops(over+ttl — 엔진 ns.drops와 같은 계정), dead, peakQ }
  const st = (id) => stats[id] || (stats[id] = { arr: 0, drops: 0, dead: 0, peakQ: 0 });
  const points = []; // 점 사건: {t, type:'overflow'|'ttl'|'dead', node, th}

  // 노드별 시간순 사건 스위프 — busy·q를 복원해 포화 구간을 찾는다.
  const evs = [];   // {t, node, kind:'a'|'s'|'d'|'x', th}
  run.allSpans.forEach((s) => {
    st(s.at).arr++;
    evs.push({ t: s.arrive, node: s.at, kind: 'a', th: s.track ? s.track.id : null });
    if (s.start != null) evs.push({ t: s.start, node: s.at, kind: 's' });
    if (s.done != null) evs.push({ t: s.done, node: s.at, kind: 'd' });
    if (s.drop != null) {
      evs.push({ t: s.drop, node: s.at, kind: 'x' });
      // 사유는 엔진이 실어 준 r로만 가른다(재추정 금지) — 'over'·'ttl'은 엔진 드롭
      // 계정과 같은 계정이고, 'dead'는 항적 종결에 따른 큐 정리라 드롭이 아니다.
      const th = s.track ? s.track.id : null;
      if (s.dropR === 'over') { st(s.at).drops++; points.push({ t: s.drop, type: 'overflow', node: s.at, th }); }
      else if (s.dropR === 'ttl') { st(s.at).drops++; points.push({ t: s.drop, type: 'ttl', node: s.at, th }); }
      else if (s.dropR === 'dead') { st(s.at).dead++; points.push({ t: s.drop, type: 'dead', node: s.at, th }); }
    }
  });
  // 동률 순서는 엔진 실순서를 따른다: 완료(서버 비움) → 도착 → 개시(인출) → 이탈.
  // 이 순서여야 재구성 q가 음수로 내려가지 않는다(회귀 flow-trace ③-g와 같은 규칙).
  const ORD = { d: 0, a: 1, s: 2, x: 3 };
  evs.sort((a, b) => a.t - b.t || ORD[a.kind] - ORD[b.kind]);

  // 포화를 사건 두 개(진입/해소)가 아니라 **구간 하나**로 남긴다 — 진입·해소가 번갈아
  // 수십 줄 찍히면 같은 병목이 여러 사건처럼 읽힌다(실제 지적: 중복으로 보임).
  const live = {};  // id -> {busy, q, satT0, satPeakQ}
  const sats = []; // {t, tEnd, node, c, peakQ}
  evs.forEach((e) => {
    const n = run.nodes[e.node];
    const cap = nodeCap(n); const c = cap ? cap.c : null;
    const L = live[e.node] || (live[e.node] = { busy: 0, q: 0, satT0: null, satPeakQ: 0 });
    if (e.kind === 'a') L.q++;
    else if (e.kind === 's') { L.q--; L.busy++; }
    else if (e.kind === 'd') L.busy--;
    else if (e.kind === 'x') L.q--;
    st(e.node).peakQ = Math.max(st(e.node).peakQ, L.q);
    if (c != null) {
      const satNow = L.busy >= c && L.q > 0;
      if (satNow && L.satT0 == null) { L.satT0 = e.t; L.satPeakQ = L.q; }
      else if (L.satT0 != null && L.q > L.satPeakQ) L.satPeakQ = L.q;
      else if (!satNow && L.satT0 != null && L.q === 0) {
        sats.push({ t: L.satT0, tEnd: e.t, node: e.node, c, peakQ: L.satPeakQ });
        L.satT0 = null; L.satPeakQ = 0;
      }
    }
  });
  // 관측 종료까지 안 풀린 포화도 구간으로 남긴다 — 빼면 "끝에는 괜찮았다"로 오독된다.
  Object.keys(live).forEach((id) => {
    const L = live[id], n = run.nodes[id];
    const capL = nodeCap(n);
    if (L.satT0 != null && capL) {
      sats.push({ t: L.satT0, tEnd: run.cfg.endTimeSec, node: id, c: capL.c,
        peakQ: L.satPeakQ, open: true });
    }
  });

  // 점 사건은 (노드, 종류) 버스트로 묶는다 — 간격 10초 이내 연속 사건은 한 줄이다.
  // ⚠️ 묶는 것은 표시뿐이다. 눈금(marks)·건수는 원사건 그대로 남긴다(대사와 어긋나면 안 된다).
  // 채널 적체 — 노드 큐가 아니라 **계선 자체**가 막힌 것. 종류를 갈라 둔다:
  // 못 가고 기다림(chwait) / 대기줄에도 못 서고 버려짐(chdrop).
  // ⚠️ 반드시 아래 정렬·버스트 묶기 **앞에서** 넣어야 한다 — 뒤에 넣으면 이미 만들어진
  //    버스트에 안 섞여 로그에 한 줄도 안 나온다(실제로 그렇게 실수했다).
  (run.allBlocks || []).forEach((b) => {
    if (b.kind === 'drop') {
      points.push({ t: b.t0, type: 'chdrop', node: b.from, th: b.th, to: b.to });
    } else {
      points.push({ t: b.t0, type: 'chwait', node: b.from, th: b.th, to: b.to,
        until: b.t1, freed: b.freed });
    }
  });

  // 중복교전 — 두 계통이 같은 표적에 각각 쏜 순간. As-Is에서는 축 간 교전상태 비공유의
  // 직접 결과이고 요격탄 이중 소모로 이어진다. 포화·누수와 같은 축에 놓는다.
  run.tracks.forEach((t) => {
    if (t.fireShooters.length < 2 || t.dupT == null) return;
    points.push({ t: t.dupT, type: 'dup', node: null, th: t.id,
      shooters: t.fireShooters.map((s) => nodeName(s)) });
  });

  // 누수 — 병목의 **결과**다. 포화·막힘과 같은 축에 놓아야 「무엇이 무엇을 낳았는지」가 읽힌다.
  // 사유별로 묶는다(노드 귀속이 있는 overflow만 노드를 단다).
  run.tracks.forEach((t) => {
    const oc = outcomeInfo(t);
    if (!oc.leaked) return;
    const ov = (oc.code || '').match(/^overflow:(.+)$/);
    points.push({ t: t.exitT, type: 'leak', node: ov ? ov[1] : null, th: t.id,
      code: oc.code, leakText: oc.text });
  });

  points.sort((a, b) => a.t - b.t);
  const GAP = 10;
  const bursts = [];
  const openBurst = {};
  points.forEach((p) => {
    // 누수는 노드가 아니라 **사유**로 묶는다(대부분 노드 귀속이 없다).
    const k = p.type === 'leak' ? 'leak|' + p.code
      : p.type === 'dup' ? 'dup'
      : p.node + '|' + p.type + '|' + (p.to || '');
    const b = openBurst[k];
    if (b && p.t - b.tEnd <= GAP) {
      b.tEnd = p.t; b.n++;
      if (p.th && b.ths.indexOf(p.th) < 0) b.ths.push(p.th);
      // 대기는 「언제까지 못 갔는가」가 핵심이라, 버스트의 끝을 해소 시각까지 늘린다.
      if (p.until != null) b.until = Math.max(b.until || 0, isFinite(p.until) ? p.until : Infinity);
    } else {
      openBurst[k] = { t: p.t, tEnd: p.t, type: p.type, node: p.node, to: p.to, n: 1,
        ths: p.th ? [p.th] : [], until: p.until, leakText: p.leakText, code: p.code,
        shooters: p.shooters };
      bursts.push(openBurst[k]);
    }
  });

  const TYPE_TEXT = {
    overflow: (b) => `넘침${b.n > 1 ? ' ×' + b.n : ''} — ${nodeNameOf(run, b.node)} 대기실 초과 즉시 드롭` + thTail(b),
    chdrop: (b) => `계선 드롭${b.n > 1 ? ' ×' + b.n : ''} — ${nodeNameOf(run, b.node)} → ` +
      `${nodeNameOf(run, b.to)} 채널 용량 초과로 **출발조차 못 함**`.replace(/\*\*/g, '') + thTail(b),
    chwait: (b) => `계선 막힘${b.n > 1 ? ' ×' + b.n : ''} — ${nodeNameOf(run, b.node)} → ` +
      `${nodeNameOf(run, b.to)} 채널이 비지 않아 대기` + thTail(b),
    dup: (b) => `중복교전${b.n > 1 ? ' ×' + b.n : ''} — 두 계통이 같은 표적에 각각 발사` +
      (b.shooters ? ` (${b.shooters.join(' + ')})` : '') + thTail(b),
    leak: (b) => `누수${b.n > 1 ? ' ×' + b.n : ''} — ${b.leakText}` +
      (b.code ? ` (${b.code})` : '') + thTail(b),
    ttl: (b) => `기한 만료${b.n > 1 ? ' ×' + b.n : ''} — ${nodeNameOf(run, b.node)} 대기 중 유효시간 초과 드롭` + thTail(b),
    dead: (b) => `큐 정리${b.n > 1 ? ' ×' + b.n : ''} — ${nodeNameOf(run, b.node)} 대기 중 항적 종결(격추·이탈)` + thTail(b)
  };
  function thTail(b) {
    if (!b.ths.length) return '';
    return ` (${b.ths[0]}${b.ths.length > 1 ? ' 외 ' + (b.ths.length - 1) : ''})`;
  }
  const rows = bursts.map((b) => ({
    // 대기 버스트는 해소될 때까지가 「진행 중」이다. 미해소(Infinity)면 관측 끝까지.
    t: b.t,
    tEnd: b.type === 'chwait'
      ? (isFinite(b.until) ? Math.max(b.tEnd, b.until) : run.cfg.endTimeSec)
      : b.tEnd,
    type: b.type, node: b.node,
    // 이 줄에 걸린 항적 — 로그에서 개별 보기로 내려가는 입구다(renderBotLog·openRowTracks).
    // 화면 꼬리표는 「외 N」으로 접히지만, 접힌 N건도 여기 남아야 손이 닿는다.
    ths: b.ths.slice(),
    text: TYPE_TEXT[b.type](b) +
      (b.type === 'chwait' && !isFinite(b.until) ? ' — 관측 종료까지 미해소' : '')
  })).concat(satRows(run, sats));
  rows.sort((a, b) => a.t - b.t);

  // 눈금은 원사건 전량 — 묶인 줄 수와 달리, 축 위에서는 밀도가 곧 정보다.
  const marks = points.map((p) => ({ t: p.t,
    bad: p.type === 'overflow' || p.type === 'chdrop' || p.type === 'leak' }))
    .concat(sats.map((s) => ({ t: s.t, bad: false })));
  return { stats, rows, rowTimes: rows.map((r) => r.t), marks,
    focusNode: null, logEls: null };
}

/**
 * 포화 구간 → 로그 줄. **한 노드의 반복 포화는 한 줄로 접는다.**
 *
 * ⚠️ 종전에는 구간 하나에 한 줄이었다. 실측(SC3 · seed 12345 · As-Is · 600초)에서 로그 64줄
 *    가운데 19줄이 포화였고 **그중 18줄이 KAMDOC 하나**였다 — 「KAMDOC은 관측 내내 포화였다」는
 *    사실 하나가 열여덟 번 적혀 로그의 28%를 먹고, 정작 항적 사건 45줄(누수·중복교전·계선
 *    드롭·막힘)을 아래로 밀어냈다. 포화 진입/해소를 구간 하나로 접은 것과 같은 이유이고,
 *    「어디서 막혔나」 순위표를 걷어낸 것과 같은 종류의 중복이다.
 * ⚠️ 접는 것은 **표시뿐**이다 — 눈금(marks)은 구간 전량 그대로 세운다(버스트와 같은 규율).
 *    축 위에서는 밀도가 곧 정보이므로, 열여덟 번 되돌아 포화한 것과 한 번 오래 포화한 것이
 *    같아 보이면 안 된다.
 * ⚠️ 합계와 구간을 섞지 않는다. 줄의 시간 범위(t→tEnd)는 **되풀이가 일어난 창**이고, 실제
 *    포화한 시간은 그보다 짧은 `합계`다. 둘을 한 수치로 뭉치면 포화 시간이 부풀려진다.
 */
function satRows(run, sats) {
  const byNode = new Map();
  sats.forEach((s) => {
    let g = byNode.get(s.node);
    if (!g) byNode.set(s.node, g = { node: s.node, c: s.c, n: 0, sum: 0, peakQ: 0,
      t: s.t, tEnd: s.tEnd, open: false });
    g.n++; g.sum += s.tEnd - s.t;
    g.peakQ = Math.max(g.peakQ, s.peakQ);
    g.t = Math.min(g.t, s.t); g.tEnd = Math.max(g.tEnd, s.tEnd);
    if (s.open) g.open = true;
  });
  const obs = Math.max(1e-6, run.cfg.endTimeSec);
  return [...byNode.values()].map((g) => ({
    t: g.t, tEnd: g.tEnd, type: 'sat', node: g.node, ths: [],
    text: (g.n > 1
      ? `포화 ${g.n}회 · 합계 ${g.sum.toFixed(0)}초(관측의 ${(g.sum / obs * 100).toFixed(0)}%) — `
      : `포화 ${g.sum.toFixed(0)}초 — `) +
      `${nodeNameOf(run, g.node)} 처리 ${g.c}/${g.c} + 대기 최대 ${g.peakQ}건` +
      (g.open ? ' (관측 종료까지 미해소)' : '')
  }));
}

function nodeNameOf(run, id) {
  const n = run.nodes[id];
  return n ? (n.name || id) : id;
}

/* ══════════════════════════════════════════════════════════════════════════
   4. 항적 목록 · 이벤트 로그 (좌측)
   ══════════════════════════════════════════════════════════════════════════ */
/* ── 누수(실패) 표기 — ADR-050 실패 분류 v2를 화면으로 끌어올린다 ──────────────
   ⚠️ 종전 화면은 누수를 「배지 하나 + 움직임 없음」으로만 보여줬다. 그런데 엔진은 누수마다
      주원인·기여원인·계열·구조성을 이미 기록한다(trace.failure). 그걸 버리면 「왜 못 막았나」가
      화면에서 사라지고, 누수가 전부 같은 실패처럼 보인다.
   ⚠️ 원문 코드(timeout:c2 등)를 지우지 않는다 — 한글 풀이는 읽기용이고, 인용·대조는 코드로 한다. */
const LEAK_LABEL = {
  'timeout:c2': 'C2 지연으로 교전 시한 초과',
  'timeout:engage': '교전 개시 후 시한 초과',
  'window_lost_due_to_c2': 'C2 지연으로 체공창 상실',
  'missed': '요격했으나 명중 실패',
  'no_responsible_c2': '책임 C2 없음',
  'responsibility_gap': '협조 경로 없음(책임 공백)',
  'no_capable_weapon': '교전 가능 무기 없음',
  'no_shooter': '가용 사수 없음',
  // ── WTA·교전 준비 단계의 거절·실패 코드 — failure.evidence에 실려 「닿지 못한 노드」의
  //    사유가 된다. 엔진 코드( _iadsShooterFeasibility 등)와 1:1.
  'no_fire_control': '사격통제(FC) 미성립',
  'no_feasible_pip': '요격점(PIP) 미성립',
  'too_early': '요격창 도달 전',
  'capacity_full': '동시교전 한도 초과',
  'ammo_depleted': '탄약 고갈·재장전 중',
  'not_operational': '무력화 상태',
  'no_missile_for_threat': '대응 탄종 없음',
  'self_defense_failed': '자위권 사격 실패',
  'correlation_failed': '항적 상관 실패',
  'no_report_path': '보고 경로 없음',
  'approval_dropped': '승인 단계 드롭',
  'no_command_path': '명령 경로 없음(계선 부재)',
  'no_coordination_path': '협조 경로 없음(계선 부재)',
  'commander_unreached': '책임 C2 — 보고가 닿지 못함'
};
const LEAK_FAMILY = { kinematic: '기하·운동', capacity: '용량', architecture: '구조', stochastic: '확률' };
const LEAK_STRUCT = { structural: '구조적', conditional: '조건부', nonstructural: '비구조적' };
/** 누수 사유 코드 → 읽을 수 있는 짧은 말. overflow:<노드> 처럼 인자를 문 코드도 다룬다. */
function leakText(code) {
  if (!code) return '사유 미기록';
  if (LEAK_LABEL[code]) return LEAK_LABEL[code];
  const ov = code.match(/^overflow:(.+)$/);
  if (ov) return `${nodeName(ov[1])} 포화로 드롭`;
  // 여기 없는 코드는 엔진 정본 taxonomy의 라벨로 — 새 코드가 생겨도 원문 그대로 죽지 않게.
  const tax = KJ.leakTaxonomy ? KJ.leakTaxonomy(code) : null;
  if (tax && tax.label) return tax.label;
  return code;
}

/** 「닿지 못한 노드」 사유 한 줄 — 코드 한글 풀이 + 횟수. */
function ghostReasonText(g) {
  return g.items.map((it) => leakText(it.code) + (it.n > 1 ? ` ×${it.n}` : '')).join(' · ');
}
/** 항적의 종결 정보 — { leaked, code, text, family, struct, contributors } */
function outcomeInfo(t) {
  if (t.outcome === 'killed') return { leaked: false };
  if (t.exitT == null) return { leaked: false, open: true };
  const code = (String(t.outcome || '').match(/^leaked:(.+)$/) || [])[1] ||
    (t.failure && t.failure.primaryCause) || null;
  const f = t.failure || {};
  return { leaked: true, code: code, text: leakText(code),
    family: LEAK_FAMILY[f.family] || f.family || null,
    struct: LEAK_STRUCT[f.structurality] || f.structurality || null,
    contributors: f.contributors || [] };
}

const THREAT_LABEL = {
  uav_small: '소형 무인기', ac_low: '저고도 항공기', heli: '헬기', fighter: '전투기',
  cruise: '순항미사일', srbm: '탄도탄', mrl_large: '장사정 유도탄'
};

function renderTrackList() {
  const box = el('track-list');
  if (!run || !run.tracks.length) { box.innerHTML = '<div class="empty">추적된 항적이 없습니다.</div>'; return; }
  el('track-count').textContent = run.tracks.length + '건';
  box.innerHTML = run.tracks.map((t, i) => {
    const oc = outcomeInfo(t);
    const cls = t.outcome === 'killed' ? 'ok' : (oc.leaked ? 'bad' : 'idle');
    // 누수는 **사유까지** 배지에 적는다 — 「누수」만 적으면 22건이 전부 같은 실패로 보인다.
    const txt = t.outcome === 'killed' ? '격추' : (oc.leaked ? '누수 · ' + oc.text : '진행중');
    const tip = oc.leaked
      ? `누수 — ${oc.code || '사유 미기록'}\n${oc.text}` +
        (oc.family ? `\n계열 ${oc.family} · ${oc.struct}` : '') +
        (oc.contributors.length ? `\n기여원인: ${oc.contributors.join(', ')}` : '')
      : `${t.id} · ${THREAT_LABEL[t.type] || t.type}`;
    // 복수 사수 발사 = 두 계통이 같은 표적에 각각 쏜 것. As-Is에서는 협조 실패의 결과다.
    const dup = t.fireShooters.length > 1
      ? `<span class="pill dup" title="${esc('서로 다른 사수가 각각 발사\n' +
          t.fireShooters.map((s) => nodeName(s)).join(' + '))}">중복 ${t.fireShooters.length}</span>` : '';
    return `<div class="trk" data-i="${i}" title="${esc(tip)}">
      <span class="nm">${esc(t.id)}<span class="sub"> · ${esc(THREAT_LABEL[t.type] || t.type)} · ${esc(t.axis)}</span></span>
      ${dup}<span class="pill ${cls}">${esc(txt)}</span></div>`;
  }).join('');
  box.querySelectorAll('.trk').forEach((n) => {
    n.addEventListener('click', () => selectTrack(+n.dataset.i));
  });
}

/**
 * 로그 한 벌 = 링크 통과(↦) + 항적 마크(·)를 시각순으로 합친 것.
 * 센서 마크(SENSOR_*)는 한 항적에서 전체의 절반을 넘어(ADR-081 실측: 59단계 중 40) 기본으로
 * 감춘다 — 켜면 나머지가 묻힌다.
 */
function buildLogRows(t) {
  const rows = [];
  t.flows.forEach((f) => {
    const m = media(f.mt);
    // 센서 보고 통과도 「센서」로 묶어 함께 접는다 — 그래프에서 이미 같은 기준으로
    // 걸러내므로(drawFrame), 로그만 다른 기준을 쓰면 화면과 로그가 어긋난다.
    // 「무엇이 흐르는가(종류) · 어떻게 가는가(매체) · 얼마나 걸렸나 · 그 값을 믿을 수 있나(등급)」
    const meta = edgeMetaOf(f.from, f.to, f.mt);
    const kl = kindLabel(meta), gl = gradeLabel(meta);
    rows.push({ t: f.t0, kind: 'link', mt: f.mt, ref: f, sensor: f.mt === 'report-cycle',
      text: `${nodeName(f.from)} → ${nodeName(f.to)}`,
      grade: gl ? { label: gl, low: meta.confidence === 'C' } : null,
      tail: `${kl ? kl + ' · ' : ''}${m.label} ${f.d.toFixed(1)}초` });
  });
  const threatValueM = (KJ.threatType(t.type) || {}).unitCostM;
  t.stages.forEach((s) => {
    // ADR-086: 발사 마크에 **요격탄 단가 대 위협 가치**를 붙인다. 「값싼 표적을 고가
    // 유도탄으로 잡는다」(KJADS 원칙 5-1)는 이 모델이 보여주려는 문제인데, 종전 화면에는
    // 어느 포대가 쐈는지만 있고 그 대가가 없어 눈에 띄지 않았다.
    // ⚠️ 새 수치를 만들지 않는다 — 카탈로그의 costPerShotM과 threats.js의 unitCostM을
    //    읽어 비율만 계산한다. 「고가」 임계는 엔진과 같은 값(HIGH_VALUE_COST_M = 5 M$).
    let cost = null;
    const fire = s.name.match(/^발사:([^/]+)/);
    if (fire) {
      const n = run.nodes[fire[1]];
      const cps = n && n.engage ? n.engage.costPerShotM : null;
      if (cps != null && threatValueM != null) {
        cost = { cps: cps, val: threatValueM, ratio: threatValueM > 0 ? cps / threatValueM : Infinity,
          high: cps >= 5 };
      }
    }
    // 위협우선순위 마크는 엔진 인코딩 원시값(유형순위×10⁶ + 절박도)이라 그대로 적으면
    // 「4099828」 같은 읽을 수 없는 수가 찍힌다(실제 지적). 화면에는 풀어 적고 원문은
    // 툴팁에 보존한다 — 인용·대조는 원문 코드로 한다는 규율 그대로.
    let txt = s.name, raw = null;
    const pr = s.name.match(/^위협우선순위:([^/]+)\/(\d+)$/);
    if (pr) {
      const v = +pr[2];
      const rank = Math.floor(v / 1000000);
      const remainSec = Math.max(0, 100000 - (v % 1000000));
      txt = `위협우선순위:${pr[1]} — 유형순위 ${rank}/7 · 잔여체공 ${remainSec}초`;
      raw = s.name;
    }
    rows.push({ t: s.t, kind: 'mark', sensor: /^SENSOR_/.test(s.name), text: txt, raw: raw,
      tail: '', lane: laneTag(s.axis), cost: cost });
  });
  // 「못 간」 전문 — 이 항적의 로그에서도 출발한 전문과 나란히 시각순으로 보여야,
  // 어느 시점에 무엇이 막혔는지가 읽힌다.
  (t.blocks || []).forEach((b) => {
    if (b.kind === 'drop') {
      rows.push({ t: b.t0, kind: 'block', cls: 'chdrop',
        text: `${nodeName(b.from)} → ${nodeName(b.to)} 채널 용량 초과 — 출발 못 함`, tail: '' });
    } else {
      rows.push({ t: b.t0, kind: 'block', cls: 'chwait',
        text: `${nodeName(b.from)} → ${nodeName(b.to)} 채널 대기 시작` +
          (isFinite(b.t1) ? ` (${(b.t1 - b.t0).toFixed(0)}초 뒤 출발)` : ' (끝까지 못 감)'),
        tail: '' });
    }
  });
  rows.sort((a, b) => a.t - b.t);
  return rows;
}

/**
 * 단계 마크의 지휘 축 꼬리표 (ADR-081의 레인을 한 줄 로그용으로 접은 것).
 * ⚠️ 이게 없으면 같은 항적에 지휘관이 3~4개 붙는 구조에서 `승인완료:C2_MCRC_MCRC`가
 *    세 번 찍힌 것이 **중복 기록처럼** 읽힌다(실제 오독 사례) — 실은 서부·중부·동부전방
 *    군단 AOC 세 계통이 각자 받은 승인이다. 축 판정은 axis 필드로만 한다(ADR-081 규율).
 */
function laneTag(axis) {
  if (!axis) return null;
  if (axis === 'SENSOR') return '센서';
  const bar = axis.indexOf('|');
  const head = bar < 0 ? axis : axis.slice(0, bar);
  const id = bar < 0 ? '' : axis.slice(bar + 1);
  const nm = id ? nodeName(id).replace(/ (군단 AOC\/C2A|중앙방공통제소)$/, '') : '';
  if (head === 'DOMAIN') return '병렬통보·' + nm;
  if (head === 'SELF_DEFENSE') return '자위권·' + nm;
  return nm || head;
}

let logTrk = null;   // 로그 패널에 실린 항적 — 항적 개별 보기의 sel
function renderLog() { renderTrackLog(sel); }

/** 항적 하나의 이벤트 로그 — 항적 개별 보기 전용. (전체 보기의 「항적」 모드는 개별
 *  보기와 같은 로그의 중복이라 걷어내고 C2 처리 로그로 교체했다 — 사용자 결정 2026-08-31.) */
function renderTrackLog(trk) {
  logTrk = trk || null;
  const body = el('log-body');
  if (!trk) { body.innerHTML = '<div class="empty">왼쪽 위에서 항적을 고르면<br>그 항적의 사건이 시각순으로 표시됩니다.</div>'; return; }
  if (!trk.logRows) trk.logRows = buildLogRows(trk);   // sel은 selectTrack이 이미 만들어 온다
  const showSensor = el('show-sensor').checked;
  const rows = trk.logRows.filter((r) => showSensor || !r.sensor);
  // 줄 사이에 흐른 시간을 붙인다. ⚠️ **걸러낸 뒤의** 줄로 잰다 — 감춘 센서 줄을 끼워
  //    재면 화면에 보이는 두 줄 사이의 틈과 배지의 숫자가 어긋난다.
  const iv = stallIntervals(trk);
  rows.forEach((r, i) => {
    const b = i + 1 < rows.length ? rows[i + 1].t : iv.t1;
    r.gap = gapOf(iv, r.t, b);
  });
  const stalled = rows.filter((r) => r.gap && r.gap.stall);
  const stallSec = stalled.reduce((s, r) => s + r.gap.dur, 0);
  el('log-title').textContent = `${trk.id} — 이벤트 로그`;
  el('log-hint').innerHTML = rows.length + '건' + (stalled.length
    ? ` · <b style="color:var(--bad)">병목 ${stalled.length}곳 ${stallSec.toFixed(0)}초</b>` : '');
  body.innerHTML = rows.map((r, i) => {
    const m = r.kind === 'link' ? media(r.mt) : null;
    const tip = r.kind === 'link'
      ? `${r.text}\n${r.tail} — ${fmt(r.t)} 출발 → ${fmt(r.ref.t1)} 도착` +
        edgeMetaLine(r.ref.from, r.ref.to, r.mt)
      : `${fmt(r.t)} ${r.text}` + (r.raw ? `\n원문: ${r.raw}` : '');
    const c = r.cost;
    const costChip = c
      ? `<span class="med cost${c.high ? ' hi' : ''}">${c.cps} M$ → ${c.val} M$` +
        (isFinite(c.ratio) ? ` (${c.ratio >= 10 ? Math.round(c.ratio) + '배' : c.ratio.toFixed(1) + '배'})` : '') +
        `</span>` : '';
    // 이 줄 다음에 흐른 시간. 병목(대기·막힘)만 붉게 — 공백·처리·이동은 흐리게 적는다.
    const g = r.gap;
    const gapChip = g
      ? `<span class="gap${g.stall ? ' stall' : ''}">↓ ${g.label} ${g.dur.toFixed(0)}초</span>` : '';
    const gapTip = g
      ? `\n\n다음 사건까지 ${g.dur.toFixed(0)}초 — ${g.label}가 가장 오래 덮음` +
        `\n(대기 ${g.parts.qw.toFixed(0)} · 막힘 ${g.parts.bl.toFixed(0)} · ` +
        `처리 ${g.parts.wk.toFixed(0)} · 이동 ${g.parts.mv.toFixed(0)}초, 계통이 병렬이라 겹칩니다)` +
        (g.stall ? '\n⚠️ 병목 — 일하지 못하고 기다린 시간입니다'
          : g.kind === 'gap' ? '\n공백 — C2가 막은 것이 아니라 교전 가능 상태를 기다린 구간입니다' : '')
      : '';
    return `<div class="ev ${r.kind}${r.cls ? ' ' + r.cls : ''}${g && g.stall ? ' stall' : ''}"` +
      ` data-t="${r.t}" data-i="${i}" title="${esc(
      tip + (r.lane ? '\n계통: ' + r.lane : '') +
      (c ? `\n요격탄 ${c.cps} M$ · 위협 가치 ${c.val} M$` +
        (c.high ? '\n고가 유도탄(≥5 M$) — 보존율 지표의 분자에 들어간다' : '') : '') + gapTip)}">
      <span class="t mono">${fmt(r.t)}</span>
      <span class="x">${esc(r.text)}${m ? `<span class="med" style="color:${m.color}">${esc(r.tail)}</span>` : ''}${
      r.grade ? `<span class="med" style="color:${r.grade.low ? 'var(--warn)' : 'var(--dim)'}">${esc(r.grade.label)}</span>` : ''}${costChip}${r.lane ? `<span class="med lane">${esc(r.lane)}</span>` : ''}</span>
      ${gapChip}
    </div>`;
  }).join('');
  trk.logEls = [...body.querySelectorAll('.ev')];
  trk.logTimes = rows.map((r) => r.t);
  lastLogIdx = -2;
  renderTicks();
  paintLog();
}

let lastLogIdx = -2;
function paintLog() {
  if (!logTrk || !logTrk.logEls) return;
  let idx = -1;
  for (let i = 0; i < logTrk.logEls.length; i++) {
    if (+logTrk.logEls[i].dataset.t <= simT) idx = i; else break;
  }
  if (idx === lastLogIdx) return;
  lastLogIdx = idx;
  logTrk.logEls.forEach((n, i) => {
    // ⚠️ className을 통째로 갈아엎지 않는다 — 종류 클래스(block·chdrop·chwait)가 지워져
    //    막힘 행이 일반 마크처럼 보인다. 진행 상태 세 개만 교체한다.
    n.classList.remove('past', 'now', 'future');
    n.classList.add(i < idx ? 'past' : (i === idx ? 'now' : 'future'));
  });
  if (idx >= 0 && logTrk.logEls[idx]) logTrk.logEls[idx].scrollIntoView({ block: 'nearest' });
}

/** 스크럽 막대 위 사건 눈금. 눈금 사이의 넓은 빈 구간이 곧 「대기」다.
 *  전체 보기에서는 병목 사건이 눈금이 되고, 넘침(즉시 드롭)은 붉게 세운다. */
function renderTicks() {
  const box = el('ticks');
  const t0 = viewT0(), span = Math.max(1e-6, viewT1() - t0);
  const marks = view === 'all'
    ? (allLogMode === 'c2' && c2Log
        ? c2Log.rows.map((r) => ({ t: r.t, bad: r.drop != null && r.dropR !== 'dead' }))
        : (gv ? gv.marks : []))
    : (sel && sel.logTimes ? sel.logTimes.map((t) => ({ t, bad: false })) : []);
  const seen = new Set();
  box.innerHTML = marks.map((m) => {
    const p = Math.round((m.t - t0) / span * 1000) / 10;
    const key = p + (m.bad ? 'b' : '');
    if (seen.has(key)) return '';
    seen.add(key);
    return `<i${m.bad ? ' class="bad"' : ''} style="left:${p}%"></i>`;
  }).join('');
}

/** 현재 시각 이후 가장 가까운 사건으로 건너뛴다(없으면 끝으로). */
function skipToNextEvent() {
  const times = viewTimes();
  const next = times.find((t) => t > simT + 1e-6);
  simT = next != null ? next : viewT1();
  drawFrame();
}

function nodeName(id) {
  const n = run && run.nodes[id];
  if (!n) return id;
  return n.name || id;
}

/* ══════════════════════════════════════════════════════════════════════════
   4-c. 로그 줄 사이에 흐른 시간 — 「어디서 막혔나」를 로그 안으로 들여온다
   ══════════════════════════════════════════════════════════════════════════ */
/*
 * 종전에는 구간을 오래 걸린 순으로 세운 별도 패널이 있었다. 걷어냈다(사용자 결정) —
 * 순위표는 「무엇이 오래 걸렸나」에는 답하지만 **「언제」** 는 잃는다. 로그는 이미 시각순
 * 한 줄이므로, 시간이 흐른 자리를 로그 그 자리에 적으면 둘 다 답한다.
 *
 * 로그 두 줄 사이의 빈 시간을 「그때 무엇이 벌어지고 있었는가」로 가른다:
 *   대기 — 도착했는데 서버가 안 비어 큐에서 기다림
 *   막힘 — 계선 입구에서 채널이 안 비어 못 떠남
 *   처리 — 실제로 일한 시간
 *   이동 — 선 위를 건넌 시간
 *   공백 — 어느 계통도 아무 일을 하지 않은 시간
 *
 * ⚠️ **붉은색은 대기·막힘에만 준다.** 공백은 C2가 막은 것이 아니라 교전 가능 상태
 *    (사격통제·체공창)를 기다리는 구간이고(ADR-083 ④), 처리·이동은 일한 시간이다.
 *    셋을 한 색으로 칠하면 「C2가 막았다」가 실제보다 부풀려진다.
 * ⚠️ 지휘관이 3~4개 동시에 붙어 계통이 **병렬로** 돈다(ADR-081). 한 틈에 여러 종류가
 *    겹치므로 **가장 오래 덮은 것**으로 이름 붙이고, 그 몫을 툴팁에 초로 남긴다.
 */

/** [a,b]와 구간 목록의 겹침 합. */
function overlapSum(a, b, ivs) {
  let s = 0;
  for (let i = 0; i < ivs.length; i++) {
    const lo = Math.max(a, ivs[i][0]), hi = Math.min(b, ivs[i][1]);
    if (hi > lo) s += hi - lo;
  }
  return s;
}

/** 항적 하나의 구간 목록을 종류별로 한 번만 만든다(틈마다 다시 만들면 O(n²)이 커진다). */
function stallIntervals(t) {
  const t1 = t.exitT != null ? t.exitT : t.endT;
  const qw = [], bl = [], wk = [], mv = [];
  (t.spans || []).forEach((s) => {
    const started = s.start != null ? s.start : (s.drop != null ? s.drop : t1);
    if (started > s.arrive) qw.push([s.arrive, started]);
    if (s.start != null) wk.push([s.start, s.done != null ? s.done : t1]);
  });
  (t.blocks || []).forEach((b) => {
    if (b.kind === 'wait') bl.push([b.t0, isFinite(b.t1) ? b.t1 : t1]);
  });
  (t.flows || []).forEach((f) => { if (f.d > 0) mv.push([f.t0, f.t1]); });
  return { qw, bl, wk, mv, t1 };
}

/** 이보다 짧은 틈은 적지 않는다 — 1~2초짜리까지 적으면 로그가 배지로 덮인다. */
const GAP_MIN = 4;
/**
 * 처리·이동을 병목으로 셀 기준(초).
 *
 * 대기·막힘은 길이와 상관없이 병목이다 — 기다린 시간에는 변명이 없다. 그러나 처리·이동은
 * **일한 시간**이라 짧으면 정상이고 길어야 문제다. 20초로 끊는 것은 매체 카탈로그에
 * 맞춘 것이다: 데이터링크 1~2초·체계내부 1초는 걸리지 않고, 음성 20초·KVMF 30초·
 * 문자 45초·VTC 135초는 걸린다. 상급 C2 처리(평균 37.5초)도 여기 걸린다.
 */
const STALL_LONG = 20;

/**
 * 틈 [a,b]를 분류한다. 반환 {dur, kind, label, stall, parts} 또는 null.
 * kind: 'qw'(대기) · 'bl'(막힘) · 'wk'(처리) · 'mv'(이동) · 'gap'(공백)
 */
function gapOf(iv, a, b) {
  const dur = b - a;
  if (!(dur >= GAP_MIN)) return null;
  const p = { qw: overlapSum(a, b, iv.qw), bl: overlapSum(a, b, iv.bl),
    wk: overlapSum(a, b, iv.wk), mv: overlapSum(a, b, iv.mv) };
  const covered = Math.max(p.qw, p.bl, p.wk, p.mv);
  // 아무것도 이 틈의 10%조차 덮지 않으면 공백이다.
  if (covered < dur * 0.1) {
    return { dur, kind: 'gap', label: '공백', stall: false, parts: p };
  }
  let kind = 'wk';
  if (p.qw >= p.bl && p.qw >= p.wk && p.qw >= p.mv) kind = 'qw';
  else if (p.bl >= p.wk && p.bl >= p.mv) kind = 'bl';
  else if (p.mv > p.wk) kind = 'mv';
  const LABEL = { qw: '대기', bl: '막힘', wk: '처리', mv: '이동' };
  // 대기·막힘은 길이 불문 병목. 처리·이동은 길 때만(STALL_LONG). 공백은 **결코 아니다** —
  // C2가 막은 것이 아니라 교전 가능 상태를 기다린 구간이다(ADR-083 ④).
  const stall = (kind === 'qw' || kind === 'bl') || dur >= STALL_LONG;
  return { dur, kind, label: LABEL[kind], stall, parts: p };
}

/* ══════════════════════════════════════════════════════════════════════════
   5. 그래프 — 선택된 항적이 실제로 지난 노드·간선만 세운다.
      (전 배치 64+노드를 다 그리면 그 항적이 어디를 지났는지가 묻힌다)
   ══════════════════════════════════════════════════════════════════════════ */
function selectTrack(i) {
  if (!run || i < 0 || i >= run.tracks.length) i = 0;
  const t = run.tracks[i];
  if (!t) return;
  // 항적을 고르는 행위 자체가 개별 보기 진입이다(전체 보기의 점 클릭 경유 포함).
  view = 'track';
  el('v-all').classList.remove('on');
  el('v-track').classList.add('on');
  el('tracks-label').textContent = '항적 (이벤트)';
  // 로그 모드 스위치·C2 선택줄은 전체 보기 전용 — 개별 보기의 로그는 늘 sel의 것이다.
  el('log-mode').hidden = true;
  el('log-trk-bar').hidden = true;
  document.querySelectorAll('.trk').forEach((n) => n.classList.toggle('sel', +n.dataset.i === i));

  // 참여 노드 — 간선 양 끝 + 체류가 일어난 노드
  const ids = new Set();
  t.flows.forEach((f) => { ids.add(f.from); ids.add(f.to); });
  t.spans.forEach((s) => ids.add(s.at));
  // 막힌 전문의 양 끝도 세운다 — 한 번도 건너가지 못한 계선은 flows에 없어서, 이걸
  // 빼면 「못 간 곳」이 화면에 아예 없는 채로 "막힘"만 뜬다.
  t.blocks.forEach((b) => { ids.add(b.from); ids.add(b.to); });

  // ── 센서 탐지 상태 타임라인 (사용자 결정: 탐지한 센서마다 불이 들어와야 한다 — 그린파인·
  //    MFR이 동시에 점등되는 순간 포함). SENSOR_* 전이 마크를 센서별 상태열로 갈라 둔다.
  //    보고 경로에 채택되지 않은 센서(예: ew=0의 그린파인)도 **노드로 세운다** — 불은 켜지는데
  //    보고가 안 나가는 그 그림이 바로 최속 경로 규칙(ADR-090 배경)의 관측이다.
  const SENSOR_ST = { SENSOR_DETECTED: 'det', SENSOR_TRACKED: 'trk', SENSOR_FIRE_CONTROL: 'fc',
    SENSOR_TRACK_LOST: null, SENSOR_FC_DEGRADED: 'trk' };
  const sensorStates = {};
  t.stages.forEach((s) => {
    const m = s.name.match(/^(SENSOR_[A-Z_]+):(.+)$/);
    if (!m || !(m[1] in SENSOR_ST) || !run.nodes[m[2]]) return;
    (sensorStates[m[2]] = sensorStates[m[2]] || []).push({ t: s.t, st: SENSOR_ST[m[1]] });
    ids.add(m[2]);
  });

  // ── 「가야 했으나 닿지 못한」 노드 (사용자 결정: 실패한 항적은 원래 갔어야 할 곳이 보여야 한다)
  //    엔진 실패 관측에서 재구성한다 — failure.evidence(누수)·trace.evidence(격추 — 승인까지
  //    받고 못 쏜 축의 사유), trace.unreached(경로 부재로 끊긴 계선), trace.commanders(책임 C2 명단).
  //    ⚠️ 새 사실을 만들지 않는다 — 엔진이 남긴 id·시각을 그대로 옮겨 그릴 뿐이다.
  //    방문한 노드는 제외한다: 이미 계선·체류로 그려져 있고, 문제는 「한 번도 닿지 못함」이다.
  const oc0 = outcomeInfo(t);
  const ghost = new Map();   // toId → { to, from, t, items: [{code, n}] }
  const addGhost = (to, from, t0, code, n) => {
    if (!to || ids.has(to) || !run.nodes[to]) return;
    let g = ghost.get(to);
    if (!g) ghost.set(to, g = { to: to, from: null, t: t0 != null ? t0 : t.spawnT, items: [] });
    if (from && !g.from) g.from = from;
    if (t0 != null) g.t = Math.min(g.t, t0);
    g.items.push({ code: code, n: n || 1 });
  };
  const evd = (t.failure && t.failure.evidence) || t.evidence || {};
  Object.keys(evd).forEach((code) => {
    const d = evd[code].detail || {};
    addGhost(d.shooterId || d.approvalId, d.commanderId, evd[code].firstT, code, evd[code].count);
  });
  (t.unreached || []).forEach((u) => addGhost(u.to, u.from, u.t, u.why, 1));
  // 책임 C2인데 보고가 한 번도 닿지 못한 경우 — 누수 항적에서만 표시(격추 항적에서는 소음).
  if (oc0.leaked) (t.commanders || []).forEach((c) => addGhost(c.id, null, t.spawnT, 'commander_unreached', 1));
  ghost.forEach((g, id) => ids.add(id));

  // 간선 = (from, to, **매체**) 유일 조합.
  // ⚠️ (from,to)로만 묶으면 안 된다. 방공C2A ↔ MCRC 사이에는 성격이 다른 계선이 **세 가닥**
  //    병렬로 있다 — 교전현황(음성/VTC 135초) · 승인협조(음성 20초) · 항적공유(문자 45초).
  //    한 선으로 접으면 먼저 만난 매체의 색만 남아, 나머지 두 채널이 **없는 것처럼** 보인다.
  const edges = new Map();
  t.flows.forEach((f) => {
    const k = edgeKey(f);
    let e = edges.get(k);
    if (!e) edges.set(k, e = { key: k, from: f.from, to: f.to, mt: f.mt, kind: f.kind, n: 0 });
    e.n++;
  });

  sel = Object.assign({}, t, {
    index: i, nodeIds: [...ids], edges: [...edges.values()],
    ghosts: [...ghost.values()], ghostIds: new Set(ghost.keys()),
    sensorStates: sensorStates,
    logRows: buildLogRows(t), logEls: null
  });
  lastLogIdx = -2;
  layoutGraph();
  renderLog();
  // 시계는 항적 생성 시각으로 맞춘다 — 전 실행 시간축에서 보면 대부분이 빈 화면이다.
  simT = sel.spawnT;
  el('scrub').disabled = false;
  el('play').disabled = false;
  el('skip').disabled = false;
  paintClock();
  drawFrame();
}

let geo = null;   // { nodes: {id:{x,y,col}}, edges:[{...,path,len}] , W, H }

/* ── DB 실린더 케파 글리프 (전체 흐름·항적 개별 **공용**) ─────────────────────
   ⚠️ 두 화면이 같은 함수를 써야 한다. 두 벌을 두면 같은 노드가 화면마다 다르게 차오른다
      (이 저장소가 c2Column·stageList에서 이미 겪은 사고다).                        */
const CYL = { w: 20, h: 26, ry: 3.2, qh: 3.2, qgap: 1.4, qmax: 7 };

/**
 * 노드의 처리 용량 — **엔진 `_initNodes`와 같은 규칙**으로 읽는다.
 *   · 센서  → 없음 (엔진이 nodeState 자체를 만들지 않는다)
 *   · C2    → queue.servers / queue.capacity
 *   · 사수  → engage.channels (동시교전 채널) · K = 채널 × 2 (SHOOTER_QUEUE_MULT)
 *
 * ⚠️ 종전에는 `n.queue`만 보고 사수를 「용량 미선언」으로 표시했다. **거짓이었다** —
 *    엔진은 사수에도 M/M/c/K를 돌리고 동시교전 채널 초과를 `capacityBlocks`로 계상한다.
 *    화면이 "없다"고 적으면 그 병목이 있는 줄도 모르게 된다.
 */
function nodeCap(n) {
  if (!n || n.category === 'sensor') return null;
  // unit — C2 「석」(결심 슬롯)·포대 「발」(동시교전 채널). 실린더 숫자 옆과 툴팁에 붙는다.
  if (n.queue && n.queue.servers) {
    return { c: n.queue.servers, K: n.queue.capacity, what: '항적·승인 처리', unit: '석' };
  }
  if (n.engage && n.engage.channels) {
    return { c: n.engage.channels, K: n.engage.channels * 2, what: '동시교전 채널', unit: '발' };
  }
  return null;
}

/** 실린더 SVG. 처리 슬롯이 아래에서 차오르고 대기는 위로 쌓인다. unit은 케파의 단위 글자. */
function cylSvg(p, c, unit) {
  const x0 = p.x - CYL.w / 2, yTop = p.y - CYL.h / 2, yBot = p.y + CYL.h / 2;
  const ticks = c <= 10 ? Array.from({ length: c - 1 }, (_, i) => {
    const ty = yBot - CYL.h * ((i + 1) / c);
    return `<line class="cyl-tick" x1="${x0}" y1="${ty.toFixed(1)}" x2="${x0 + CYL.w}" y2="${ty.toFixed(1)}"></line>`;
  }).join('') : '';
  return `<g class="cyl" data-c="${c}">` +
    `<rect class="cyl-bg" x="${x0}" y="${yTop}" width="${CYL.w}" height="${CYL.h}" rx="2"></rect>` +
    `<rect class="cyl-fill" x="${x0}" y="${yBot}" width="${CYL.w}" height="0"></rect>` + ticks +
    `<ellipse class="cyl-cap" cx="${p.x.toFixed(1)}" cy="${yTop}" rx="${CYL.w / 2}" ry="${CYL.ry}"></ellipse>` +
    `<rect class="cyl-edge" x="${x0}" y="${yTop}" width="${CYL.w}" height="${CYL.h}" rx="2"></rect>` +
    `<text class="cyl-num" x="${p.x.toFixed(1)}" y="${(p.y + 3.5).toFixed(1)}" text-anchor="middle"><tspan class="n"></tspan>` +
    (unit ? `<tspan class="u" dx="1">${esc(unit)}</tspan>` : '') + `</text>` +
    `<g class="cyl-q"></g></g>`;
}

function cylEls(g) {
  return { cyl: g.querySelector('.cyl'), fill: g.querySelector('.cyl-fill'),
    // rim(테두리)도 맥동한다 — 주기를 두 요소에 각각 걸어야 서로 어긋나지 않는다.
    rim: g.querySelector('.cyl-edge'),
    num: g.querySelector('.cyl-num .n'), qbox: g.querySelector('.cyl-q') };
}

/**
 * 실린더 갱신.
 * @param st   그 노드의 **전역** 상태 {busy, q} — 항적 하나의 몫이 아니라 노드 전체 부하다.
 * @param mine 이 항적의 작업이 그 노드에 있으면 { kind:'service' } 또는 { kind:'queue', pos }.
 *             pos는 **앞에 선 건수**(0이면 바로 다음 차례). 없으면 null.
 */
function paintCyl(els, p, c, st, mine) {
  if (!els.fill || !c) return;
  const jam = st.busy >= c && st.q > 0, full = st.busy >= c && !jam;
  const h = CYL.h * Math.min(1, st.busy / c);
  els.fill.setAttribute('y', (p.y + CYL.h / 2 - h).toFixed(1));
  els.fill.setAttribute('height', h.toFixed(1));
  els.cyl.classList.toggle('jam', jam);
  els.cyl.classList.toggle('full', full);
  // 작업중이면 맥동하고, **주기는 그 작업의 실제 서비스 시간**이다.
  // 「차오름(높이)」만으로는 멈춰 선 채 차 있는 것과 지금 돌아가는 것이 구분되지 않았고,
  // 고정 주기로 깜빡이면 3.5초짜리 ECS와 37.5초짜리 KAMDOC이 똑같아 보였다.
  const working = st.busy > 0;
  els.cyl.classList.toggle('working', working);
  if (working) { applyPulse(els.fill, st); applyPulse(els.rim, st); }
  els.cyl.classList.toggle('mine-service', !!(mine && mine.kind === 'service'));
  els.num.textContent = `${st.busy}/${c}`;
  const shown = Math.min(st.q, CYL.qmax);
  let q = '';
  for (let i = 0; i < shown; i++) {
    const y = p.y - CYL.h / 2 - CYL.ry - CYL.qgap - (i + 1) * (CYL.qh + CYL.qgap);
    const isMine = mine && mine.kind === 'queue' && mine.pos === i;
    q += `<rect class="cyl-qd${isMine ? ' mine' : ''}" x="${(p.x - CYL.w / 2 + 2).toFixed(1)}"` +
      ` y="${y.toFixed(1)}" width="${CYL.w - 4}" height="${CYL.qh}" rx="1.4"></rect>`;
    // 「내 것이 몇 번째인가」 — 이게 없으면 남의 줄만 보고 내 차례를 알 수 없다.
    if (isMine) q += `<text class="cyl-mine" x="${(p.x + CYL.w / 2 + 3).toFixed(1)}"` +
      ` y="${(y + CYL.qh).toFixed(1)}">이 항적 ${mine.pos + 1}번째</text>`;
  }
  if (st.q > CYL.qmax) {
    const y = p.y - CYL.h / 2 - CYL.ry - CYL.qgap - (CYL.qmax + 1) * (CYL.qh + CYL.qgap) - 1;
    q += `<text class="cyl-qn" x="${p.x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">+${st.q - CYL.qmax}</text>`;
  }
  // 대기줄이 화면 상한을 넘는 자리에 내 것이 있으면 숫자로라도 알린다.
  if (mine && mine.kind === 'queue' && mine.pos >= CYL.qmax) {
    const y = p.y - CYL.h / 2 - CYL.ry - CYL.qgap - (CYL.qmax + 2) * (CYL.qh + CYL.qgap) - 1;
    q += `<text class="cyl-mine" x="${p.x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">이 항적 ${mine.pos + 1}번째</text>`;
  }
  els.qbox.innerHTML = q;
}

/**
 * 간선 화살촉 — 선 위 62% 지점에 접선 방향으로 박는다.
 * 점이 지나가지 않는 동안에도 **어느 쪽으로 흐르는 계선인지** 보여야 한다.
 * ⚠️ 경로가 DOM에 붙은 뒤에만 부를 수 있다(getPointAtLength).
 */
function arrowsSvg(edges) {
  return edges.map((e) => {
    if (!e.el || !e.len) return '';
    const at = e.len * .62;
    const p1 = e.el.getPointAtLength(Math.max(0, at - 3));
    const p2 = e.el.getPointAtLength(Math.min(e.len, at + 3));
    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
    const m = media(e.mt);
    const sensor = e.mt === 'report-cycle' ? ' sensor-edge' : '';
    return `<path class="earrow${e.back ? ' back' : ''}${sensor}" d="M-4.4,-3.3 L4.4,0 L-4.4,3.3 Z"` +
      ` fill="${e.back ? '#f87171' : m.color}"` +
      ` transform="translate(${((p1.x + p2.x) / 2).toFixed(1)},${((p1.y + p2.y) / 2).toFixed(1)})` +
      ` rotate(${ang.toFixed(1)})"></path>`;
  }).join('');
}

/** 지금 무슨 일이 벌어지는 열을 밝힌다 — 밝은 띠가 좌에서 우로 옮겨 가는 것이 흐름이다.
 *  ⚠️ 히스테리시스를 둔다(벽시계 0.7초). 사건 사이 짧은 틈마다 띠가 꺼졌다 켜지면
 *     「섹션이 깜빡이는」 것으로 읽힌다(실사용 지적 2026-08-30) — 깜빡임은 노드
 *     (작업·교신 맥동)의 몫이고, 띠는 지금 일이 벌어지는 단계를 조용히 가리키는 배경이다. */
function paintLiveCols(geoRef, live) {
  if (!geoRef || !geoRef.bandEls) return;
  const wall = performance.now();
  const hold = geoRef.liveHold || (geoRef.liveHold = {});
  geoRef.bandEls.forEach((b, i) => {
    if (live.has(i)) hold[i] = wall;
    b.classList.toggle('live', live.has(i) || (hold[i] != null && wall - hold[i] < 700));
  });
}

function layoutGraph() {
  const svg = el('graph');
  const wrap = el('graph-wrap');
  const W = Math.max(760, wrap.clientWidth);
  // [전체 흐름]과 **같은 배치**를 쓴다(사용자 결정 2026-09-02). 종전에는 이 항적이 지나간
  // 노드만 그려서 「어디를 안 거쳤나」가 안 보였다 — 사거리 밖이라 못 쓴 포대, 계선이 없어
  // 못 간 제대가 화면에서 사라졌다. 배치 전체를 세우고 이 항적이 쓴 것만 또렷하게 둔다.
  // 두 보기가 같은 자리에 같은 노드를 두므로 탭을 오갈 때 배치를 다시 익힐 필요가 없다.
  const showIdle = el('show-idle').checked;
  const rel = new Set(sel.nodeIds);
  const nid = (k) => slotNodeId(k);
  // 열 안 정렬은 **이 항적이 쓴 것 먼저** — 쓴 노드가 위로 모여야 흐름을 위에서부터 읽는다.
  // 높이는 placeSlots가 노드 수에서 정한다([전체 흐름]과 같은 값 → 두 보기의 자리가 같다).
  const { nodes, colW, buckets, H } = placeSlots(W, wrap.clientHeight || 480, (a, b) =>
    (rel.has(nid(b)) - rel.has(nid(a))) ||
    ((run.nodes[nid(a)] && run.nodes[nid(a)].name) || a)
      .localeCompare((run.nodes[nid(b)] && run.nodes[nid(b)].name) || b, 'ko'));
  // 이 항적이 그 열을 거쳤는가 — 배치 전체를 그리므로 buckets 길이로는 알 수 없다.
  const relInCol = buckets.map((ids) => ids.filter((k) => rel.has(nid(k))).length);

  // 같은 두 노드를 잇는 병렬 계선은 서로 벌려 그린다 — 겹치면 세 채널이 한 가닥으로 보인다.
  const par = {};
  sel.edges.forEach((e) => {
    const pk = pickSlots(run.nodes[e.from], run.nodes[e.to]);
    e._ak = slotKey(e.from, pk.a.dup); e._bk = slotKey(e.to, pk.b.dup);
    (par[e._ak + '>' + e._bk] = par[e._ak + '>' + e._bk] || []).push(e);
  });

  // 간선 경로 — 정방향은 완만한 S자, 역방향은 아래로 크게 휘는 호
  const edges = sel.edges.map((e) => {
    const a = nodes[e._ak], b = nodes[e._bk];
    if (!a || !b) return null;
    if (a.x === b.x && a.y === b.y) return null;
    const sib = par[e._ak + '>' + e._bk];
    const off = (sib.indexOf(e) - (sib.length - 1) / 2) * 26;   // 병렬 계선 벌림
    const back = b.col <= a.col;
    let d;
    if (back) {
      const dip = Math.max(40, Math.abs(a.x - b.x) * .22 + 34) + off;
      d = `M${a.x},${a.y} C${a.x - 10},${a.y + dip} ${b.x + 10},${b.y + dip} ${b.x},${b.y}`;
    } else {
      const mx = (a.x + b.x) / 2;
      d = `M${a.x},${a.y} C${mx},${a.y + off} ${mx},${b.y + off} ${b.x},${b.y}`;
    }
    // ca·cb — 이 간선이 넘는 열 구간. 열 밝힘(liveCols)·킬체인 프론티어가 쓴다.
    return Object.assign({}, e, { d: d, back: back, a: a, b: b, ca: a.col, cb: b.col });
  }).filter(Boolean);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');

  // 정적 레이어(열 띠 · 간선 · 노드)를 한 번만 그린다. 재생 중에는 점만 갱신한다.
  const bands = COLS.map((c, i) => {
    const x = colW * i;
    return `<g><rect class="colband${i % 2 ? ' alt' : ''}" x="${x}" y="0" width="${colW}" height="${H}"></rect>` +
      `<text class="colhdr" x="${x + colW / 2}" y="18" text-anchor="middle">${esc(c.label)}</text>` +
      `<text class="colhdr" x="${x + colW / 2}" y="30" text-anchor="middle" opacity=".65">${esc(c.hint)}</text>` +
      // ⚠️ 배치 전체를 그리므로 buckets 길이는 「자리가 있나」일 뿐이다. 여기서 말해야 하는
      //    것은 **이 항적이 그 열을 거쳤나**라서 relInCol로 판정한다.
      (relInCol[i] ? '' :
        `<text class="colhdr" x="${x + colW / 2}" y="${(H / 2).toFixed(0)}" text-anchor="middle" opacity=".5">이 항적은 안 거침</text>`) +
      `</g>`;
  }).join('');

  const edgeSvg = edges.map((e, i) => {
    const m = media(e.mt);
    const ovr = overrides[ovrKey(e)];
    // 클릭 판정용 투명 굵은 선을 밑에 깐다 — 2~3px 선은 정확히 집기가 어렵다.
    return `<g class="edgeg" data-ei="${i}">` +
      `<path class="edge-hit" d="${e.d}"></path>` +
      `<path class="edge${ovr ? ' overridden' : ''}" d="${e.d}" stroke="${m.color}" stroke-width="${m.w}" opacity=".42"` +
      (m.dash && !ovr ? ` stroke-dasharray="${m.dash}"` : '') + `>` +
      `<title>${esc(nodeName(e.from) + ' → ' + nodeName(e.to) + ' · ' + m.label +
        ' · 전문 ' + e.n + '건' + (e.back ? ' (역방향 — 계선을 되돌아간다)' : '') +
        edgeMetaLine(e.from, e.to, e.mt) +
        '\n클릭하면 이 계선의 매체를 바꿔볼 수 있습니다')}</title></path></g>`;
  }).join('');

  // 큐가 선언된 노드는 전체 흐름과 **같은 DB 실린더**를 쓴다. 종전 항적 개별 보기는
  // 케파를 아예 안 그리고 「대기 N」만 적었는데, 그 N은 **이 항적 자기 작업만** 센 값이라
  // 노드의 실제 부하가 아니었다 — 앞에 남의 작업이 20건 쌓여 있어도 「대기 1」로 보였다.
  const nodeSvg = Object.keys(nodes).map((k) => {
    const p = nodes[k], n = run.nodes[p.id] || {};
    const cat = n.category || 'c2';
    // 이 항적과 무관한 노드 — 자리도 이름도 남기되 흐리게. 「어느 장비가 안 쓰였나」를
    // 이름으로 읽을 수 있어야 배치 그림이 된다(사용자 지적 2026-09-02).
    if (!rel.has(p.id)) {
      if (!showIdle) return '';
      const nm = wrapLabel(n.name || p.id, 15, 1);
      return `<g class="idleg"><circle class="idlen ${cat}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6"></circle>` +
        `<text class="idlelabel" x="${p.x.toFixed(1)}" y="${(p.y + 18).toFixed(1)}" text-anchor="middle">${esc(nm[0] || '')}</text>` +
        `<title>${esc((n.name || p.id) + '\n이 항적에는 쓰이지 않았습니다')}</title></g>`;
    }
    // 「닿지 못한」 노드는 점선 원으로만 — 이 항적의 일이 벌어진 적 없는 자리에 실린더를
    // 그리면 케파가 있는 것처럼 읽힌다.
    const gh = sel.ghostIds && sel.ghostIds.has(p.id)
      ? sel.ghosts.find((g) => g.to === p.id) : null;
    // ⚠️ 실린더는 **일하는 자리에만**. 중복 노드의 상행 자리는 순수 중계라 용량을 그리지 않는다
    //    (같은 부하를 두 번 그리면 노드가 두 배로 바쁜 것처럼 보인다).
    const cap = !gh && isWorkSlot(p.dup) ? nodeCap(n) : null;
    // 행 높이가 54px라 실린더(26px)와 두 줄 라벨이 모두 들어간다 — 밀집 예외가 필요 없다.
    const hasCap = !!cap;
    const lines = wrapLabel((n.name || p.id) + (p.dup === 'up' ? ' ↑중계' : ''), 14, 2);
    const labelY = hasCap ? p.y + CYL.h / 2 + 12 : p.y + 20;
    return `<g class="nodeg${hasCap ? ' hascyl' : ''}${p.dup === 'up' ? ' relay' : ''}${gh ? ' ghost' : ''}" data-id="${esc(p.id)}" data-slot="${esc(k)}">` +
      (hasCap ? cylSvg(p, cap.c, cap.unit)
        : `<circle class="ncirc ${cat}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.dense ? 7 : 9}"></circle>` +
          `<text class="qbadge" x="${(p.x + 12).toFixed(1)}" y="${(p.y - 8).toFixed(1)}"></text>`) +
      lines.map((ln, li) =>
        `<text class="nlabel" x="${p.x.toFixed(1)}" y="${(labelY + li * 11).toFixed(1)}" text-anchor="middle">${esc(ln)}</text>`).join('') +
      `<title>${esc((n.name || p.id) + '\n' + p.id +
        (gh ? '\n⚠️ 가야 했으나 닿지 못한 노드 — 이 항적의 전문이 한 번도 도달하지 못했다' +
          '\n사유: ' + ghostReasonText(gh) + '\n최초 ' + fmt(gh.t)
        : (p.dup === 'up' ? '\n보고 상행 중계 자리 — 같은 노드가 오른쪽 「명령 ↓」 열에 한 번 더 선다'
          : p.dup === 'dn' ? '\n명령 하행 자리 — 큐가 여기 쌓인다' : '') +
        (cap ? `\n${cap.what} — ${cap.c}${cap.unit} · 대기실 ${cap.K}${cap.unit}` +
          (cap.unit === '석' ? ' (석 = 동시 결심 슬롯)' : ' (발 = 동시 유도 요격탄)')
          : (n.category === 'sensor' ? '\n(센서 — 처리 큐 없음)' : '\n(중계 — 용량 표시 없음)'))))}</title></g>`;
  }).join('');

  // 「닿지 못한」 계선 — 실패 증거의 from(명령·협조를 시도한 C2) → to(못 간 노드).
  // 흐름 간선과 달리 클릭 대상이 아니다(매체가 없는, 성립하지 않은 이동이므로).
  const gEdges = (sel.ghosts || []).map((g) => {
    if (!g.from) return null;
    const fromNode = run.nodes[g.from], toNode = run.nodes[g.to];
    if (!fromNode || !toNode) return null;
    const pk = pickSlots(fromNode, toNode);
    const a = nodes[slotKey(g.from, pk.a.dup)], b = nodes[slotKey(g.to, pk.b.dup)];
    if (!a || !b) return null;
    const mx = (a.x + b.x) / 2;
    return { g, a, b, d: `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}` };
  }).filter(Boolean);
  const ghostSvg = gEdges.map((e, i) =>
    `<g class="gedge" data-gi="${i}"><path d="${e.d}"></path>` +
    `<title>${esc(nodeName(e.g.from) + ' ↛ ' + nodeName(e.g.to) + ' — 가야 했으나 못 간 계선\n' +
      '사유: ' + ghostReasonText(e.g) + '\n최초 ' + fmt(e.g.t))}</title></g>`).join('');

  svg.innerHTML = bands + `<g id="lyr-edges">${edgeSvg}</g><g id="lyr-ghost">${ghostSvg}</g>` +
    `<g id="lyr-arrows"></g><g id="lyr-nodes">${nodeSvg}</g><g id="lyr-dots"></g>`;
  geo = { nodes, edges, W, H, colW };
  // 간선 길이는 점 위치 계산에 쓴다(getPointAtLength) — DOM에 붙인 뒤에만 잴 수 있다.
  [...svg.querySelectorAll('#lyr-edges .edgeg')].forEach((g, i) => {
    const p = g.querySelector('.edge');
    edges[i].el = p; edges[i].len = p.getTotalLength();
    g.addEventListener('click', (ev) => openMediaPopover(edges[i], ev));
  });
  // 화살촉은 길이를 잰 **뒤에** 그린다.
  svg.querySelector('#lyr-arrows').innerHTML = arrowsSvg(edges);
  // 「닿지 못한」 계선 끝에 ✕ — 도착 지점 직전에 세워 「여기까지 못 갔다」를 못박는다.
  // 실패 시각 전에는 옅게 두었다가(geo.ghostEls) 재생이 그 시각을 지나면 또렷해진다.
  geo.ghostEls = [];
  [...svg.querySelectorAll('#lyr-ghost .gedge')].forEach((gel, i) => {
    const p = gel.querySelector('path');
    const pt = p.getPointAtLength(Math.max(0, p.getTotalLength() - 20));
    gel.insertAdjacentHTML('beforeend',
      `<line class="gx" x1="${(pt.x - 5).toFixed(1)}" y1="${(pt.y - 5).toFixed(1)}" x2="${(pt.x + 5).toFixed(1)}" y2="${(pt.y + 5).toFixed(1)}"></line>` +
      `<line class="gx" x1="${(pt.x - 5).toFixed(1)}" y1="${(pt.y + 5).toFixed(1)}" x2="${(pt.x + 5).toFixed(1)}" y2="${(pt.y - 5).toFixed(1)}"></line>`);
    geo.ghostEls.push({ el: gel, t: gEdges[i].g.t });
  });
  [...svg.querySelectorAll('.nodeg.ghost')].forEach((gn) => {
    const g = sel.ghosts.find((x) => x.to === gn.dataset.id);
    if (g) geo.ghostEls.push({ el: gn, t: g.t });
  });
  geo.bandEls = [...svg.querySelectorAll('.colband')];
  geo.edgeByKey = {};
  edges.forEach((e) => { geo.edgeByKey[e.key] = e; });
  geo.nodeEls = {};
  [...svg.querySelectorAll('.nodeg')].forEach((g) => {
    // ⚠️ **인스턴스 키**로 담는다. 노드 id로 담으면 ECS 상행/하행이 서로 덮어써
    //    한쪽만 갱신된다(실린더가 영영 안 차오르는 증상).
    geo.nodeEls[g.dataset.slot] = Object.assign({ g, id: g.dataset.id,
      circ: g.querySelector('.ncirc'), badge: g.querySelector('.qbadge') }, cylEls(g));
  });
}
