<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지휘 흐름 — 케파·병목과 항적별 전문 이동 (프로토타입) — 단일본</title>
<!--
  무엇을 보는 화면인가
  ────────────────────
  지도가 아니라 **계선(간선)** 위에서 전문이 움직이는 것을 본다. 두 보기가 있다.

  · [전체 흐름] — 배치 전체(251노드)를 세우고 전 항적을 겹친다. 노드 테두리 링이
    처리중/서버수만큼 차오르고(가득=노랑, 가득+대기=빨강), 큐 대기는 점 꼬리로 쌓이고,
    대기실 초과 즉시 드롭은 붉은 섬광으로 튄다. 좌측에 부하 순위와 「C2 처리|병목」 로그
    (C2 처리 = 노드 하나의 도착·대기·처리·드롭 — 실린더가 차오르는 것을 줄로 읽는 자리).
    느린 매체(≥10초)만 개별 점으로 그리고 빠른 매체는 선 맥동으로 집약한다.
  · [항적 개별] — 항적 하나의 전문 이동을 따라간다. 점 하나가 전문 한 건이고,
    점이 선을 건너는 데 걸리는 시간이 곧 그 계선의 실제 지연이다. 그래서 **빠르면
    데이터링크, 기어가면 음성·문자·VTC**로 눈에 바로 들어온다.
  전체 보기의 느린 점을 클릭하면 그 항적의 개별 보기로 내려간다. **병목 로그의 줄도 같은
  입구다** — 항적이 걸린 줄(누수·중복교전·계선 막힘·넘침)을 누르면 그 사건이 난 시각으로
  맞춰진 채 개별 보기가 열리고, 여러 항적이 묶인 줄은 눌러서 펼친 뒤 고른다.

  좌→우를 읽는 장치 (두 보기 공통)
  ──────────────────────────────
  · **작업 맥동** — 지금 일하는 노드가 깜빡이고, **그 주기가 곧 처리 중인 작업의 실제
    서비스 시간**이다. ECS(평균 3.5초)는 빠르게 깜빡이고 MCRC·KAMDOC(37.5초)·사수
    (40~60초)는 느리게 고동친다. 속도를 읽는 자리가 흐름이 벌어지는 자리와 같아야
    하므로 **별도의 속도계를 화면 위쪽에 따로 세우지 않는다**(사용자 결정).
    ⚠️ 노드 글리프에 초를 **글자로 적지 않는다**(사용자 결정) — 빠르기는 맥동으로만
       말한다. 시각별 수치는 왼쪽 「어디서 막혔나」·이벤트 로그가 이미 초 단위로 적는다.
  · **교신 맥동** — 전문을 주고받는 중인 노드의 테두리가 고동친다. 주기 = 그 전문의
    실제 전송 시간(작업 맥동과 같은 클립 규칙). 처리 중이면 작업 맥동이 우선하고,
    센서 보고(report-cycle)는 세지 않는다. 열 띠(밝아진 열)는 히스테리시스를 두어
    깜빡이지 않는다 — **깜빡임은 노드의 몫, 띠는 배경**이다(사용자 결정 2026-08-30).
  · **화살촉** — 점이 지나가지 않는 동안에도 계선의 방향이 보인다. 붉은 화살촉은
    역방향(승인 협조·교전명령 하달)이다.
  · **밝아진 열 · 킬체인 프론티어** — 지금 일이 벌어지는 단계가 밝아지고, 항적 개별
    보기에서는 계선이 도달한 가장 오른쪽 열에 파란 점선이 선다. 시간이 흐르면 밝은
    띠와 점선이 왼쪽에서 오른쪽으로 옮겨 간다 — 그것이 「항적이 움직이니 C2가
    차례로 반응한다」의 그림이다.

  ⚠️ 좌표·시각을 지어내지 않는다. 모든 점의 출발·도착 시각은 `KJ.runDES({flowTrace:true})`가
     기록한 실제 실행값이다(엔진 `_recordLink`/`_flowEvent` — 순수 관측, RNG·동역학 불변).
     지연 분포가 뽑은 값 그대로이므로 같은 매체라도 건마다 시간이 다르다.

  이 파일은 **프로토타입**이다. 본 앱(index.html)에는 아직 붙이지 않았다.
  실행: 저장소 루트에서 정적 서버를 띄우고 /prototype/command-flow.html 을 연다.
        (file:// 로는 안 된다 — ES 모듈 import가 막힌다)
-->
<style>
  :root {
    --bg: #0b1017; --panel: #111823; --panel2: #0d1117; --line: #1e2937;
    --fg: #dbe4f0; --dim: #7d8ba0; --accent: #4da3ff;
    --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input { font: inherit; color: var(--fg); background: #16202e;
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ── 상단 실행 바 ── */
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: -.01em; }
  header label { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  #status { margin-left: auto; color: var(--dim); font-size: 12px; }
  .modesw { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .modesw button { border: 0; border-radius: 0; padding: 4px 12px; }

  /* 조작 손잡이 줄은 걷어냈다(URL 파라미터로만 조작). 남은 것은 재실행 알림뿐. */
  .dim { color: var(--dim); }
  /* 고정 배치 표기 — 조작은 못 하되 어떤 배치인지는 늘 보여야 한다 */
  #dep-fixed { color: var(--dim); font-size: 12px; }
  #dep-fixed b { color: var(--fg); font-weight: 600; }
  #dirty { margin-left: auto; color: #04121f; background: var(--warn); font-weight: 700;
    padding: 2px 9px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  header #status { margin-left: 10px; }

  /* 계선 매체 교체 팝오버 */
  #pop { position: fixed; z-index: 40; width: 300px; padding: 10px;
    background: var(--panel); border: 1px solid #33456b; border-radius: 8px;
    box-shadow: 0 12px 34px rgba(0,0,0,.6); font-size: 12px; }
  #pop-title { font-weight: 700; margin-bottom: 2px; }
  #pop-body { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
  #pop-body button { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
  #pop-body button .h { color: var(--dim); font-size: 11px; }
  #pop-warn { color: var(--warn); font-size: 11px; line-height: 1.45; margin-bottom: 8px; }
  .edge.hot { opacity: .95 !important; }
  .edge { cursor: pointer; }
  .edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  .edge.overridden { stroke-dasharray: 1 5 !important; }
  .ovrmark { fill: var(--warn); font-size: 11px; }

  /* ── 본문 3분할 ── */
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 340px; flex: none; display: flex; flex-direction: column;
    background: var(--panel2); border-right: 1px solid var(--line); min-height: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* 패널 접기 — 발표할 때는 그래프가 주인공이고, 분석할 때는 로그가 항적으로 내려가는
     입구다. 둘 중 하나를 고를 이유가 없어 **없애지 않고 접는다**.
     ⚠️ `#side{display:flex}`가 UA 기본 `[hidden]{display:none}`을 **이긴다** — 바로 아래
        .sec에서 이미 겪은 그 함정이라, hidden 규칙을 여기서도 명시해야 한다. */
  #side[hidden] { display: none; }

  .sec { display: flex; flex-direction: column; min-height: 0; }
  /* ⚠️ `.sec{display:flex}`는 브라우저 기본 `[hidden]{display:none}`을 **이긴다**(작성자 규칙이
     UA 규칙보다 우선). 이 한 줄이 없으면 hidden을 걸어도 그대로 보인다 — 실제로 전체 흐름
     보기에서 「어디서 막혔나」 빈 제목이 남았다. */
  .sec[hidden] { display: none; }
  .sec > h2 { font-size: 11px; margin: 0; padding: 7px 10px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--line);
    text-transform: none; letter-spacing: .02em; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .scroll { overflow-y: auto; overflow-x: hidden; }

  /* 항적 목록 */
  #tracks { flex: 0 0 34%; }
  #track-list { padding: 2px 0; }
  .trk { display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer;
    border-left: 3px solid transparent; }
  .trk:hover { background: #16202e; }
  .trk.sel { background: #17293f; border-left-color: var(--accent); }
  .trk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk .sub { color: var(--dim); font-size: 11px; }
  .pill { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: #1c6448; }
  .pill.bad { color: var(--bad); border-color: #6b2b2b; }
  .pill.idle { color: var(--dim); border-color: var(--line); }
  .pill.dup { color: #f0a060; border-color: #6b4a20; }

  #tracks { flex: 0 0 34%; }

  /* 이벤트 로그 */
  #log { flex: 1; }
  #log-body { padding: 2px 0 40px; }
  /* 전체 흐름 좌하단 로그의 모드 스위치(항적/병목)·항적 선택줄.
     ⚠️ display를 직접 주는 요소는 [hidden]을 이긴다(#signal과 같은 함정) — 짝을 꼭 둔다. */
  .minisw { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex: none; }
  .minisw[hidden] { display: none; }
  .minisw button { border: 0; border-radius: 0; padding: 1px 8px; font-size: 11px; }
  #log-trk-bar { display: flex; gap: 6px; padding: 4px 10px 3px; align-items: center;
    border-bottom: 1px solid var(--line); }
  #log-trk-bar[hidden] { display: none; }
  #log-trk-bar select { flex: 1; min-width: 0; font-size: 12px; padding: 2px 6px; }
  #log-trk-bar button { flex: none; font-size: 11px; padding: 2px 8px; white-space: nowrap; }
  .ev { display: flex; gap: 7px; padding: 2px 10px; border-left: 3px solid transparent; align-items: baseline; }
  .ev .t { color: var(--dim); flex: none; width: 52px; text-align: right; font-size: 11px; }
  .ev .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 줄 사이에 흐른 시간. **붉은 것은 병목(대기·막힘)뿐이다** — 공백은 C2가 막은 것이
     아니고(ADR-083 ④) 처리·이동은 일한 시간이라, 같이 붉히면 「C2가 막았다」가 부풀려진다.
     ⚠️ .now/.past보다 **먼저** 선언한다. 붉은 배경이 현재 줄 강조를 덮으면 어디를
        재생 중인지 놓친다(왼쪽 붉은 띠는 inset 그림자라 그대로 남는다). */
  .ev .gap { flex: none; font-size: 10px; color: var(--dim); white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .ev.stall { background: rgba(248,113,113,.09); box-shadow: inset 3px 0 0 var(--bad); }
  .ev.stall .gap { color: var(--bad); font-weight: 700; }
  .ev.future { opacity: .32; }
  .ev.now { background: #17293f; border-left-color: var(--accent); }
  .ev.past { opacity: .72; }
  .ev.link .x::before { content: '↦ '; color: var(--dim); }
  .ev.mark .x::before { content: '· '; color: var(--dim); }
  .ev .med { font-size: 10px; padding: 0 4px; border-radius: 3px; margin-left: 4px; }
  /* 지휘 축 꼬리표 — 같은 문구의 마크(승인완료 등)가 어느 계통 것인지 가른다 */
  .ev .lane { color: var(--dim); border: 1px solid var(--line); }
  /* 요격탄 단가 대 위협 가치 — 고가 유도탄(≥5 M$)은 붉게 */
  .ev .cost { color: var(--dim); border: 1px solid var(--line); }
  .ev .cost.hi { color: var(--bad); border-color: #6b2b2b; font-weight: 700; }

  /* 신호등 — 그래프 **하단 빈 공간**에 띄운다. 노드는 위쪽에 몰리고 아래가 비므로
     그림을 가리지 않고, 바로 밑 재생 컨트롤과 붙어 스크럽하며 읽기 좋다. */
  #signal { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 5;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; pointer-events: none; }
  /* ⚠️ `.sec`와 **똑같은 함정**이다(위 주석 참조) — 작성자의 `display:flex`가 UA 기본
     `[hidden]{display:none}`을 이긴다. 이 한 줄이 없으면 setView('all')이 hidden을 걸어도
     신호등이 그대로 남아, 전체 흐름 보기에 **직전에 보던 항적의** 「격추 완료」가 떠 있다
     (실측). 전 항적을 겹쳐 보는 화면에 항적 하나의 상태를 띄우는 것이라 그냥 오답이다. */
  #signal[hidden] { display: none; }
  .sig { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 13px; font-size: 12px; font-weight: 600;
    background: rgba(11,16,23,.92); border: 1px solid; backdrop-filter: blur(2px); }
  .sig .lamp { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sig .sub { font-weight: 400; opacity: .75; font-size: 11px; }
  .sig.go    { border-color: #1c6448; color: var(--ok); }
  .sig.go    .lamp { background: var(--ok); }
  .sig.wait  { border-color: #6b5220; color: var(--warn); }
  .sig.wait  .lamp { background: var(--warn); animation: blink 1.1s infinite; }
  .sig.stop  { border-color: #6b2b2b; color: var(--bad); }
  .sig.stop  .lamp { background: var(--bad); animation: blink .7s infinite; }
  .sig.idle  { border-color: var(--line); color: var(--dim); }
  .sig.idle  .lamp { background: #44506a; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* 막힌 지점 강조 — 신호등이 가리키는 곳을 그래프에서도 짚는다 */
  .blockmark { fill: none; stroke: var(--bad); stroke-width: 2.5; animation: blink 1.1s infinite; }
  .blockmark.wait { stroke: var(--warn); }
  .wantpath { fill: none; stroke: var(--bad); stroke-width: 5; opacity: .3;
    stroke-dasharray: 9 6; animation: crawl 1.4s linear infinite; }
  @keyframes crawl { to { stroke-dashoffset: -15; } }

  /* 그래프 */
  /* ⚠️ 종전에는 overflow:hidden + svg height:100% + preserveAspectRatio meet 이라
     **세로가 길어질수록 전체가 축소**됐다 — 노드를 더 그리면 정작 봐야 할 것이 작아지는
     구조였다(사용자 지적 2026-09-02). 이제 세로로 스크롤한다: viewBox가 길어지면 그린 것이
     작아지는 게 아니라 화면이 길어진다. 가로는 항상 폭에 맞춘다. */
  #graph-wrap { flex: 1; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; }
  svg#graph { width: 100%; height: auto; display: block; }
  .colhdr { fill: #55637a; font-size: 10px; }
  .colband { fill: #0e1520; }
  .colband.alt { fill: #0b1017; }
  .nlabel { fill: #b7c4d6; font-size: 10px; }
  .nsub { fill: #61708a; font-size: 9px; }
  .ncirc { fill: #16202e; stroke: #34435a; stroke-width: 1.5; }
  .ncirc.sensor { stroke: #22d3ee; }
  .ncirc.c2 { stroke: #4da3ff; }
  .ncirc.shooter { stroke: #34d399; }
  .ncirc.busy { fill: #1d3a52; stroke-width: 2.5; }
  .ncirc.queued { stroke-dasharray: 3 2; }
  /* 이 항적과 무관한 노드 — [전체 흐름]과 **같은 자리**에 흐릿하게 남긴다.
     자리를 지워 버리면 「어디를 안 거쳤나」가 안 보이고, 탭을 오갈 때 배치가 달라져
     눈이 매번 다시 익혀야 한다(사용자 결정 2026-09-02). */
  .idleg { opacity: .34; }
  .idleg:hover { opacity: .85; }
  .idlen { fill: #131c28; stroke: #33445c; stroke-width: 1.2; }
  .idlen.sensor { stroke: #1c8ea3; }
  .idlen.c2 { stroke: #3a72b0; }
  .idlen.shooter { stroke: #2a8f6c; }
  .idlelabel { fill: #6b7a91; font-size: 9px; }
  .edge { fill: none; stroke-linecap: round; }
  .dot { stroke: #04121f; stroke-width: .8; }
  .dotlab { font-size: 9px; fill: #cfe0f5; paint-order: stroke; stroke: #04121f; stroke-width: 2.5; }
  .qbadge { font-size: 9px; fill: #fbbf24; }

  /* ── 좌→우 방향 표기 (ADR-088) ────────────────────────────────────────────
     간선이 어느 쪽으로 흐르는지 **정지 상태에서도** 보여야 한다. 종전에는 점이
     지나갈 때만 방향을 알 수 있었고, 점이 없는 동안(대부분의 시간)에는 선이
     양방향처럼 보였다. 화살촉을 선 위 62% 지점에 접선 방향으로 박는다. */
  .earrow { opacity: .55; }
  .earrow.back { opacity: .8; }
  /* 열 활성 — 지금 무슨 일이 벌어지는 열을 밝힌다. 시간이 흐르면 밝은 띠가
     좌에서 우로 옮겨 가고, 그것이 곧 「항적의 움직임에 C2가 반응하는」 그림이다. */
  .colband { transition: fill .18s linear; }
  .colband.live { fill: #15212f; }
  .colband.alt.live { fill: #111c28; }
  /* 킬체인 진행 프론티어 — 이 항적의 계선이 지금까지 도달한 가장 오른쪽 열 */
  .frontier { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .7; }
  .frontier-lab { font-size: 10px; fill: var(--accent); font-weight: 700;
    paint-order: stroke; stroke: #0b1017; stroke-width: 3; }


  /* ── 전체 흐름 보기 ── */
  /* (케파 링은 DB 실린더로 대체됐다 — ADR-088 이전 표기) */

  /* DB 실린더 케파 — 처리 슬롯이 아래에서 차오르고 대기는 위로 쌓인다 */
  .cyl-bg { fill: #131c28; }
  .cyl-edge { fill: none; stroke: #34435a; stroke-width: 1.4; }
  .cyl-cap { fill: #1b2637; stroke: #34435a; stroke-width: 1.4; }
  .cyl-fill { fill: var(--accent); opacity: .85; transition: none; }
  .cyl.full .cyl-fill { fill: var(--warn); }
  .cyl.jam  .cyl-fill { fill: var(--bad); }
  /* ── 작업 맥동 — 「빠르면 빨리, 느리면 천천히 깜빡인다」 (ADR-088) ─────────
     작업중인 노드가 깜빡이고, **그 주기가 곧 지금 처리 중인 작업의 서비스 시간**이다.
     ECS(평균 3.5초)는 빠르게 깜빡이고 MCRC·KAMDOC(평균 37.5초)는 느리게 고동친다 —
     화면 어디가 빠르고 어디가 굼뜬지를 숫자 이전에 눈이 잡는다.

     ⚠️ 주기는 **인라인 style로만** 준다(applyPulse). 여기 duration을 적으면 인라인을
        덮거나 덮여서 「같은 속도로 깜빡이는 화면」으로 조용히 되돌아간다.
     ⚠️ 높이·색은 건드리지 않는다 — 처리중/서버수와 포화 단계는 계속 읽혀야 한다.
        흔드는 것은 투명도뿐이고, .25까지 떨구면 눈금이 사라지므로 .42에서 멈춘다. */
  .cyl.working .cyl-fill { animation: cylwork ease-in-out infinite; }
  .cyl.working .cyl-edge { animation: cylrim ease-in-out infinite; }
  @keyframes cylwork { 0%, 100% { opacity: .88 } 50% { opacity: .42 } }
  /* 테두리는 색과 굵기를 함께 흔든다 — 색만 바꾸면 어두운 배경에서 진폭이 안 보인다. */
  @keyframes cylrim  { 0%, 100% { stroke: #34435a; stroke-width: 1.2 } 50% { stroke: #7fb6ff; stroke-width: 2.6 } }
  .cyl.full.working .cyl-edge { animation-name: cylrim-full; }
  .cyl.jam.working  .cyl-edge { animation-name: cylrim-jam; }
  @keyframes cylrim-full { 0%, 100% { stroke: #34435a; stroke-width: 1.2 } 50% { stroke: var(--warn); stroke-width: 2.6 } }
  @keyframes cylrim-jam  { 0%, 100% { stroke: var(--bad); stroke-width: 2 } 50% { stroke: #ffd0d0; stroke-width: 3 } }
  /* 실린더를 못 그린 자리(밀집 열·센서·사수)의 동그라미도 **같은 규칙으로** 깜빡인다.
     사수의 발사 처리는 40~60초라 눈에 띄게 느리게 고동친다 — 그것이 사실이다. */
  .ncirc.busy { animation: circwork ease-in-out infinite; }
  @keyframes circwork { 0%, 100% { fill: #3b6f9c; stroke: #7fb6ff; stroke-width: 2.6 } 50% { fill: #16202e; stroke: #34435a; stroke-width: 1.5 } }
  /* ── 교신 맥동 — 전문을 실제로 주고받는 중인 노드의 테두리가 고동친다 ─────────
     처리(작업 맥동)와 별개의 신호다: 지금 이 노드를 끝점으로 전문이 계선 위에 떠 있는
     동안 테두리만 흔든다. 주기 = 그 전문의 실제 전송 시간(배속 나눔·PULSE 클립 —
     작업 맥동과 같은 규칙, 지어낸 주기가 아니다).
     ⚠️ 처리 중이면 작업 맥동이 이긴다(:not 가드) — 두 애니메이션이 같은 요소를 두고
        싸우면 어느 쪽도 읽히지 않는다.
     ⚠️ 센서 보고(report-cycle)는 세지 않는다 — 주기 보고가 상시 흐르는 센서·ECS 열이
        영영 깜빡여 신호가 아니라 소음이 된다(점 표시의 SLOW 집약과 같은 이유). */
  .ncirc.talking:not(.busy) { animation: circtalk ease-in-out infinite; }
  @keyframes circtalk { 0%, 100% { stroke-width: 1.5 } 50% { stroke: #7fb6ff; stroke-width: 3.2 } }
  .cyl.talking:not(.working) .cyl-edge { animation: cylrim ease-in-out infinite; }
  .cyl.jam  .cyl-edge { stroke: var(--bad); stroke-width: 2; }
  .cyl-tick { stroke: #0b1017; stroke-width: 1; opacity: .8; }
  .cyl-num { font-size: 9.5px; font-weight: 700; fill: #dbe4f0;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.4; pointer-events: none; }
  /* 케파 단위 — C2 「석」(결심 슬롯) · 포대 「발」(동시교전 채널). 두 실린더가 같은 모양이라
     단위 없이 숫자만 견주면 서로 다른 양을 비교하게 된다(실제 오독 문답). */
  .cyl-num .u { font-size: 6.5px; font-weight: 400; fill: var(--dim); }
  /* 대기 디스크 — 쌓일수록 위로 자란다 */
  .cyl-qd { fill: var(--warn); opacity: .9; }
  .cyl.jam .cyl-qd { fill: var(--bad); }
  .cyl-qn { font-size: 9px; font-weight: 700; fill: var(--bad);
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.4; }
  /* 이 항적의 작업 — 남의 줄 속에서 내 것이 어디인지 */
  .cyl-qd.mine { fill: #fff; stroke: var(--accent); stroke-width: 1.4; }
  .cyl.mine-service .cyl-edge { stroke: #fff; stroke-width: 2.2; }
  .cyl-mine { font-size: 9px; font-weight: 700; fill: #fff;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.6; pointer-events: none; }
  .nodeg.idle { opacity: .28; }
  .nodeg { cursor: pointer; }
  .nodeg.focus .ncirc { stroke: #fff; stroke-width: 2.2; }
  /* 「가야 했으나 닿지 못한」 노드·계선 — 실패 증거(failure.evidence·unreached·commanders)의
     관측 표시. 실패 시각 전에는 옅게(아직 벌어지지 않은 일), 지나면 또렷하게. */
  .nodeg.ghost { opacity: .28; }
  .nodeg.ghost.on { opacity: .92; }
  .nodeg.ghost .ncirc { fill: none; stroke: var(--bad); stroke-dasharray: 3 3; }
  .nodeg.ghost .nlabel { fill: var(--bad); }
  .gedge { opacity: .22; }
  .gedge.on { opacity: .85; }
  .gedge path { fill: none; stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 6 4; }
  .gedge .gx { stroke: var(--bad); stroke-width: 2; }
  /* 센서 점등 — 이 항적을 잡고 있는 센서의 테두리 불. 탐지(하늘) → 추적(파랑) → 사통(초록). */
  .nodeg.s-det .ncirc { stroke: #22d3ee; stroke-width: 2.6; filter: drop-shadow(0 0 3px #22d3ee); }
  .nodeg.s-trk .ncirc { stroke: #4da3ff; stroke-width: 3; filter: drop-shadow(0 0 4px #4da3ff); }
  .nodeg.s-fc  .ncirc { stroke: var(--ok); stroke-width: 3; filter: drop-shadow(0 0 5px #34d399); }
  .nodeg.s-det .qbadge { fill: #22d3ee; }
  .nodeg.s-trk .qbadge { fill: #4da3ff; }
  .nodeg.s-fc  .qbadge { fill: var(--ok); }
  .qtail { font-size: 9px; fill: var(--warn); paint-order: stroke; stroke: #0b1017; stroke-width: 2; }
  .flash { fill: none; stroke: var(--bad); stroke-width: 2; opacity: .9; pointer-events: none; }
  /* 「못 가는」 전문 — 움직이는 점(채운 원)과 반드시 달라 보여야 한다: 점선 테두리 빈 원 */
  .wait-dot { fill: rgba(251,191,36,.12); stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 3 2; }
  .wait-dot.forever { stroke: var(--bad); fill: rgba(248,113,113,.14); }
  .blocklab { font-size: 9.5px; fill: var(--warn); font-weight: 700;
    paint-order: stroke; stroke: #0b1017; stroke-width: 2.6; }
  .drop-x line { stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
  /* 종결 배너 — 격추/누수를 그래프 위에 못박는다 */
  .endbanner { pointer-events: none; }
  .endbanner rect { fill: rgba(11,16,23,.9); stroke-width: 1.5; }
  .endbanner text { font-size: 12px; font-weight: 700; }
  .endbanner .sub { font-size: 10px; font-weight: 400; }
  .endbanner.leak rect { stroke: var(--bad); }
  .endbanner.leak text { fill: var(--bad); }
  .endbanner.leak .sub { fill: #c9899a; }
  .endbanner.kill rect { stroke: #1c6448; }
  .endbanner.kill text { fill: var(--ok); }
  .edge.hot { opacity: .95 !important; }
  svg.hide-sensor .sensor-edge { display: none; }
  .dot[data-th] { cursor: pointer; }

  /* 부하 순위 */
  .rk { display: flex; align-items: center; gap: 7px; padding: 3px 10px; cursor: pointer;
    border-left: 3px solid transparent; font-size: 12px; }
  .rk:hover { background: #16202e; }
  .rk.focus { background: #17293f; border-left-color: var(--accent); }
  .rk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .bar { flex: none; width: 64px; height: 7px; background: #1a2534; border-radius: 3px; overflow: hidden; }
  .rk .bar i { display: block; height: 100%; background: var(--accent); }
  .rk.full .bar i { background: var(--warn); }
  .rk.jam .bar i { background: var(--bad); }
  .rk .st { flex: none; width: 86px; text-align: right; color: var(--dim); font-size: 11px; }
  .rk .st b { color: var(--fg); font-weight: 600; }
  .rk .st .dr { color: var(--bad); }

  /* 병목 로그 색 — 넘침·기한 만료(둘 다 실제 드롭)는 붉게, 큐 정리(항적 종결)는 흐리게 */
  .ev.overflow .x { color: var(--bad); }
  .ev.ttl .x { color: #f0a060; }
  .ev.dead .x { color: var(--dim); }
  .ev.sat .x { color: var(--warn); }
  .ev.chdrop .x { color: var(--bad); font-weight: 600; }
  .ev.leak .x { color: var(--bad); font-weight: 700; }
  .ev.leak .t { color: var(--bad); }
  .ev.dup .x { color: #f0a060; font-weight: 600; }
  .ev.chwait .x { color: var(--warn); }
  .ev.block .x { color: var(--warn); }
  /* 항적이 걸린 줄은 눌러서 그 항적의 개별 보기로 내려간다. 화살표는 **별도 칸**으로 둔다 —
     .x 안에 넣으면 말줄임(ellipsis)에 잘려 「누를 수 있다」가 긴 줄에서만 사라진다. */
  .ev.hit { cursor: pointer; }
  .ev.hit:hover { background: #17293f; }
  .ev .go { flex: none; font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ev.hit:hover .go { color: var(--accent); }
  /* 여러 항적이 묶인 줄을 펼친 목록 — 시각 칸(52px+간격) 밑으로 들여 쓴다 */
  .evsub { padding: 1px 10px 5px 62px; }
  .evtrk { display: flex; gap: 6px; align-items: baseline; padding: 2px 7px; cursor: pointer;
    border-left: 2px solid var(--line); }
  .evtrk:hover { background: #17293f; border-left-color: var(--accent); }
  .evtrk .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #ticks i.bad { background: var(--bad); height: 9px; }

  /* 하단 재생 바 */
  #transport { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
  /* 스크럽 막대 위에 사건 눈금을 겹쳐 둔다 — 눈금이 없는 넓은 구간이 곧 「아무 일도
     일어나지 않는 시간」이고, 그것을 안 보이게 두면 재생이 멈춘 것으로 오해된다. */
  #scrub-wrap { flex: 1; min-width: 180px; position: relative; display: block; }
  #ticks { position: absolute; left: 0; right: 0; top: 2px; height: 7px; pointer-events: none; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 7px; background: #64809f; }
  #scrub { width: 100%; accent-color: var(--accent); margin-top: 6px; }
  #clock { font-size: 12px; color: var(--fg); min-width: 118px; }
  .spd button { padding: 3px 7px; font-size: 11px; }
  /* 접이식 범례 — 접힌 줄만 상시 보이고, 펼치면 전체가 나온다 */
  #legend-box { flex: none; background: var(--panel2); border-top: 1px solid var(--line);
    max-height: 46%; overflow-y: auto; }
  #legend-box > summary { list-style: none; cursor: pointer; user-select: none;
    padding: 5px 12px; font-size: 11px; color: var(--dim); }
  #legend-box > summary::-webkit-details-marker { display: none; }
  #legend-box > summary::before { content: '▸ '; color: var(--accent); }
  #legend-box[open] > summary::before { content: '▾ '; }
  #legend-box > summary:hover { color: var(--fg); background: #16202e; }
  #legend { display: flex; gap: 4px 10px; flex-wrap: wrap; padding: 2px 12px 8px;
    font-size: 11px; color: var(--dim); }
  #legend b { color: var(--fg); font-weight: 600; }
  .lg { display: inline-flex; align-items: center; gap: 5px; }
  .lg i { width: 20px; height: 0; border-top-width: 3px; border-top-style: solid; display: inline-block; }

  .empty { padding: 24px 14px; color: var(--dim); text-align: center; line-height: 1.7; font-size: 12px; }
  .note { padding: 6px 10px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }
  code { background: #16202e; padding: 0 3px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>🛰 지휘 흐름</h1>
  <label>시나리오 <select id="sc"></select></label>
  <span id="dep-fixed" title="이 화면은 배치를 고정한다 — 본 앱·기준선과 같은 legacy 정상 배치">배치 <b></b></span>
  <span class="modesw">
    <button id="m-asis" class="on">As-Is 분절형</button><button id="m-tobe">To-Be 통합형</button>
  </span>
  <label>seed <input id="seed" class="mono" type="number" value="12345" style="width:78px"></label>
  <label>관측 <input id="dur" class="mono" type="number" value="600" step="60" style="width:64px">초</label>
  <button id="run">▶ 실행</button>
  <span class="modesw" id="viewsw">
    <button id="v-all" class="on" title="전 항적을 겹쳐 노드 케파·병목을 본다">전체 흐름</button><button id="v-track" title="항적 하나의 전문 이동을 따라간다">항적 개별</button>
  </span>
  <button id="side-toggle" title="왼쪽 패널을 접고 그래프를 넓게 쓴다">‹ 패널 접기</button>
  <span id="dirty" hidden>⟳ 조건이 바뀌었습니다 — [실행]</span>
  <span id="status">실행을 눌러 시작합니다.</span>
</header>

<!--
  실험 조건 손잡이는 화면에서 걷어냈다(사용자 결정). 전부 **URL 파라미터**로만 준다.
  ⚠️ 손잡이가 안 보이면 「이 수치가 어떤 조건에서 나왔는가」를 화면만 보고 알 수 없다.
     그래서 **기본값이 아닌 조건은 상태줄에 반드시 표기**한다(activeConfigChips) — 숨기는 것은
     조작 수단이지 조건 자체가 아니다. 파라미터 목록은 로드 시 콘솔에도 찍는다.
-->

<!-- 계선 매체 교체 팝오버 -->
<div id="pop" hidden>
  <div id="pop-title"></div>
  <div id="pop-body"></div>
  <div id="pop-warn">⚠️ 반사실입니다. 매체를 바꾸면 난수 소비가 달라져 <b>실행 전체가 다른 표본</b>이 됩니다 —
    기준 실행과 나란히 놓고 “차이 = 이 계선의 몫”으로 읽으면 안 됩니다.</div>
  <div style="display:flex;gap:6px;justify-content:flex-end">
    <button id="ovr-clear" hidden>전부 되돌리기</button><button id="pop-close">닫기</button>
  </div>
</div>

<main>
  <aside id="side">
    <section class="sec" id="tracks">
      <h2><span id="tracks-label">항적 (이벤트)</span><span id="track-count"></span></h2>
      <div class="scroll" id="track-list"><div class="empty">아직 실행하지 않았습니다.</div></div>
    </section>
    <section class="sec" id="log">
      <h2><span id="log-title">이벤트 로그</span><span class="minisw" id="log-mode" hidden><button id="lm-c2" title="C2 노드 하나를 골라 그 노드의 처리 로그(도착·대기·처리·드롭)를 읽는다 — 전체 화면은 그대로 둔다">C2 처리</button><button id="lm-bot" title="넘침·큐 이탈·포화 등 병목 사건만 모아 본다">병목</button></span><span id="log-hint"></span></h2>
      <div id="log-trk-bar" hidden>
        <select id="log-trk-sel" title="처리 로그를 볼 C2 노드"></select>
      </div>
      <div class="scroll" id="log-body"></div>
    </section>
  </aside>

  <section id="stage">
    <!-- 신호등 — 「지금 이 항적이 어디서 무엇을 기다리는가」를 추론하게 두지 않고 직접 적는다. -->
    <div id="graph-wrap"><div id="signal" hidden></div><svg id="graph"></svg></div>

// ── ADR-049 — 천마·비호 중대(6대) 노드 재편 + 차량 개별 관리 ───────────────────────
// 6대=1노드(중대) 가정: 비호 167대→28노드(6×27+5), 천마 100대→17노드(6×16+4). 총 대수(167/100) 보존.
// 각 노드는 차량 수만큼 발사대(batteryConfig.launchers.AAM=차량수)를 가지며, 차량별 탄약(비호4/천마8)·
// 재장전(ADR-048)·동시교전(가용차량×차량당동시교전, ADR-049)이 개별 관리된다.
//
// 배치 (ADR-049 배치 결함 수정, 2026-07-06 사용자 브라우저 검수):
//   구 구현은 옛 12개 포대 앵커(분계선보다 10~25km 남쪽) 직선 보간이라 (1) 한강하구 중립수역
//   구간(126.49~126.70E)에서 강화-파주 직선 위도(37.77~37.79)가 중립수역/북측 개풍 연안에 찍히고,
//   (2) 전체가 실제 분계선 곡선이 아니며, (3) 동단 128.40E/38.22N 이 실제 동부 접경(고성 명파리
//   38.61N)을 못 덮었다. 수정:
//   - 고정밀 MDL 궤적 단일 권위 = geo-mdl.js (잎 모듈, import 순환 없음). scenarios.js 의
//     MDL_POLYLINE(위협 원점용, 사용자 시각 검증 완료)은 별개 권위 — 건드리지 않는다.
//   - 본 벨트 = 경도 126.75(문산/파주 서측)→128.36(고성) 구간에서 MDL 궤적의 **호길이 등간격**
//     표본을 뜨고 분계선 남쪽 수직 오프셋 9km(비호/천마 교차 ±0.004° lat 유지).
//   - 한강하구 구간(경도 < 126.75)은 보간 금지 — 남안 육지 수동 앵커 2개(강화 본섬/김포반도)에
//     서쪽 끝 노드들을 배정(중립수역 대안 감시 취지: 수역 건너 감시·대응 자산을 남안 육지에 둔다).
const SHORAD_BELT_LON_WEST = 126.75;   // 문산/파주 서측 (본 벨트 서단)
const SHORAD_BELT_LON_EAST = 128.36;   // 고성 명파리 (본 벨트 동단)
// 9km (2026-07-06 검수 2차: 궤적 근사 오차 ±3~5km 를 흡수할 안전 여유 — 6km 로는 동부에서
// DMZ 띠 침범이 재발했다. 가드 테스트 최소 남측 이격 4km 와 함께 이중 방어.)
const SHORAD_BELT_SOUTH_OFFSET_KM = 9; // 분계선 남쪽 수직 오프셋
const SHORAD_COMPANY_VEHICLES = 6;     // 6대 = 1중대 = 1노드
const SHORAD_TOTAL_VEHICLES = Object.freeze({ BIHO: 167, CHUNMA: 100 });

// 한강하구 중립수역 남안 육지 수동 앵커 (서→동). 보간 금지 구간(lon < 126.75)의 서쪽 끝 노드 배정처.
const SHORAD_ESTUARY_ANCHORS = Object.freeze([
  Object.freeze({ lon: 126.45, lat: 37.71, label: '강화 본섬 남안' }),
  Object.freeze({ lon: 126.62, lat: 37.66, label: '김포반도' }),
]);

// 총 대수를 6대 단위로 분할(마지막 노드는 잔여). 예: 167→[6×27,5], 100→[6×16,4].
function partitionCompanyVehicles(total, perNode = SHORAD_COMPANY_VEHICLES) {
  const nodes = [];
  let remaining = total;
  while (remaining > 0) {
    nodes.push(Math.min(perNode, remaining));
    remaining -= perNode;
  }
  return nodes;
}

// 유형별 노드 배치: 서쪽 끝 2개 = 한강하구 남안 수동 앵커, 나머지 = 본 벨트 MDL 호길이 등간격
// (분계선 남쪽 9km). latOffset 으로 비호/천마 교차(±0.004°).
function makeShoradCompanySites(shooterTypeId, latOffset, koreanName) {
  const vehiclesPerNode = partitionCompanyVehicles(SHORAD_TOTAL_VEHICLES[shooterTypeId]);
  const estuaryCount = SHORAD_ESTUARY_ANCHORS.length;
  const beltCount = vehiclesPerNode.length - estuaryCount;
  const beltPoints = sampleMdlDefensePoints(SHORAD_BELT_LON_WEST, SHORAD_BELT_LON_EAST, beltCount);
  return vehiclesPerNode.map((vehicles, idx) => {
    let lon;
    let lat;
    let estuary = false;
    if (idx < estuaryCount) {
      const anchor = SHORAD_ESTUARY_ANCHORS[idx];
      lon = Number(anchor.lon.toFixed(4));
      lat = Number((anchor.lat + latOffset).toFixed(4));
      estuary = true;
    } else {
      const p = beltPoints[idx - estuaryCount];
      lon = Number(p.lon.toFixed(4));
      lat = Number((p.lat - SHORAD_BELT_SOUTH_OFFSET_KM / KM_PER_DEG_LAT + latOffset).toFixed(4));
    }
    return { shooterTypeId, posKey: `${shooterTypeId}_CO${idx + 1}`, lon, lat, vehicles, koreanName, estuary };
  });
}

//   서/중/동 전방 ICC(ARMY_WEST/CENTRAL/EAST_FRONT_AD)에 균일 배정.
const SHORAD_ICC_BAND_SIZE = Math.ceil(SHORAD_COMPANY_SITES_RAW.length / 3);
const SHORAD_LOCAL_AD_BY_POSKEY = (() => {
  const sorted = [...SHORAD_COMPANY_SITES_RAW].sort(
    (a, b) => a.lon - b.lon || (a.posKey < b.posKey ? -1 : 1),
  );
  const map = new Map();
  sorted.forEach((site, rank) => {
    const iccPosKey = rank < SHORAD_ICC_BAND_SIZE ? 'ARMY_WEST_FRONT_AD'
      : rank < 2 * SHORAD_ICC_BAND_SIZE ? 'ARMY_CENTRAL_FRONT_AD'
      : 'ARMY_EAST_FRONT_AD';
    map.set(site.posKey, iccPosKey);
  });
  return map;
})();

// ── 좌표 ──
// 전부 legacy nodes.js의 개념좌표를 lon/lat로 옮긴 값이다(legacy는 [lat, lon] 순서).
// 고도는 권역 개념 추정치이며, 실제 표고가 아니다.

// ════════════════════════════════════════════════════════════════
// DEPLOYMENTS — 레지스트리 (index.html 토글)

// ADR-055 이후: HANBANDO_FULL 3종 + HANBANDO_LEGACY 3종 = 6종.


  var positionMemo = new WeakMap();
  var batteryMemo = new WeakMap();
  var sensorMemo = new WeakMap();

  function freezeAll(o) {
    if (!o || typeof o !== 'object' || Object.isFrozen(o)) return o;
    Object.keys(o).forEach(function (k) { freezeAll(o[k]); });
    return Object.freeze(o);
  }

  function normalizePositions(raw, batteries) {
    if (positionMemo.has(raw)) return positionMemo.get(raw);
    var out = {};
    Object.keys(raw).forEach(function (key) {
      var p = raw[key];
      var confidence = p.confidence || 'estimated';
      out[key] = Object.freeze(Object.assign({}, p, {
        confidence: confidence,
        sourceNote: p.sourceNote || 'IADS_codex_original 대표 개념좌표; 공개근거 미상은 estimated',
        coordNote: p.coordNote || (confidence === 'public'
          ? '공개자료 기반 도시·권역 수준 개념좌표'
          : '연구용 추정·도시·권역 수준 개념좌표')
      }));
    });
    // 포대의 ECS는 이미 posKey를 공유한다. 포대 전속 MFR/Patriot radar도 같은
    // 공동 사이트의 위·경도를 사용하고, 안테나 고도와 출처 메타만 유지한다.
    (batteries || []).forEach(function (b) {
      if (!b.mfrSensorPosKey || !out[b.posKey] || !out[b.mfrSensorPosKey]) return;
      var batteryPos = out[b.posKey], sensorPos = out[b.mfrSensorPosKey];
      out[b.mfrSensorPosKey] = Object.freeze(Object.assign({}, sensorPos, {
        lon: batteryPos.lon,
        lat: batteryPos.lat,
        coLocatedWith: b.posKey,
        coordNote: '포대·ECS·MFR/레이더 공동 개념 사이트(동일 위·경도)'
      }));
    });
    out = Object.freeze(out);
    positionMemo.set(raw, out);
    return out;
  }

  function roundsTotal(totalRounds) {
    return Object.keys(totalRounds || {}).reduce(function (sum, key) {
      return sum + (Number(totalRounds[key]) || 0);
    }, 0);
  }

  function normalizeBatteries(raw, positions) {
    if (batteryMemo.has(raw)) return batteryMemo.get(raw);
    var out = raw.map(function (b) {
      var type = KJ.SHOOTER_TYPES[b.shooterTypeId] || {};
      var q = b.quantity || 1;
      var bc = b.batteryConfig || {};
      var launcherCount = bc.launchers
        ? Object.keys(bc.launchers).reduce(function (sum, k) { return sum + bc.launchers[k]; }, 0)
        : ((type.battery && type.battery.launcherCount) || 1);
      var firstMissile = type.missiles && type.missiles[Object.keys(type.missiles)[0]];
      var roundsPerLauncher = bc.roundsPerLauncher || (firstMissile && firstMissile.roundsPerLauncher) || null;
      return freezeAll(Object.assign({}, b, {
        id: 'BATTERY_' + b.posKey,
        quantity: q,
        confidence: b.confidence || (positions[b.posKey] && positions[b.posKey].confidence) || 'estimated',
        sourceNote: b.sourceNote || (positions[b.posKey] && positions[b.posKey].sourceNote) ||
          'IADS_codex_original deployment declaration',
        launcherConfig: {
          launcherCount: b.shooterTypeId === 'BIHO' || b.shooterTypeId === 'CHUNMA' ? q : launcherCount,
          roundsPerLauncher: roundsPerLauncher,
          perVehicleConcurrency: bc.perVehicleConcurrency || null,
          aggregateRounds: roundsTotal(b.totalRounds)
        },
        reloadConfig: {
          scope: 'per-launcher',
          durationSec: bc.reloadDurationSec || (type.battery && type.battery.reloadTime) || 900
        }
      }));
    });
    out = Object.freeze(out);
    batteryMemo.set(raw, out);
    return out;
  }

  function normalizeSensors(raw, positions) {
    if (sensorMemo.has(raw)) return sensorMemo.get(raw);
    var out = raw.map(function (sensorDecl) {
      return freezeAll(Object.assign({}, sensorDecl, {
        id: 'SENSOR_' + sensorDecl.posKey,
        confidence: sensorDecl.confidence || (positions[sensorDecl.posKey] && positions[sensorDecl.posKey].confidence) || 'estimated',
        sourceNote: sensorDecl.sourceNote || (positions[sensorDecl.posKey] && positions[sensorDecl.posKey].sourceNote) ||
          'IADS_codex_original sensor deployment declaration'
      }));
    });
    out = Object.freeze(out);
    sensorMemo.set(raw, out);
    return out;
  }

  function normalizeC2(raw, batteries, positions) {
    var batteryByPos = {};
    batteries.forEach(function (b) { batteryByPos[b.posKey] = b; });
    return Object.freeze(raw.map(function (node) {
      var battery = node.typeId === 'ECS' ? batteryByPos[node.posKey] : null;
      var id = node.typeId === 'ECS'
        ? 'ECS_' + node.posKey
        : 'C2_' + node.typeId + '_' + node.posKey;
      return freezeAll(Object.assign({}, node, {
        id: id,
        batteryId: battery ? battery.id : null,
        forceOwner: node.forceOwner || (battery && battery.forceOwner) || 'ROK',
        c2Axis: node.c2Axis || (battery && battery.c2Axis) || null,
        confidence: node.confidence || (positions[node.posKey] && positions[node.posKey].confidence) || 'estimated',
        sourceNote: node.sourceNote || (positions[node.posKey] && positions[node.posKey].sourceNote) ||
          'IADS_codex_original C2 deployment declaration'
      }));
    }));
  }

  function normalizeDeployment(raw) {
    var positions = normalizePositions(raw.positions, raw.batteries);
    var batteries = normalizeBatteries(raw.batteries, positions);
    var sensors = normalizeSensors(raw.sensors, positions);
    return freezeAll({
      id: raw.id,
      name: raw.name,
      description: raw.description + ' 정책연구용 개념 배치이며 실제 작전배치가 아니다.',
      positions: positions,
      batteries: batteries,
      sensors: sensors,
      c2Nodes: normalizeC2(raw.c2Nodes, batteries, positions)
    });
  }

  const DEPLOYMENT_HANBANDO_FULL_NORMAL = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_FULL_NORMAL);
  const DEPLOYMENT_HANBANDO_FULL_MCRC_DOWN = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_FULL_MCRC_DOWN);
  const DEPLOYMENT_HANBANDO_FULL_KAMDOC_DOWN = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_FULL_KAMDOC_DOWN);
  const DEPLOYMENT_HANBANDO_LEGACY_NORMAL = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_LEGACY_NORMAL);
  const DEPLOYMENT_HANBANDO_LEGACY_MCRC_DOWN = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_LEGACY_MCRC_DOWN);
  const DEPLOYMENT_HANBANDO_LEGACY_KAMDOC_DOWN = normalizeDeployment(RAW_DEPLOYMENT_HANBANDO_LEGACY_KAMDOC_DOWN);

  KJ.DEPLOYMENTS = Object.freeze({
    HANBANDO_FULL_NORMAL: DEPLOYMENT_HANBANDO_FULL_NORMAL,
    HANBANDO_FULL_MCRC_DOWN: DEPLOYMENT_HANBANDO_FULL_MCRC_DOWN,
    HANBANDO_FULL_KAMDOC_DOWN: DEPLOYMENT_HANBANDO_FULL_KAMDOC_DOWN,
    HANBANDO_LEGACY_NORMAL: DEPLOYMENT_HANBANDO_LEGACY_NORMAL,
    HANBANDO_LEGACY_MCRC_DOWN: DEPLOYMENT_HANBANDO_LEGACY_MCRC_DOWN,
    HANBANDO_LEGACY_KAMDOC_DOWN: DEPLOYMENT_HANBANDO_LEGACY_KAMDOC_DOWN
  });
  KJ.deploymentById = function (id) { return KJ.DEPLOYMENTS[id] || null; };
  KJ.DEPLOYMENT_IDS = Object.freeze(Object.keys(KJ.DEPLOYMENTS));

})();

 *   승인 경로에 부하를 부과할 뿐이며, 실제 병목 여부는 시나리오 부하 분석으로 도출됨).

 *   승인 단계가 통째로 사라지는데 실행은 성공하므로 눈치채기 어렵다 — 역할 이름을 새로 쓸
 *   때는 roles에 먼저 등록할 것(approval-authority.test.mjs가 이 대응을 잠근다).
 *   ADR-077: To-Be의 ABT 승인권자를 MCRC → IAOC(합동방공C2 조율층)로 옮겼다. To-Be
 *   구조의 요체가 기존 C2 체계 위에 얹힌 조율층인데, 승인만 옛 계선(MCRC)으로 붙어

  // To-Be(킬웹) 측 — codex LINK_DELAYS.ifcn 1초: "Kill Web 모든 링크 (ADR-014: 킬웹 보고주기
  // 전부 1s)". 킬웹에서는 IFCN 네트워크가 융합 항적을 1초 주기로 밀어내므로 센서 자체 주기가
  // 아니라 네트워크 주기가 정보 나이를 지배한다는 것이 codex 정본의 판정이다.
  var IFCN = Object.freeze({ type: 'ifcn', delaySec: 1, paramRef: 'IADS-LINK-IFCN-01' });

  function buildDeploymentCatalog(id, opts) {
    var v2 = !!(opts && opts.linkSemanticsV2);
    var appr = !!(opts && opts.approvalChain);
    var southern = !!(opts && opts.southernAxes); // ADR-064
    var parity = !!(opts && opts.sensorReportParity); // ADR-067
    var opLevel = (opts && opts.c2OperatorLevel) || null; // 'high'|'low' (null=mid, 종전 동일)
    var kvmf = !!(opts && opts.kvmfLateral); // ADR-081
    // 연합 항적 공유 반사실(ADR-085). false(기본)면 계선을 한 가닥도 만들지 않는다 —
    // 캐시 키에 들어가므로 OFF 카탈로그는 종전과 물리적으로 같은 객체다.
    var usfkShare = (opts && opts.usfkTrackSharing) || null;
    var cacheKey = id + (v2 ? '|linkV2' : '') + (appr ? '|appr' : '') +
      (southern ? '|south' : '') + (parity ? '|rp' : '') + (opLevel ? '|op:' + opLevel : '') +
      (kvmf ? '|kvmf' : '') + (usfkShare ? '|usfkshare:' + usfkShare : '');
    if (cache[cacheKey]) return cache[cacheKey];
    var deployment = KJ.deploymentById(id);
    if (!deployment) throw new Error('Unknown high-resolution deployment: ' + id);

    var nodes = [], links = [], nodeMap = {};
    var c2ByType = {}, c2ByPos = {}, ecsByBattery = {};
    var positions = deployment.positions;

    deployment.c2Nodes.forEach(function (decl) {
      var type = KJ.C2_TYPES[decl.typeId];
      if (!type) throw new Error(id + ': unknown C2 type ' + decl.typeId);
      var pos = positions[decl.posKey];
      var svc = c2Service(type, opLevel);
      var node = {
        id: decl.id, instanceId: decl.id, typeId: decl.typeId,
        name: decl.instanceLabel || type.name,
        category: 'c2', service: decl.forceOwner === 'USFK' ? 'usfk' : 'joint',
        echelon: type.tier, coord: [pos.lat, pos.lon], position: { lon: pos.lon, lat: pos.lat, alt: pos.alt || 0 }, coordNote: pos.coordNote,
        role: type.commandScope + ' · 위협종류/생존상태 책임 C2' +
          (decl.typeId === 'ARMY_LOCAL_AD' ? ' · MCRC+국지레이더 항적융합·자체 자동할당' : ''),
        queue: {
          servers: type.simultaneousCapacity,
          serviceTimeSec: { asis: svc, tobe: svc },
          // ADR-092: 성분 분리(체계 구간 + 운용자 평균). 중점+평균 = serviceTimeSec 와 항등.
          serviceParts: c2ServiceParts(type, opLevel),
          capacity: c2Capacity(type), paramRef: type.paramRef
        },
        c2Axis: decl.c2Axis || null, forceOwner: decl.forceOwner || 'ROK',
        architectureRole: decl.typeId === 'ARMY_LOCAL_AD' ? 'CORPS_AOC_C2A' : null,
        batteryId: decl.batteryId || null,
        // ADR-078: 조율층은 IAOC 하나다. 종전에는 EOC(교전운영센터)를 나란히 뒀는데 실행에서
        // 도착 0건의 유령 노드였다 — 선언·연결·표시만 되고 아무 일도 하지 않았다. 교전 운영
        // (표적할당·우선순위·발사·격추·잔량 통합)은 IAOC의 기능으로 흡수하고 노드를 지웠다.
        modes: decl.typeId === 'IAOC' ? ['tobe'] : undefined,
        confidence: decl.confidence, sourceNote: decl.sourceNote
      };
      nodes.push(node); nodeMap[node.id] = node;
      (c2ByType[decl.typeId] = c2ByType[decl.typeId] || []).push(node);
      c2ByPos[decl.posKey] = node;
      if (decl.batteryId) ecsByBattery[decl.batteryId] = node;
    });

    deployment.sensors.forEach(function (decl) {
      var type = KJ.SENSOR_TYPES[decl.typeId];
      if (!type) throw new Error(id + ': unknown sensor type ' + decl.typeId);
      var pos = positions[decl.posKey];
      var rangeKm = maxRange((type.compatibilityRanges || type.ranges).detect);
      var node = {
        id: decl.id, instanceId: decl.id, typeId: decl.typeId,
        name: type.name + ' (' + decl.posKey + ')', category: 'sensor',
        service: decl.forceOwner === 'USFK' ? 'usfk' : 'joint', echelon: 'sensor',
        coord: [pos.lat, pos.lon], position: { lon: pos.lon, lat: pos.lat, alt: pos.alt || 0 }, coordNote: pos.coordNote,
        role: type.role + ' · 개념 기하 탐지·화력통제 상태',
        detects: type.detectableThreats.slice(), coverage: axesFor(pos, rangeKm, southern),
        detectProb: { value: type.detectionProbability, paramRef: type.paramRef },
        rangeKm: rangeKm, rangeNote: '원본 개념 사거리의 정적 축선 호환 투영',
        c2Axis: decl.c2Axis || null, forceOwner: decl.forceOwner || 'ROK',
        localAdPosKey: decl.localAdPosKey || null,
        confidence: decl.confidence, sourceNote: decl.sourceNote
      };
      nodes.push(node); nodeMap[node.id] = node;
    });

    deployment.batteries.forEach(function (decl) {
      var type = KJ.SHOOTER_TYPES[decl.shooterTypeId];
      if (!type) throw new Error(id + ': unknown shooter type ' + decl.shooterTypeId);
      var pos = positions[decl.posKey];
      var missileRanges = Object.keys(type.missiles).map(function (k) {
        return type.missiles[k].engagementEnvelope.Rmax;
      });
      var rangeKm = Math.max.apply(null, missileRanges);
      // The native IADS resolver partitions ROK, local-AD and USFK axes before
      // WTA.  USFK assets therefore remain independent without being disabled.
      var eligible = true;
      var controller = ecsByBattery[decl.id];
      var icc = decl.iccPosKey ? c2ByPos[decl.iccPosKey] : null;
      var localAd = decl.localAdPosKey ? c2ByPos[decl.localAdPosKey] : null;
      var node = {
        id: decl.id, instanceId: decl.id, typeId: decl.shooterTypeId,
        name: type.name + ' (' + decl.posKey + ')', category: 'shooter',
        service: decl.forceOwner === 'USFK' ? 'usfk' : (decl.forceOwner === 'ROK_LOCAL_AD' ? 'army' : 'af'),
        echelon: 'battery', coord: [pos.lat, pos.lon], position: { lon: pos.lon, lat: pos.lat, alt: pos.alt || 0 }, coordNote: pos.coordNote,
        role: '원본 책임 C2·PIP·발사대 자원 모델 실행',
        coverage: axesFor(pos, rangeKm, southern),
        controlledBy: { asis: controller ? [controller.id] : [], tobe: controller ? [controller.id] : [] },
        canEngage: boolMap(type.engageableThreats, eligible),
        wtaSuit: type.compatibility.wtaSuit,
        engage: {
          rangeKm: rangeKm,
          channels: decl.maxSimultaneous,
          engageTimeSec: type.compatibility.engageTimeSec,
          pk: { default: { kind: 'triangular', min: type.compatibility.pk, mode: type.compatibility.pk, max: type.compatibility.pk }, paramRef: type.paramRef },
          costPerShotM: type.compatibility.costPerShotM,
          costRef: type.paramRef,
          magazine: Object.keys(decl.totalRounds || {}).reduce(function (sum, k) { return sum + decl.totalRounds[k]; }, 0),
          missiles: type.missiles,
          doctrine: 'shoot-look-shoot'
        },
        quantity: decl.quantity, launcherConfig: decl.launcherConfig, reloadConfig: decl.reloadConfig,
        c2Axis: decl.c2Axis || null, forceOwner: decl.forceOwner || 'ROK',
        ecsC2Id: controller ? controller.id : null,
        iccC2Id: icc ? icc.id : null,
        localAdC2Id: localAd ? localAd.id : null,
        mfrSensorId: decl.mfrSensorPosKey ? 'SENSOR_' + decl.mfrSensorPosKey : null,
        totalRounds: decl.totalRounds || {},
        shooterPriority: type.priority,
        confidence: decl.confidence, sourceNote: decl.sourceNote
      };
      nodes.push(node); nodeMap[node.id] = node;
    });

    var kamdoc = (c2ByType.KAMD_OPS || [])[0] || null;
    var mcrc = (c2ByType.MCRC || [])[0] || null;
    var iaoc = (c2ByType.IAOC || [])[0] || null;
    var iccs = c2ByType.ICC || [];
    var localAds = c2ByType.ARMY_LOCAL_AD || [];

    function sensorNodes(typeIds) {
      return nodes.filter(function (n) { return n.category === 'sensor' && typeIds.indexOf(n.typeId) !== -1; });
    }
    function c2ForPos(key) { return key ? c2ByPos[key] || null : null; }

    /**
     * ADR-067 — 센서 발신 `report` 링크의 **To-Be 측** 지연.
     *
     * 보고 주기는 센서 물리이므로 양 모드 공통이어야 한다. 종전에는 To-Be만 IFCN 1초로 덮여
     * 같은 레이더가 To-Be에서 최대 16배 빨리 보고했다. codex `ifcn:1`("킬웹 보고주기 전부 1s")의
     * 논거는 융합 신선도인데, 엔진이 이미 센서별 보고 경로 중 **최속 경로를 고르므로**
     * (sim-engine.js `_iadsReportBundle` — candidates.sort(delay) → candidates[0]) 그 이득은
     * 링크 구조에서 자연 발생한다. 일괄 1초는 이중 계상이며, 단일 센서만 보는 표적에는
     * 융합 논거 자체가 없다. 정본 이탈 사유는 ADR-067·params.md IADS-LINK-IFCN-01에 기록.
     *
     * ⚠️ C2 발신 `report`(MCRC→군단 AOC 항적 중계·킬웹 C2→IAOC)는 C2↔C2이므로 대상이 아니다.
     */
    function sensorReportTobe(typeId) {
      if (!v2) return DL_FAST;
      return parity ? reportCycleComm(typeId) : IFCN;
    }

    if (kamdoc) {
      sensorNodes(['GREEN_PINE_B', 'GREEN_PINE_C']).forEach(function (s) { addLink(links, s.id, kamdoc.id, 'report', v2 ? reportCycleComm(s.typeId) : LONG, sensorReportTobe(s.typeId), 'korean_kamd'); });
      iccs.forEach(function (icc) {
        addLink(links, kamdoc.id, icc.id, 'coord', v2 ? C2_TRANSFER : LONG, v2 ? IFCN : DL_FAST, 'korean_kamd');
        // The legacy decision stage searches from the reporting/controller C2
        // upward to the approval role.  Preserve the same physical ICC link in
        // both directions; without this return edge every MFR→ECS main track
        // terminates as responsibility_gap before the shooter can be tasked.
        addLink(links, icc.id, kamdoc.id, 'coord', v2 ? C2_TRANSFER : LONG, v2 ? IFCN : DL_FAST, 'korean_kamd');
      });
    }
    if (mcrc) {
      sensorNodes(['FPS117']).forEach(function (s) { addLink(links, s.id, mcrc.id, 'report', v2 ? reportCycleComm(s.typeId) : LONG, sensorReportTobe(s.typeId), 'korean_mcrc'); });
      iccs.forEach(function (icc) {
        addLink(links, mcrc.id, icc.id, 'coord', v2 ? C2_TRANSFER : LONG, v2 ? IFCN : DL_FAST, 'korean_mcrc');
        addLink(links, icc.id, mcrc.id, 'coord', v2 ? C2_TRANSFER : LONG, v2 ? IFCN : DL_FAST, 'korean_mcrc');
      });
      // As-Is 군단 AOC는 MCRC 공중항적과 자체 국지레이더 항적을 C2A에서
      // 함께 접수한다. 항적 전파는 16초 개념 데이터링크, 반대 방향의 교전현황은
      // 제한형 음성/VTC 메시지로 분리해 정보의 비대칭을 보존한다.
      //
      // ADR-078: 이 세 링크는 **As-Is 전용**이다(tobe 측 comm = null → linksInMode에서 제외).
      // To-Be의 구조 변화가 바로 "MCRC↔군단 AOC 직결 음성 협조 → IAOC 중심 데이터링크"인데,
      // 종전에는 같은 선의 tobe comm만 2초로 바꿔 두어 **경로는 그대로 두고 속도만** 빨라졌다.
      // 그러면 조율층을 신설한 의미가 거동에 나타나지 않고, [C2 구조] 탭 To-Be 그림에는
      // 옛 직결선과 IAOC 허브가 동시에 그려져 무엇이 달라졌는지 대비되지 않는다.
      // To-Be 대체 경로는 아래 `if (iaoc)` 블록이 깐다(군단 AOC ↔ IAOC).
      localAds.forEach(function (aoc) {
        // ADR-079: 공중항적 중계는 데이터링크가 아니라 **문자(서버 채팅)**다. linkSemanticsV2
        // 여부와 무관하다 — v2는 전선(데이터링크) 지연의 codex 정합이지, 사람이 채팅으로
        // 넘기는 절차에는 적용할 대상이 없다(음성 협조를 v2 대칭화에서 뺀 것과 같은 이유).
        addLink(links, mcrc.id, aoc.id, 'report', CHAT_TRACK, null, 'mcrc_to_corps_aoc_track');
        addLink(links, aoc.id, mcrc.id, 'status', VOICE_STATUS, null, 'corps_aoc_engagement_status');
        // ADR-058(approvalChain): 승인 협조 채널 — 교전현황(status) 채널과 의도적으로 분리.
        // As-Is VOICE(대표 20초·정규 20,σ5 — ADR-080)는 링크(전선) 성능이 아니라 **음성/VTC 협조
        // 절차 지연**(교전의사 선언·책임구역 확인·중복 회피 협상)이다. 따라서 linkSemanticsV2가
        // 켜져도 As-Is 측은 codex 정합(1초) 대상이 아니다 — codex는 육↔공 협조 절차를
        // 모델링하지 않아 참고 정본이 없다(C2-VOICE-COORD-01 비고 참조).
        if (appr) addLink(links, aoc.id, mcrc.id, 'coord', VOICE, null, 'corps_aoc_approval');
        // ADR-080: 방공C2A가 융합한 국지항적의 **상행 전파**도 문자다 — 하행(mcrc_to_corps_
        // aoc_track)과 같은 매체·같은 지연. 종전에는 국지레이더가 MCRC로 직보(4초)해서 이
        // 계선이 필요 없어 보였는데, 그 직보 자체가 실제보다 후한 가정이었다(아래 참조).
        addLink(links, aoc.id, mcrc.id, 'report', CHAT_TRACK, null, 'corps_aoc_track_share');
      });
    }

    // ── ADR-081: 방공C2A ↔ 방공C2A 상급 경유 항적 공유(KVMF 계통) ──
    //
    // 2022-12-26 사건의 공식 지적은 **1군단과 수도방위사령부 간 항적 정보 공유 지연**이었다.
    // 그런데 모델에는 두 방공C2A를 잇는 계선이 **한 가닥도 없었다** — 서로의 국지 그림을
    // 보려면 공군 MCRC를 왕복해야 해서(상행 문자 45초 + 하행 문자 45초 = 90초), 실패
    // 자체는 우연히 재현되지만 그 경로가 **육군 계통을 거치지 않는** 이상한 모양이었다.
    // 육군은 자기 데이터링크(KVMF)를 갖고 있고 방공C2A가 그것을 쓴다.
    //
    // **양 모드에 깐다.** KVMF는 육군 자체 망이라 통합 지휘소가 생겨도 사라질 이유가 없다.
    // 다만 To-Be에서는 두 방공C2A가 조율층을 1초씩 두 번 거쳐(2초) 이미 묶여 있어
    // 30초 계선은 최단경로 경쟁에서 **항상 진다** — 그래서 To-Be 동역학은 불변일 것으로
    // 예측하고, 그 예측을 재기준선 서명으로 검증한다(To-Be bit-exact = 채택 조건).
    //
    // kind는 `report`다 — 이 계선이 나르는 것은 항적이지 지휘가 아니다. `_iadsReportBundle`이
    // 보고 경로 탐색(['report','coord'])에서 이 간선을 쓰게 되어, 각 방공C2A가 상대 권역의
    // 국지레이더 그림을 90초가 아니라 30초에 받는다.
    if (kvmf) {
      localAds.forEach(function (from) {
        localAds.forEach(function (to) {
          if (from.id === to.id) return;
          addLink(links, from.id, to.id, 'report', KVMF_LATERAL, KVMF_LATERAL, 'corps_aoc_kvmf_lateral');
        });
      });
    }
    // ADR-080: 국지방공레이더(TPS880K)는 육군 자산이다. As-Is에서 공군 MCRC로의 직접
    // 데이터링크 보고(종전 4초)는 공개근거가 없고, 2022-12 무인기 사건의 공식 교훈
    // (1군단 레이더가 최초 포착했으나 전파 지연 — 육군이 본 것을 공군이 제때 못 봄)과
    // 정면으로 어긋난다. 그 직보가 있으면 이 실패 모드가 모델에서 구조적으로 불가능해져
    // As-Is에 유리한 숨은 가정이 된다. As-Is 국지항적은 관할 방공C2A로만 자동 보고되고,
    // MCRC는 위의 문자 전파(corps_aoc_track_share, 45초)로 늦게 본다.
    // To-Be 측은 통합망 배포이므로 종전 직결을 유지한다 — 이 변경의 서명은
    // 「As-Is만 이동·To-Be bit-exact」다(ADR-079와 같은 방향의 하드 체크).
    function nearestLocalAd(s) {
      var best = null, bd = Infinity;
      localAds.forEach(function (a) {
        var dLat = a.coord[0] - s.coord[0];
        var dLon = (a.coord[1] - s.coord[1]) * Math.cos(s.coord[0] * Math.PI / 180);
        var d = dLat * dLat + dLon * dLon;
        if (d < bd) { bd = d; best = a; }
      });
      return best;
    }
    sensorNodes(['TPS880K']).forEach(function (s) {
      var organic = c2ForPos(s.localAdPosKey);           // 편제 소속(배치 선언에 명시)
      var owner = organic || nearestLocalAd(s);          // 비편제는 최근접 권역 관할(개념 배정)
      if (mcrc) addLink(links, s.id, mcrc.id, 'report', null, sensorReportTobe(s.typeId), 'korean_mcrc');
      if (owner) {
        // 편제 2대는 양 모드 보고 유지(종전과 동일). 비편제 6대(legacy 이식 산물)는
        // **As-Is에서만** 관할 방공C2A로 보고 — To-Be에 새 링크를 깔면 To-Be가 움직여
        // 변경 서명(To-Be bit-exact)이 흐려지고, To-Be는 어차피 IAOC 직결로 같은 그림을 본다.
        addLink(links, s.id, owner.id, 'report', v2 ? reportCycleComm(s.typeId) : INTERNAL,
          organic ? sensorReportTobe(s.typeId) : null, 'abt_local');
      }
    });

    deployment.batteries.forEach(function (b) {
      var shooterNode = nodeMap[b.id];
      var ecs = ecsByBattery[b.id];
      var sensor = b.mfrSensorPosKey ? nodeMap['SENSOR_' + b.mfrSensorPosKey] : null;
      var upper = c2ForPos(b.commandC2PosKey || b.iccPosKey || b.localAdPosKey);
      if (sensor && ecs) addLink(links, sensor.id, ecs.id, 'report', v2 ? reportCycleComm(sensor.typeId) : INTERNAL, sensorReportTobe(sensor.typeId), 'battery_mfr');
      if (upper && ecs) {
        var upAsIs = v2 ? C2_TRANSFER : ((b.c2Axis === 'LOCAL_AD' || b.forceOwner === 'USFK') ? INTERNAL : SHORT);
        addLink(links, ecs.id, upper.id, 'coord', upAsIs, v2 ? IFCN : DL_FAST, b.c2Axis || 'korean');
        addLink(links, upper.id, ecs.id, 'coord', upAsIs, v2 ? IFCN : DL_FAST, b.c2Axis || 'korean');
      }
      if (ecs && shooterNode) addLink(links, ecs.id, shooterNode.id, 'command', INTERNAL, INTERNAL, b.c2Axis || 'battery');
    });

    // Root loss in the original model changes the commander to each surviving
    // ICC.  Give the same surveillance picture to those ICC roots; this is a
    // reporting path, not cross-ICC engagement-state sharing.
    if (!kamdoc) {
      sensorNodes(['GREEN_PINE_B', 'GREEN_PINE_C']).forEach(function (s) {
        iccs.forEach(function (icc) { addLink(links, s.id, icc.id, 'report', v2 ? reportCycleComm(s.typeId) : LONG, sensorReportTobe(s.typeId), 'korean_kamd'); });
      });
    }
    if (!mcrc) {
      sensorNodes(['FPS117', 'TPS880K']).forEach(function (s) {
        iccs.forEach(function (icc) { addLink(links, s.id, icc.id, 'report', v2 ? reportCycleComm(s.typeId) : LONG, sensorReportTobe(s.typeId), 'korean_mcrc'); });
      });
    }

    if (iaoc) {
      // ADR-078 — IAOC는 MCRC·KAMDOC를 **대체하는** 노드가 아니라 그 **상위 제대**다.
      //
      // 센서는 조율층으로 **직결**한다(킬웹 IFCN 전제 — 정보 배포는 직렬 계선을 타지 않는다).
      // 도메인 제대(MCRC·KAMDOC)는 이 배포를 **동시에** 받아 자기 도메인 항적을 처리한다 —
      // 엔진의 `_fanoutDomainEchelon`이 그 병렬 통보를 넣는다. 직렬 중계가 아니므로
      // 조율층의 결심 시각은 제대 큐에 걸리지 않는다("거치되 시간은 그대로").
      nodes.filter(function (n) {
        return n.category === 'sensor' && n.forceOwner !== 'USFK';
      }).forEach(function (s) {
        addLink(links, s.id, iaoc.id, 'report', null, sensorReportTobe(s.typeId), 'killweb');
      });
      nodes.filter(function (n) { return n.category === 'c2' && n.id !== iaoc.id && n.forceOwner !== 'USFK'; }).forEach(function (c) {
        addLink(links, c.id, iaoc.id, 'report', null, v2 ? IFCN : DL_FAST, 'killweb');
        addLink(links, iaoc.id, c.id, 'coord', null, v2 ? IFCN : DL_FAST, 'killweb');
        // 상행 협조(승인 요청 등)도 조율층으로 향한다. As-Is의 군단 AOC→MCRC 음성 협조를
        // 대체하는 계선이며, 이게 없으면 To-Be에서 `_iadsApprovalGate`의 coord 경로 탐색이
        // 상급을 찾지 못한다(현재 To-Be는 전부 human-on-loop이라 닿지 않지만, 계선을
        // 반쪽만 두면 다음에 조용히 responsibility_gap이 난다).
        addLink(links, c.id, iaoc.id, 'coord', null, v2 ? IFCN : DL_FAST, 'killweb');
      });
      // 군단 AOC 교전현황은 To-Be에서 조율층이 받는다(As-Is 음성/VTC → 데이터링크).
      // 종전에는 도착 건수 0인 MCRC 앞으로 보내고 IAOC가 꺼내 읽는 모양이었다(ADR-056 우회).
      localAds.forEach(function (aoc) {
        addLink(links, aoc.id, iaoc.id, 'status', null, v2 ? IFCN : DL_FAST, 'corps_aoc_engagement_status');
      });
    }

    // ── ADR-085 연합 항적 공유 반사실 (usfkTrackSharing) ─────────────────────────
    //
    // ⚠️ **반사실이다. 기본은 꺼져 있고, 켜면 이 실행은 기준 배치가 아니다.**
    //
    // 현행 모델은 미군 축(THAAD·USFK Patriot)과 한국군 계통 사이에 계선을 **한 가닥도**
    // 두지 않는다(ADR-036 「권한 자동 통합 금지」 승계). 그 결과 지휘권 분리를 넘어
    // **항적 공유까지 0**이 되어, 실제 연합 방공에서 통상 이뤄지는 정보 공유(Link-16 계열)
    // 조차 없는 상태가 기준선이 되어 있다. 이 플래그는 그 가정만 국소적으로 뒤집어
    // 「지휘는 그대로 분리하되 항적만 공유했다면」을 보게 한다.
    //
    // 여는 것: **상황인식(report) 계선뿐이다.**
    //   · 미군 C2 ↔ 한국군 상급 제대(As-Is: MCRC·KAMDOC / To-Be: IAOC) 양방향 report
    // 열지 않는 것(엔진에서 그대로 격리 유지 — sim-engine.js 해당 주석 참조):
    //   · 지휘·표적할당 — 미군 축은 여전히 자기 포대만 지휘한다(_resolveIadsCommanders 불변)
    //   · 승인 계선 — 미군 축은 여전히 승인 계선 미적용(ADR-058 어서션 유지)
    //   · 교전현황(status)·중복해소 — 축이 다르면 여전히 공유 안 함(_iadsPlanBlocks 불변)
    //   · 킬웹 원격교전 파티션 — usfk 파티션은 여전히 격리(_iadsRemoteFcGrade 불변)
    //
    // ⚠️ 매체는 `usfkTrackSharing` 값으로 고른다(카탈로그 선언 매체만). 기본 'datalink'(1초)는
    //    **연합 데이터링크가 C2↔C2 전송과 같은 속도**라는 가정이며 등급 C다. 느린 매체를
    //    골라 "협조는 되지만 사람이 매개한다"는 대안도 볼 수 있게 열어 둔다.
    if (usfkShare) {
      var shareComm = {
        datalink: C2_TRANSFER, ifcn: IFCN, internal: INTERNAL,
        voice: VOICE, chat: CHAT_TRACK, 'voice-vtc': VOICE_STATUS, 'kvmf-relay': KVMF_LATERAL
      }[usfkShare === true ? 'datalink' : usfkShare];
      if (!shareComm) throw new Error('알 수 없는 usfkTrackSharing 매체: ' + usfkShare);
      var usfkC2s = nodes.filter(function (n) {
        return n.category === 'c2' && n.forceOwner === 'USFK' && n.typeId !== 'ECS';
      });
      // As-Is 상대는 도메인 상급 둘(공중 MCRC·탄도 KAMDOC), To-Be 상대는 조율층 하나.
      var asisPeers = [mcrc, kamdoc].filter(Boolean);
      usfkC2s.forEach(function (u) {
        asisPeers.forEach(function (p) {
          addLink(links, u.id, p.id, 'report', shareComm, null, 'coalition_track_share');
          addLink(links, p.id, u.id, 'report', shareComm, null, 'coalition_track_share');
        });
        if (iaoc) {
          addLink(links, u.id, iaoc.id, 'report', null, shareComm, 'coalition_track_share');
          addLink(links, iaoc.id, u.id, 'report', null, shareComm, 'coalition_track_share');
        }
      });
    }

    // ⚠️ resolveRoleId는 **등록되지 않은 키를 그대로 반환한다**. 그 값은 nodeId가 아니므로
    //    엔진의 `!this.nodeState[approvalId]` 가드(sim-engine.js)에 걸려 "승인 불필요"로
    //    조용히 처리된다 — 승인 단계가 사라지는데 실행은 성공한다. 그래서 데이터(threats.js)가
    //    쓰는 역할 이름은 **빠짐없이 여기 있어야** 한다. approval-authority.test.mjs가 잠근다.
    var roles = {
      fusionC2: iaoc ? iaoc.id : null,
      // ADR-077: 합동방공C2 조율층. fusionC2와 같은 노드를 가리키는 별칭이다 — 데이터가
      // 'fusionC2'(내부 배선 이름) 대신 편제 이름으로 승인권자를 적을 수 있게 한다.
      // KAOC/MCRC가 이미 같은 노드를 두 이름으로 가리키는 것과 같은 방식.
      IAOC: iaoc ? iaoc.id : null,
      KAMDOC: kamdoc ? kamdoc.id : null,
      MCRC: mcrc ? mcrc.id : null,
      KAOC: mcrc ? mcrc.id : (kamdoc ? kamdoc.id : null),
      corpsAocs: localAds.map(function (n) { return n.id; })
    };
    var catalog = freezeAll({
      id: id, deployment: deployment, nodes: nodes, links: links,
      nodeMap: nodeMap, roles: roles,
      compatibilityMode: 'native-iads-c2-engagement-v1',
      nativeCounts: {
        positions: Object.keys(deployment.positions).length,
        sensors: deployment.sensors.length,
        batteries: deployment.batteries.length,
        c2Nodes: deployment.c2Nodes.length,
        ecs: deployment.c2Nodes.filter(function (n) { return n.typeId === 'ECS'; }).length,
        shorad: deployment.batteries.filter(function (b) { return b.shooterTypeId === 'BIHO' || b.shooterTypeId === 'CHUNMA'; }).length
      }
    });
    cache[cacheKey] = catalog;
    return catalog;
  }

  // ADR-061: KJ.LEGACY_CATALOG 폐기 — 고해상도 카탈로그만 존재한다.
  KJ.buildDeploymentCatalog = buildDeploymentCatalog;

  /**
   * 계선 매체 사전 — 「이 계선이 문자 대신 데이터링크였다면?」 반사실 실험용.
   *
   * ⚠️ **이 파일 위쪽에 선언된 그 상수들 자체**를 내보낸다. 값을 여기서 다시 적으면
   *    두 벌이 되어, 위를 고쳐도 실험 쪽은 옛 값으로 조용히 남는다.
   * ⚠️ 여기 없는 값(임의의 초)으로는 바꿀 수 없게 둔다. 근거 없는 숫자를 넣으면
   *    그 실행의 결과는 인용할 수 없는 것이 되는데, 화면에서는 그 구분이 안 보인다.
   */
  KJ.LINK_MEDIA_PRESETS = Object.freeze({
    'datalink': C2_TRANSFER, 'ifcn': IFCN, 'internal': INTERNAL,
    'voice': VOICE, 'chat': CHAT_TRACK, 'voice-vtc': VOICE_STATUS, 'kvmf-relay': KVMF_LATERAL
  });

  /**
   * 카탈로그의 특정 계선만 다른 매체로 갈아 끼운 **사본**을 만든다(원본 캐시는 그대로).
   *
   * @param overrides { '<from>><to>><kind>': '<매체 키>' }
   * @returns 원본과 같은 모양의 새 카탈로그 + `linkMediaOverrides`(적용 내역 원장)
   *
   * ⚠️ 반사실이다. 매체가 바뀌면 `_linkDelay`의 난수 소비가 달라져 **실행 전체가 다른
   *    표본**이 된다 — 기준 배치 결과와 나란히 놓고 "차이 = 그 계선의 몫"이라고 읽으면
   *    안 된다(같은 seed라도 짝맞춤이 깨진다). 원장을 결과에 실어 두는 이유다.
   */
  KJ.withLinkMediaOverrides = function (catalog, overrides, mode) {
    var keys = Object.keys(overrides || {});
    if (!keys.length) return catalog;
    var applied = [], unmatched = keys.slice();
    var links = catalog.links.map(function (l) {
      var key = l.from + '>' + l.to + '>' + l.kind;
      var want = overrides[key];
      if (!want || !l.comm[mode]) return l;
      var preset = KJ.LINK_MEDIA_PRESETS[want];
      if (!preset) throw new Error('알 수 없는 계선 매체: ' + want);
      var at = unmatched.indexOf(key);
      if (at >= 0) unmatched.splice(at, 1);
      applied.push({ from: l.from, to: l.to, kind: l.kind,
        was: l.comm[mode].type, now: preset.type });
      var comm = {};
      Object.keys(l.comm).forEach(function (m) { comm[m] = l.comm[m]; });
      comm[mode] = preset;
      return { from: l.from, to: l.to, kind: l.kind, comm: comm, axis: l.axis };
    });
    var out = {};
    Object.keys(catalog).forEach(function (k) { out[k] = catalog[k]; });
    out.links = links;
    // 못 맞춘 키를 조용히 삼키지 않는다 — 오타 하나로 "바꿨는데 안 바뀐" 실행이 나온다.
    out.linkMediaOverrides = { applied: applied, unmatched: unmatched, mode: mode };
    return freezeAll(out);
  };
  KJ.resolveModelCatalog = function (config) {
    config = config || {};
    var features = config.features || {};
    // ADR-055: MINI 폐기 이후의 기본 고해상도 배치. LEGACY_HIRES는 legacy와 자산 편성이
    // 같아, 배치 ID를 생략한 호출이 legacy 결과와 가장 가까운 편성을 보게 된다.
    // ADR-057: linkSemanticsV2 ON이면 codex ADR-014 정합 링크 변형 카탈로그를 쓴다(캐시 분리).
    return buildDeploymentCatalog(config.deploymentId || 'HANBANDO_LEGACY_NORMAL',
      // ADR-066: 기본 ON 전환 — 엔진 기본값과 반드시 일치해야 한다(`=== true`로 두면 features에
      // 키가 없는 호출에서 엔진은 ON인데 카탈로그는 구 링크값인 조용한 불일치가 생긴다).
      { linkSemanticsV2: features.linkSemanticsV2 !== false,
        // ADR-058: 승인 계선용 coord 링크는 변형 카탈로그에서만 생성(OFF wire shape 불변).
        // ADR-065: 기본 ON 전환 — 엔진 기본값과 반드시 일치해야 한다. `=== true`로 두면
        // features에 키가 없는 호출에서 엔진은 승인 계선 ON인데 카탈로그에는 coord 링크가
        // 없는 불일치가 생긴다. 명시적 false만 끈다.
        approvalChain: features.approvalChain !== false || features.approvalChainTobe === true,
        // ADR-064·065: 남부 종심 축선 — coverage 파생 포함 여부(명시적 false만 제외)
        southernAxes: features.southernAxes !== false,
        // ADR-067: 센서→C2 보고 주기 양 모드 공통(기본 ON — 엔진 기본값과 정합)
        sensorReportParity: features.sensorReportParity !== false,
        // ADR-081: 방공C2A 간 상급 경유 항적 공유(KVMF) — 기본 ON. 엔진 기본값과 반드시
        // 일치해야 한다(다른 기본 ON 플래그와 같은 이유 — 명시적 false만 끈다).
        kvmfLateral: features.kvmfLateral !== false,
        // ADR-085: 연합 항적 공유 반사실 — **명시적으로 켤 때만** 계선이 생긴다(기본 OFF).
        // 다른 플래그와 달리 `!== false`가 아니라 truthy 검사인 이유: 이것은 기본값 전환이
        // 아니라 반사실이라, 키가 없는 호출에서 조용히 켜지면 안 된다.
        usfkTrackSharing: features.usfkTrackSharing || null,
        // ADR-058 동반 스윕: 운용자 처리시간 high/mid/low (기본 mid — 종전 동일)
        c2OperatorLevel: features.c2OperatorLevel === 'high' || features.c2OperatorLevel === 'low'
          ? features.c2OperatorLevel : null });
  };
  KJ.resolveRoleId = function (id, catalog) {
    catalog = catalog || buildDeploymentCatalog('HANBANDO_LEGACY_NORMAL', {});
    return catalog.roles && Object.prototype.hasOwnProperty.call(catalog.roles, id)
      ? catalog.roles[id] : id;
  };
  KJ.nodeById = function (id, catalog) {
    catalog = catalog || buildDeploymentCatalog('HANBANDO_LEGACY_NORMAL', {});
    if (catalog.nodeMap) return catalog.nodeMap[id] || null;
    return catalog.nodes.find(function (n) { return n.id === id; }) || null;
  };
  KJ.nodesInMode = function (mode, catalog) {
    catalog = catalog || buildDeploymentCatalog('HANBANDO_LEGACY_NORMAL', {});
    return catalog.nodes.filter(function (n) { return !n.modes || n.modes.indexOf(mode) !== -1; });
  };
  KJ.linksInMode = function (mode, catalog) {
    catalog = catalog || buildDeploymentCatalog('HANBANDO_LEGACY_NORMAL', {});
    return catalog.links.filter(function (l) { return !!l.comm[mode]; });
  };
})();
</script>
<script>/* js/core/rng.js (inlined) */
/**
 * K-JAMDS 시뮬레이터 — 시드 기반 난수·분포 샘플러 (Phase 2)
 *
 * Mulberry32: 32비트 결정론적 PRNG. 동일 seed → 동일 난수열 → 재현성·딥링크 공유.
 * (근거: 본 프로젝트 계획서 4절 — Mulberry32는 UI 재현·딥링크 공유용으로 적합.
 *  통계적 엄밀성이 요구되는 대규모 배치는 Phase 3에서 주기가 긴 생성기 병행 검토.)
 *
 * 분포 샘플러: DES 엔진의 도착(지수)·서비스(지수) 및 요격확률(삼각) 등에 사용.
 * 모든 샘플러는 주입된 rng()에만 의존하므로 seed 고정 시 완전 재현된다.
 */
(function () {
  'use strict';
  window.KJ = window.KJ || {};

  /** Mulberry32 PRNG 팩토리. 반환 함수는 [0,1) 균일난수를 낸다. */
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /**
   * 샘플러 묶음 생성. rng 하나를 공유해 전 분포가 같은 스트림에서 소비된다.
   * @param {number} seed 정수 시드
   */
  KJ.makeRng = function (seed) {
    var rng = mulberry32(seed >>> 0);
    var spareNormal = null;

    function uniform(a, b) {
      if (a === undefined) return rng();
      return a + (b - a) * rng();
    }

    /** 지수분포 (평균 mean). 포아송 도착의 도착간격·M/M/c 서비스시간에 사용. */
    function exponential(mean) {
      var u = 1 - rng(); // (0,1] 로 log(0) 회피
      return -mean * Math.log(u);
    }

    /** 삼각분포 Triangular(min, mode, max). 전문가 추정 최소/최빈/최대. */
    function triangular(min, mode, max) {
      if (max <= min) return min;
      var u = rng();
      var fc = (mode - min) / (max - min);

 * K-JAMDS 시뮬레이터 — 이벤트 큐용 이진 최소힙 (Phase 2)
 *
 * DES 이벤트 큐를 배열 기반 이진 최소힙으로 구현 (계획서 4절: JS에서 O(log n) 삽입/추출로 충분).

 * 삽입순서로 결정론적으로 해소한다. seq 덕분에 seed 고정 시 이벤트 처리순서가 완전 재현된다.

  'use strict';
  window.KJ = window.KJ || {};

  function less(a, b) {
    if (a.t !== b.t) return a.t < b.t;
    if (a.pri !== b.pri) return a.pri < b.pri;
    return a.seq < b.seq;
  }

  MinHeap.prototype.size = function () { return this.a.length; };

  MinHeap.prototype.push = function (item) {
    var a = this.a;
    a.push(item);
    var i = a.length - 1;
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (less(a[i], a[p])) { var t = a[i]; a[i] = a[p]; a[p] = t; i = p; }
      else break;
    }
  };

  MinHeap.prototype.pop = function () {
    var a = this.a;
    if (a.length === 0) return null;
    var top = a[0];
    var last = a.pop();
    if (a.length > 0) {
      a[0] = last;
      var i = 0, n = a.length;
      while (true) {
        var l = 2 * i + 1, r = 2 * i + 2, m = i;

      }

  };
