/* ── 계선 매체 교체 (반사실 실험) ───────────────────────────────────────────
   ⚠️ 교체 대상 키는 **카탈로그 계선의 신원**(from>to>kind)이다. 화면에서 간선을 매체별로
      가른 키(from>to|매체)와 다르다 — 매체는 바꾸려는 대상이지 신원이 아니다.
   ⚠️ 값은 `KJ.LINK_MEDIA_PRESETS`에 있는 것만 고를 수 있다. 임의의 초를 넣게 두면
      근거 없는 수치가 결과에 섞이는데, 화면에서는 그 구분이 보이지 않는다.          */
const ovrKey = (e) => e.from + '>' + e.to + '>' + e.kind;

function openMediaPopover(edge, ev) {
  const pop = el('pop');
  const cur = overrides[ovrKey(edge)] || edge.mt;
  el('pop-title').innerHTML =
    `${esc(nodeName(edge.from))} <span class="dim">→</span> ${esc(nodeName(edge.to))}` +
    `<div class="dim" style="font-weight:400">${esc(edge.kind)} 계선 · 현재 ${esc(media(cur).label)}</div>`;
  el('pop-body').innerHTML = Object.keys(KJ.LINK_MEDIA_PRESETS).map((k) => {
    const m = media(k), p = KJ.LINK_MEDIA_PRESETS[k];
    const on = k === cur;
    return `<button data-k="${k}" class="${on ? 'on' : ''}">` +
      `<span style="color:${on ? 'inherit' : m.color}">${esc(m.label)}</span>` +
      `<span class="h">${esc(p.dist ? `평균 ${p.dist.mean}초` : `${p.delaySec}초`)}` +
      `${p.confidence ? ' · 등급 ' + p.confidence : ''}</span></button>`;
  }).join('');
  el('pop-body').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => {
      const k = b.dataset.k;
      // 원래 매체로 되돌리면 항목 자체를 지운다 — "바꿨다가 되돌린 것"을 반사실로 셀 이유가 없다.
      if (k === edge.mt) delete overrides[ovrKey(edge)];
      else overrides[ovrKey(edge)] = k;
      renderOverrides();
      markDirty();
      pop.hidden = true;
    });
  });
  // 손잡이 줄을 걷어냈으므로 「전부 되돌리기」는 여기가 유일한 자리다.
  el('ovr-clear').hidden = !Object.keys(overrides).length;
  const r = el('graph').getBoundingClientRect();
  pop.hidden = false;
  const pr = pop.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - pr.width - 10,
    Math.max(10, (ev.clientX || r.left + r.width / 2) - pr.width / 2)) + 'px';
  pop.style.top = Math.min(window.innerHeight - pr.height - 10,
    Math.max(10, (ev.clientY || r.top) + 12)) + 'px';
}

/**
 * 계선 매체 교체는 **그래프 위 클릭**으로만 조작한다(손잡이 줄을 걷어냈으므로).
 * 적용 내역은 실행 상태줄이 「반사실 N건 적용」으로 상시 표출한다 — 화면 어딘가에는
 * 반드시 남아야 조건을 모르고 수치를 읽는 일이 없다.
 */
function renderOverrides() {
  if (view === 'all' && geoAll) { layoutAll(); drawFrame(); }
  else if (sel && geo) { layoutGraph(); drawFrame(); }
}

/** 노드 이름을 낱말 경계에서 최대 `max`줄로 접는다. 넘치면 마지막 줄을 …로 자른다. */
function wrapLabel(s, per, max) {
  const words = String(s).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (!cur) { cur = w; }
    else if ((cur + ' ' + w).length <= per) { cur += ' ' + w; }
    else { lines.push(cur); cur = w; }
    if (lines.length === max) break;
  }
  if (cur && lines.length < max) lines.push(cur);
  if (lines.length === max) {
    const used = lines.join(' ').length;
    if (used < String(s).length) lines[max - 1] = lines[max - 1].slice(0, per - 1) + '…';
  }
  return lines;
}

/* ══════════════════════════════════════════════════════════════════════════
   5-b. 전체 흐름 보기 — 배치 전체를 세우고, 전 항적을 겹쳐 케파·병목을 본다
   ══════════════════════════════════════════════════════════════════════════ */
let geoAll = null;

/**
 * 배치 전체를 열에 세우는 **공용 좌표 계산**. [전체 흐름]과 [항적 개별]이 같은 함수를 쓴다 —
 * 두 보기가 다른 자리에 노드를 그리면 눈이 매번 배치를 다시 익혀야 한다(사용자 결정 2026-09-02).
 * 열 안 정렬 규칙만 보기마다 다르다(cmp): 전체는 **활동 많은 순**, 개별은 **이 항적이 쓴 것 먼저**.
 * 밀집 열(센서 19 · ECS 15 …)은 소열로 갈라 작은 링으로 세운다 — 한 줄로 늘어놓으면 열이
 * 길어지고, #graph는 preserveAspectRatio meet이라 전체가 그만큼 축소된다.
 */
function placeSlots(W, minH, cmp) {
  const colW = W / COLS.length;
  const buckets = COLS.map(() => []);
  const slotOf = {};   // 인스턴스키 -> {id, dup}
  Object.keys(run.nodes).forEach((id) => {
    nodeSlots(run.nodes[id]).forEach((sl) => {
      const k = slotKey(id, sl.dup);
      buckets[sl.col].push(k); slotOf[k] = { id: id, dup: sl.dup };
    });
  });
  // 행 하나에 **이름표 두 줄이 들어갈** 높이를 준다. 종전에는 남는 높이를 노드 수로 나눠
  // 밀집 열(센서 19 · ECS 15 …)의 이름을 통째로 지웠는데, 그러면 「어느 장비인가」를
  // 화면에서 읽을 수 없다(사용자 지적). 이제 높이는 노드 수가 정하고 화면은 스크롤한다.
  const ROW = 54;
  // 소열 분할은 **아주 큰 열에만** 남긴다(FULL 배치의 ECS 84 · 사수 84 대비).
  // LEGACY 배치의 최대 열은 센서 19라 분할되지 않는다 — 전 노드가 제 이름을 단다.
  const DENSE = 30;
  const rowsOf = (n) => Math.min(n, DENSE);
  const rowMax = Math.max(1, ...buckets.map((b) => rowsOf(b.length)));
  const H = Math.max(minH || 0, 74 + rowMax * ROW + 26);
  const nodes = {};
  buckets.forEach((ids, ci) => {
    ids.sort(cmp);
    const cx = colW * (ci + .5);
    const subCols = Math.max(1, Math.ceil(ids.length / DENSE));
    const gap = subCols > 1 ? Math.min(colW / subCols, (colW - 16) / subCols) : 0;
    ids.forEach((k, i) => {
      const si = subCols > 1 ? Math.floor(i / DENSE) : 0;
      const ri = subCols > 1 ? i % DENSE : i;
      nodes[k] = { id: slotNodeId(k), key: k, dup: slotOf[k].dup, col: ci,
        x: cx + (si - (subCols - 1) / 2) * gap,
        y: 74 + ROW * (ri + .5), r: subCols > 1 ? 7 : 9, dense: subCols > 1 };
    });
  });
  return { nodes, colW, buckets, H };
}

function layoutAll() {
  const svg = el('graph');
  const wrap = el('graph-wrap');
  const W = Math.max(760, wrap.clientWidth);
  const actOf = (id) => (gv.stats[id] ? gv.stats[id].arr : 0);
  // 간선 양 끝으로 등장하는 노드도 「활동」으로 친다(센서·포대는 큐가 없어 arr=0이다).
  run.allFlows.forEach((f) => {
    gv.stats[f.from] = gv.stats[f.from] || { arr: 0, drops: 0, reneges: 0, peakQ: 0, touched: true };
    gv.stats[f.from].touched = true;
    gv.stats[f.to] = gv.stats[f.to] || { arr: 0, drops: 0, reneges: 0, peakQ: 0, touched: true };
    gv.stats[f.to].touched = true;
  });
  const touched = (id) => !!(gv.stats[id] && (gv.stats[id].arr || gv.stats[id].touched));

  // 배치 전체를 세운다(사용자 결정). 열 안 정렬은 **활동 많은 순** — 바쁜 장비가 위로
  // 모여야 놀고 있는 장비 수십 개가 화면 중앙을 차지하지 않는다. 놀면 흐리게(idle).
  const nid = (k) => slotNodeId(k);
  const { nodes, colW, buckets, H } = placeSlots(W, wrap.clientHeight || 480, (a, b) =>
    (actOf(nid(b)) - actOf(nid(a))) || (touched(nid(b)) - touched(nid(a))) ||
    ((run.nodes[nid(a)] && run.nodes[nid(a)].name) || a)
      .localeCompare((run.nodes[nid(b)] && run.nodes[nid(b)].name) || b, 'ko'));

  // 간선 — 실제 통과가 있던 것만 긋는다. 카탈로그의 전 선을 그리면 노이즈가 흐름을 덮는다.
  const em = new Map();
  run.allFlows.forEach((f) => {
    const k = edgeKey(f);
    let e = em.get(k);
    if (!e) em.set(k, e = { key: k, from: f.from, to: f.to, mt: f.mt, kind: f.kind, n: 0, flows: [] });
    e.n++; e.flows.push(f);
  });
  const par = {};
  const eList = [...em.values()];
  eList.forEach((e) => {
    const pk = pickSlots(run.nodes[e.from], run.nodes[e.to]);
    e._ak = slotKey(e.from, pk.a.dup); e._bk = slotKey(e.to, pk.b.dup);
    (par[e._ak + '>' + e._bk] = par[e._ak + '>' + e._bk] || []).push(e);
  });
  const edges = eList.map((e) => {
    const a = nodes[e._ak], b = nodes[e._bk];
    if (!a || !b || (a.x === b.x && a.y === b.y)) return null;
    const sib = par[e._ak + '>' + e._bk];
    const off = (sib.indexOf(e) - (sib.length - 1) / 2) * 18;
    const back = b.col <= a.col;
    let d;
    if (back) {
      const dip = Math.max(36, Math.abs(a.x - b.x) * .18 + 30) + off;
      d = `M${a.x},${a.y} C${a.x - 10},${a.y + dip} ${b.x + 10},${b.y + dip} ${b.x},${b.y}`;
    } else {
      const mx = (a.x + b.x) / 2;
      d = `M${a.x},${a.y} C${mx},${a.y + off} ${mx},${b.y + off} ${b.x},${b.y}`;
    }
    // ca·cb — 이 간선이 넘는 열 구간(열 밝힘이 셀 경계).
    return Object.assign({}, e, { d, back, ca: a.col, cb: b.col });
  }).filter(Boolean);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMin meet');
  svg.classList.toggle('hide-sensor', !el('show-sensor').checked);

  const bands = COLS.map((c, i) => {
    const x = colW * i;
    return `<g><rect class="colband${i % 2 ? ' alt' : ''}" x="${x}" y="0" width="${colW}" height="${H}"></rect>` +
      `<text class="colhdr" x="${x + colW / 2}" y="18" text-anchor="middle">${esc(c.label)}</text>` +
      `<text class="colhdr" x="${x + colW / 2}" y="30" text-anchor="middle" opacity=".65">${esc(c.hint)} · ${buckets[i].length}개</text>` +
      (buckets[i].length ? '' :
        `<text class="colhdr" x="${x + colW / 2}" y="${H / 2}" text-anchor="middle" opacity=".5">없음</text>`) +
      `</g>`;
  }).join('');

  const edgeSvg = edges.map((e, i) => {
    const m = media(e.mt);
    const ovr = overrides[ovrKey(e)];
    const sensor = e.mt === 'report-cycle' ? ' sensor-edge' : '';
    // 밀집 열(센서·ECS·사수)에 닿는 간선은 가늘게 — 수십 가닥이 정상 굵기면 면이 된다.
    const thin = nodes[e._ak].dense || nodes[e._bk].dense;
    return `<g class="edgeg${sensor}" data-ek="${esc(e.key)}">` +
      `<path class="edge-hit" d="${e.d}"></path>` +
      `<path class="edge${ovr ? ' overridden' : ''}" d="${e.d}" stroke="${m.color}" stroke-width="${thin ? 1.4 : m.w}" opacity=".3"` +
      (m.dash && !ovr ? ` stroke-dasharray="${m.dash}"` : '') + `>` +
      `<title>${esc(nodeName(e.from) + ' → ' + nodeName(e.to) + ' · ' + m.label + ' · 전문 ' + e.n + '건' +
        (e.back ? ' (역방향)' : '') + edgeMetaLine(e.from, e.to, e.mt) +
        '\n클릭하면 이 계선의 매체를 바꿔볼 수 있습니다')}</title></path></g>`;
  }).join('');

  // 노드 표현은 둘로 나뉜다.
  //  · 큐가 선언되고 자리가 넉넉한 C2 노드 → **DB 실린더**. 처리 슬롯이 아래에서 위로
  //    차오르고, 대기는 그 위에 디스크로 쌓인다. "얼마나 찼나"를 각도가 아니라 **높이**로
  //    읽게 하려는 것이다(링은 반쯤 찬 것과 가득 찬 것이 잘 구분되지 않았다).
  //  · 밀집 열(센서·ECS·포대) → 종전대로 작은 원. 실린더를 그릴 자리가 없다.
  // ⚠️ queue 선언이 없는 노드(센서·포대)는 **아무 용량 표시도 하지 않는다** — 없는 용량을
  //    지어내지 않는다(ADR-062: 0과 미측정을 가르는 규율).
  const nodeSvg = Object.keys(nodes).map((k) => {
    const p = nodes[k], n = run.nodes[p.id] || {};
    const cat = n.category || 'c2';
    // 실린더는 **일하는 자리에만** — 중복 노드의 상행 자리는 순수 중계다.
    const cap = isWorkSlot(p.dup) ? nodeCap(n) : null;
    const hasCap = !!cap;
    const cyl = hasCap && !p.dense;
    const rr = p.r + (p.dense ? 2.2 : 3.2);
    const lines = p.dense ? [] : wrapLabel((n.name || p.id) + (p.dup === 'up' ? ' ↑중계' : ''), 13, 2);
    const idle = touched(p.id) ? '' : ' idle';
    const labelY = cyl ? p.y + CYL.h / 2 + 13 : p.y + rr + 12;
    let glyph;
    if (cyl) {
      p.cyl = true;
      glyph = cylSvg(p, cap.c, cap.unit);
    } else {
      glyph = `<circle class="ncirc ${cat}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r}"></circle>` +
        `<text class="qtail" x="${(p.x + rr + 3).toFixed(1)}" y="${(p.y - 4).toFixed(1)}"></text>`;
    }
    return `<g class="nodeg${idle}${cyl ? ' hascyl' : ''}${p.dup === 'up' ? ' relay' : ''}"` +
      ` data-id="${esc(p.id)}" data-slot="${esc(k)}">` + glyph +
      lines.map((ln, li) =>
        `<text class="nlabel" x="${p.x.toFixed(1)}" y="${(labelY + li * 11).toFixed(1)}" text-anchor="middle">${esc(ln)}</text>`).join('') +
      `<title>${esc((n.name || p.id) + '\n' + p.id +
        (p.dup === 'up' ? '\n보고 상행 중계 자리 — 같은 노드가 오른쪽 「명령 ↓」 열에 한 번 더 선다'
          : p.dup === 'dn' ? '\n명령 하행 자리 — 큐가 여기 쌓인다' : '') +
        (cap ? `\n${cap.what} — ${cap.c}${cap.unit} · 대기실 ${cap.K}${cap.unit}` +
          (cap.unit === '석' ? ' (석 = 동시 결심 슬롯)' : ' (발 = 동시 유도 요격탄)')
          : (n.category === 'sensor' ? '\n(센서 — 처리 큐 없음)' : '\n(중계 — 용량 표시 없음)')))}</title></g>`;
  }).join('');

  svg.innerHTML = bands + `<g id="lyr-edges">${edgeSvg}</g><g id="lyr-arrows"></g>` +
    `<g id="lyr-nodes">${nodeSvg}</g><g id="lyr-dots"></g>`;
  geoAll = { nodes, edges, W, H, colW, edgeByKey: {}, nodeEls: {}, prevLive: new Set() };
  [...svg.querySelectorAll('#lyr-edges .edgeg')].forEach((g, i) => {
    const p = g.querySelector('.edge');
    edges[i].el = p; edges[i].len = p.getTotalLength(); edges[i].g = g;
    geoAll.edgeByKey[edges[i].key] = edges[i];
    g.addEventListener('click', (ev) => openMediaPopover(edges[i], ev));
  });
  // 화살촉은 길이를 잰 **뒤에** 그린다.
  svg.querySelector('#lyr-arrows').innerHTML = arrowsSvg(edges);
  geoAll.bandEls = [...svg.querySelectorAll('.colband')];
  [...svg.querySelectorAll('.nodeg')].forEach((g) => {
    const id = g.dataset.id;
    // ⚠️ **인스턴스 키**로 담는다(ECS 상행/하행이 서로 덮어쓰지 않게).
    geoAll.nodeEls[g.dataset.slot] = Object.assign({ g, id: id, circ: g.querySelector('.ncirc'),
      tail: g.querySelector('.qtail') }, cylEls(g));
    g.addEventListener('click', (ev) => { ev.stopPropagation(); toggleFocusNode(id); });
  });
}

/** 노드 클릭 → 병목 로그를 그 노드로 거른다(다시 클릭하면 해제). */
function toggleFocusNode(id) {
  if (!gv) return;
  gv.focusNode = gv.focusNode === id ? null : id;
  if (allLogMode === 'bot') renderBotLog();   // 노드 필터는 병목 로그의 것
  // C2 처리 모드 — 그래프에서 큐 있는 C2를 짚으면 처리 로그도 그 노드로 따라간다.
  else if (allLogMode === 'c2' && gv.focusNode) {
    const n = run.nodes[gv.focusNode];
    if (n && n.queue && n.queue.servers && gv.focusNode !== allLogC2Id) {
      allLogC2Id = gv.focusNode;
      renderAllLog();
    }
  }
  renderLoadRank(lastState || {}, true);
  if (geoAll) Object.keys(geoAll.nodeEls).forEach((k) => {
    geoAll.nodeEls[k].g.classList.toggle('focus', geoAll.nodeEls[k].id === gv.focusNode);
  });
}

/**
 * 시각 t의 노드별 {busy, q, svcSum, svcN} — 전역 체류에서 복원.
 * svcSum/svcN은 지금 서비스 중인 작업들의 **총 소요 시간**(완료−개시)이고, 작업 맥동의
 * 주기가 여기서 나온다. 관측 종료까지 안 끝난 작업은 길이를 모르므로 세지 않는다 —
 * 그런 노드는 svcN이 0으로 남아 workPulseSec()이 가장 느린 쪽으로 잡는다(지어내지 않는다).
 */
function stateAt(t) {
  const state = {};
  run.allSpans.forEach((s) => {
    if (s.arrive > t) return;
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (t > endT) return;
    const st = state[s.at] || (state[s.at] = { q: 0, busy: 0, svcSum: 0, svcN: 0 });
    if (s.start != null && t >= s.start) {
      st.busy++;
      if (s.done != null) { st.svcSum += s.done - s.start; st.svcN++; }
    } else st.q++;
  });
  return state;
}

let lastState = null;
let lastRankWall = 0;

function drawFrameAll() {
  if (!run || !geoAll || !gv) return;
  const dots = el('graph').querySelector('#lyr-dots');
  const showSensor = el('show-sensor').checked;
  let out = '';

  // 전문: 느린 매체(음성·문자·VTC·KVMF ≥ 10초)만 개별 점 — 빠른 전문까지 다 찍으면
  // 초당 수십 개가 지나가며 깜박임만 남는다(사용자 결정). 빠른 매체는 선 맥동으로 집약.
  const hotEdges = new Set();
  const liveCols = new Set();
  const talking = new Map();   // nodeId → 지금 이 노드를 끝점으로 나는 전문 중 가장 긴 전송 시간
  let slowCount = 0;
  run.allFlows.forEach((f) => {
    const inFlight = f.d > 0 ? (simT >= f.t0 && simT <= f.t1) : (simT >= f.t0 && simT <= f.t0 + 1.5);
    if (!inFlight) return;
    const e = geoAll.edgeByKey[edgeKey(f)];
    if (!e) return;
    if (e.ca != null) { liveCols.add(e.ca); liveCols.add(e.cb); }
    // 교신 맥동 재료 — 이 전문의 양 끝. 센서 보고(report-cycle)는 세지 않는다(CSS 주석 참조).
    if (f.d > 0 && f.mt !== 'report-cycle') {
      [f.from, f.to].forEach((id) => {
        const p = talking.get(id);
        if (p == null || f.d > p) talking.set(id, f.d);
      });
    }
    // ⚠️ 「센서 보고 표시」 토글은 **점의 혼잡을 줄이는 손잡이**이지 흐름을 부정하는 것이
    //    아니다. 열 밝기는 토글과 무관하게 전량을 센다 — 센서→ECS 사이를 건너는 전문은
    //    전부 report-cycle이라, 토글을 따르면 맨 왼쪽 두 열이 **영영 꺼진 채**로 남아
    //    킬체인이 시작부터 죽은 것처럼 읽힌다.
    if (!showSensor && f.mt === 'report-cycle') return;
    if (f.d >= SLOW) {
      if (!e.el) return;
      const p = (simT - f.t0) / f.d;
      const pt = e.el.getPointAtLength(e.len * Math.min(1, Math.max(0, p)));
      const m = media(f.mt);
      slowCount++;
      out += `<circle class="dot" data-th="${esc(f.th || '')}" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="${m.color}">` +
        `<title>${esc((f.th || '') + ' · ' + m.label + ' ' + f.d.toFixed(0) + '초 — 클릭하면 이 항적을 따라간다')}</title></circle>`;
    } else {
      hotEdges.add(e.key);
    }
  });
  geoAll.edges.forEach((e) => {
    e.el.classList.toggle('hot', hotEdges.has(e.key));
  });

  // 계선 입구에 막혀 있는 전문 — 「가야 할 방향은 있는데 못 가는」 그림.
  out += renderBlocks(run.allBlocks, geoAll);

  // 넘침 섬광 — 최근 1.2초 안의 즉시 드롭 지점에 붉은 링을 띄운다.
  gv.rows.forEach((r) => {
    if (r.type !== 'overflow' || r.t > simT || simT - r.t > 1.2) return;
    const p = slotPos(geoAll, r.node);
    if (!p) return;
    const age = (simT - r.t) / 1.2;
    out += `<circle class="flash" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}"` +
      ` r="${(p.r + 4 + age * 10).toFixed(1)}" opacity="${(0.9 * (1 - age)).toFixed(2)}"></circle>`;
  });
  dots.innerHTML = out;

  // 노드 케파 — 링 채움(처리중/서버수)·큐 꼬리·색 단계(여유→가득→가득+대기).
  const state = stateAt(simT);
  lastState = state;
  const liveNow = new Set(Object.keys(state));
  // 이번에 살아 있는 노드 + 직전 프레임에 살아 있던 노드만 만진다(전 노드 갱신은 낭비).
  const dirty = new Set([...liveNow, ...geoAll.prevLive]);
  const dirtySlots = new Set();
  Object.keys(geoAll.nodeEls).forEach((k) => { if (dirty.has(geoAll.nodeEls[k].id)) dirtySlots.add(k); });
  dirtySlots.forEach((k) => {
    const els = geoAll.nodeEls[k];
    if (!els) return;
    const id = els.id, n = run.nodes[id];
    const cap = nodeCap(n); const c = cap ? cap.c : null;
    const st = state[id] || { busy: 0, q: 0 };
    // 일이 있는 노드의 열도 밝힌다 — 선 위의 이동만 세면 「처리 중」인 단계가 꺼져 보인다.
    if ((st.busy || st.q) && geoAll.nodes[k]) liveCols.add(geoAll.nodes[k].col);
    if (els.fill && c) {
      paintCyl(els, geoAll.nodes[k], c, st, null);   // 전체 보기엔 「내 항적」이 없다
    } else if (els.tail) {
      els.tail.textContent = st.q > 0
        ? '•'.repeat(Math.min(st.q, 6)) + (st.q > 6 ? '+' + (st.q - 6) : '')
        : '';
      if (els.circ) {
        // 실린더를 못 그린 자리(밀집 열의 ECS·사수)의 동그라미도 **같은 규칙으로** 맥동한다.
        els.circ.classList.toggle('busy', !!st.busy);
        els.circ.classList.toggle('queued', !!(st.q && !st.busy));
        if (st.busy) applyPulse(els.circ, st);
      }
    }
  });
  geoAll.prevLive = liveNow;

  // 교신 맥동 — 전문 끝점 노드의 테두리를 그 전문의 전송 시간 주기로 고동시킨다.
  // 처리 중(busy)이면 작업 맥동이 우선한다(CSS :not 가드와 같은 규칙을 JS에서도 지킨다).
  const talkNow = new Set(talking.keys());
  const talkDirty = new Set([...talkNow, ...(geoAll.prevTalking || [])]);
  Object.keys(geoAll.nodeEls).forEach((k) => {
    const els = geoAll.nodeEls[k];
    if (!talkDirty.has(els.id)) return;
    const busyNow = !!((state[els.id] || {}).busy);
    const on = talkNow.has(els.id) && !busyNow;
    if (els.cyl) {
      els.cyl.classList.toggle('talking', on);
      if (on) commPulse(els.rim, talking.get(els.id));
    } else if (els.circ) {
      els.circ.classList.toggle('talking', on);
      if (on) commPulse(els.circ, talking.get(els.id));
    }
  });
  geoAll.prevTalking = talkNow;
  paintLiveCols(geoAll, liveCols);

  // 부하 순위는 300ms 스로틀 — 매 프레임 정렬·DOM 재생성은 낭비다.
  const wall = performance.now();
  if (wall - lastRankWall > 300) { lastRankWall = wall; renderLoadRank(state); }
  if (allLogMode === 'c2') paintC2Log(); else paintBotLog();
  paintClock();
}

/** 좌상단: 현재 시각의 노드 부하 순위 (대기+처리 기준, 상위만). */
function renderLoadRank(state, force) {
  const box = el('track-list');
  const ranked = Object.keys(gv.stats)
    .filter((id) => run.nodes[id] && gv.stats[id].arr > 0)
    .map((id) => {
      const n = run.nodes[id];
      const cap = nodeCap(n); const c = cap ? cap.c : null;
      const st = state[id] || { busy: 0, q: 0 };
      const jam = c != null && st.busy >= c && st.q > 0;
      const full = c != null && st.busy >= c && !jam;
      return { id, n, c, st, jam, full, drops: gv.stats[id].drops, dead: gv.stats[id].dead };
    })
    .sort((a, b) => (b.jam - a.jam) || (b.st.q - a.st.q) ||
      ((b.c ? b.st.busy / b.c : 0) - (a.c ? a.st.busy / a.c : 0)) ||
      (gv.stats[b.id].arr - gv.stats[a.id].arr));
  el('track-count').textContent = ranked.length + '개 활동';
  box.innerHTML = ranked.slice(0, 18).map((r) => {
    const frac = r.c ? Math.min(1, r.st.busy / r.c) : 0;
    return `<div class="rk${r.jam ? ' jam' : (r.full ? ' full' : '')}${gv.focusNode === r.id ? ' focus' : ''}" data-id="${esc(r.id)}"` +
      ` title="${esc((r.n.name || r.id) + (r.c ? `\n처리 ${r.st.busy}/${r.c} · 대기 ${r.st.q}` : '') +
        `\n누적 드롭(넘침+기한) ${r.drops} · 큐 정리(항적 종결) ${r.dead} · 최대 대기 ${gv.stats[r.id].peakQ}`)}">` +
      `<span class="nm">${esc(r.n.name || r.id)}</span>` +
      `<span class="bar"><i style="width:${(frac * 100).toFixed(0)}%"></i></span>` +
      `<span class="st"><b>${r.st.busy}${r.c ? '/' + r.c : ''}</b> 대기 <b>${r.st.q}</b>` +
      (r.drops ? ` <span class="dr">✕${r.drops}</span>` : '') + `</span></div>`;
  }).join('') || '<div class="empty">아직 어느 노드에도 작업이 도착하지 않았습니다.</div>';
  box.querySelectorAll('.rk').forEach((d) => {
    d.addEventListener('click', () => toggleFocusNode(d.dataset.id));
  });
}

/* ── 좌하단 로그 — 「C2 처리」/「병목」 두 모드 ────────────────────────────────
   「항적」 모드(개별 보기와 같은 로그를 전체 화면에 띄움)는 걷어냈다(사용자 결정
   2026-08-31) — 항적 개별 보기와 중복이었다. 대신 C2 노드 하나(MCRC·KAMDOC·
   방공C2A·IAOC…)의 **처리 로그**를 본다: 무엇이 언제 도착해 얼마나 기다렸고
   얼마나 걸렸는가(도착·대기·처리·드롭) — 케파 실린더가 차오르는 것을 줄 단위로
   읽는 자리다. 재료는 전역 체류(allSpans) 그대로다 — 새 사실을 만들지 않는다.
   줄 클릭은 전체 시계를 그 사건 시각으로 맞춘다(종전 항적 모드와 같은 동선). */
let allLogMode = 'c2';     // 'c2' — C2 처리 로그(기본) · 'bot' — 병목 사건 로그
let allLogC2Id = null;     // 「C2 처리」 모드에서 고른 노드 id (실행이 바뀌면 재선정)
let c2Log = null;          // { id, rows, els, times } — renderC2Log가 만든다

function renderAllLog() {
  el('log-mode').hidden = false;
  el('lm-c2').classList.toggle('on', allLogMode === 'c2');
  el('lm-bot').classList.toggle('on', allLogMode === 'bot');
  if (allLogMode === 'bot') { el('log-trk-bar').hidden = true; renderBotLog(); return; }
  // C2 처리 모드 — 처리 큐가 선언된 C2 가운데 실제 도착이 있던 노드만 목록에 올린다.
  // (도착 0건 노드의 빈 로그는 「0건」과 「미측정」을 못 가른다 — ADR-062 규율)
  const c2s = Object.keys(run.nodes)
    .filter((id) => {
      const n = run.nodes[id];
      return n.queue && n.queue.servers && gv.stats[id] && gv.stats[id].arr > 0;
    })
    .sort((a, b) => gv.stats[b].arr - gv.stats[a].arr);
  if (!allLogC2Id || c2s.indexOf(allLogC2Id) < 0) allLogC2Id = c2s[0] || null;
  el('log-trk-bar').hidden = !allLogC2Id;
  if (!allLogC2Id) {
    el('log-title').textContent = 'C2 처리 로그';
    el('log-hint').textContent = '';
    el('log-body').innerHTML = '<div class="empty">이 실행에서는 어느 C2에도<br>작업이 도착하지 않았습니다.</div>';
    c2Log = null;
    return;
  }
  el('log-trk-sel').innerHTML = c2s.map((id) =>
    `<option value="${esc(id)}"${id === allLogC2Id ? ' selected' : ''}>` +
    `${esc(`${nodeName(id)} · 도착 ${gv.stats[id].arr}건`)}</option>`).join('');
  renderC2Log(allLogC2Id);
}

/** C2 노드 하나의 처리 로그 줄 — 전역 체류(allSpans)에서 그 노드 몫만 접는다.
 *  한 줄 = 작업 하나(도착 시각 기준): 무슨 일이(jk)·어느 항적 몫이(th)·얼마나 기다렸고
 *  (wait)·얼마나 걸렸는가(svc), 드롭이면 그 사유. 관측 종료까지 안 끝난 작업은
 *  지어내지 않고 「미완」으로 적는다. */
/**
 * 작업 하나의 **결과** — 「무슨 일을 했나」 옆에 「그래서 무엇이 됐나」를 붙이기 위한 판정.
 * 엔진이 서비스 완료 순간에 찍는 마크를 그대로 읽는다(재구성·추정 금지).
 * ⚠️ 대부분의 결과 마크는 완료 시각과 **같은 순간**이라 정확히 그 시각으로 찾는다.
 *    발사만 계선(ECS→포대)을 타고 나오므로 창을 넓게 둔다.
 */
const OUTCOME_RULES = [
  { re: /^사수선정·표적할당:[^→]*→(\S+)/, cls: 'ok', txt: (m) => `사수선정·표적할당 ${m[1]}` },
  { re: /^자체교전승인:/, cls: 'ok', txt: () => '자체 교전승인' },
  { re: /^교전명령발령:[^→]*→(\S+)/, cls: 'ok', txt: (m) => `발령 → ${m[1]}` },
  { re: /^교전명령재배정:[^→]*→([^(]+)\(([^)]*)\)/, cls: 'warn', txt: (m) => `재배정 → ${m[1]} (${m[2]})` },
  { re: /^교전명령반송:[^(]*\(([^)]*)\)/, cls: 'bad', txt: (m) => `반송 (${m[1]})` },
  { re: /^교전명령인가:/, cls: 'ok', txt: () => '인가 → 하달' },
  { re: /^승인회신처리완료:/, cls: 'ok', txt: () => '회신 처리 → 사수 확정' },
  { re: /^승인완료:/, cls: 'ok', txt: () => '승인' },
  { re: /^발사:([^/]+)/, cls: 'ok', txt: (m) => `발사 ${m[1]}` }
];
/**
 * 서비스 완료 직후 창에서 결과 마크를 **전부** 모은다 — 한 번의 서비스가 사수선정과
 * 자체 교전승인을 함께 내는 일이 흔해서, 첫 개만 적으면 「승인은 없었나」로 읽힌다.
 * ⚠️ 결과가 **나중에** 나오는 경우가 오히려 많다(실측: KAMDOC 명령의 69%가 판단 완료보다
 *    늦게 나갔고 중앙값 +22.8초). 그것을 「없음」으로 적으면 거짓이 되므로 **언제 무엇이
 *    됐는지**를 시각과 함께 적는다.
 */
function spanOutcome(s) {
  if (s.done == null || !s.track) return null;
  const ms = s.track.stages || [];
  const win = s.jk === 'directive_reception' ? 8 : 0.002;   // 발사만 계선을 탄다
  const hits = [];
  for (const m of ms) {
    if (m.t < s.done - 0.002 || m.t > s.done + win) continue;
    for (const r of OUTCOME_RULES) {
      const g = r.re.exec(m.name);
      if (g) { hits.push({ cls: r.cls, txt: r.txt(g) }); break; }
    }
  }
  if (hits.length) {
    return {
      cls: hits.some((h) => h.cls === 'bad') ? 'bad' : hits.some((h) => h.cls === 'warn') ? 'warn' : 'ok',
      txt: [...new Set(hits.map((h) => h.txt))].join(' · ')
    };
  }
  if (s.jk === 'iads_track') {
    // 이 서비스가 끝난 뒤 **언젠가** 이 항적에 사수가 붙었나 — 붙었으면 그때까지 기다린 것이다.
    const later = ms.find((m) => m.t > s.done + 0.002 && /^사수선정·표적할당:/.test(m.name));
    if (later) {
      const g = /→(\S+)/.exec(later.name);
      // 그 시점에 함께 난 승인도 같이 적는다 — 빼면 「승인 없이 쐈나」로 읽힌다.
      const appr = ms.some((m) => Math.abs(m.t - later.t) < 0.002 && /^자체교전승인:/.test(m.name))
        ? ' · 자체 교전승인' : '';
      return { cls: 'warn',
        txt: `교전창 대기 ${(later.t - s.done).toFixed(0)}초 → 사수선정·표적할당 ${g ? g[1] : ''}${appr}` };
    }
    return { cls: 'dim', txt: '쏠 수 있는 사수 없음 · 계속 감시' };
  }
  if (s.jk === 'directive_reception') return { cls: 'bad', txt: '발사 못함' };
  return null;
}

function buildC2Rows(id) {
  const end = run.cfg.endTimeSec;
  return run.allSpans.filter((s) => s.at === id).map((s) => {
    const started = s.start != null;
    const wait = (started ? s.start : (s.drop != null ? s.drop : end)) - s.arrive;
    const svc = started ? ((s.done != null ? s.done : end) - s.start) : null;
    // 드롭 사유는 엔진이 실어 준 r 그대로(재추정 금지) — buildGlobal과 같은 계정.
    const dropText = s.drop == null ? null
      : s.dropR === 'over' ? '넘침 드롭(대기실 초과)'
      : s.dropR === 'ttl' ? '기한 만료 드롭'
      : '큐 정리(항적 종결)';
    return { t: s.arrive, th: s.track ? s.track.id : null, jk: s.jk, wait, svc, started,
      start: s.start, done: s.done, drop: s.drop, dropR: s.dropR, dropText,
      outcome: spanOutcome(s),
      openSvc: started && s.done == null, openWait: !started && s.drop == null };
  });   // allSpans가 이미 도착순 정렬이라 재정렬하지 않는다
}

let lastC2Idx = -2;
function renderC2Log(id) {
  const body = el('log-body');
  const rows = buildC2Rows(id);
  const dropped = rows.filter((r) => r.drop != null && r.dropR !== 'dead').length;
  const waited = rows.filter((r) => r.wait > 0.5).length;
  el('log-title').textContent = `${nodeName(id)} — 처리 로그`;
  // 이 노드가 **무슨 일들을** 맡는지 한눈에 — 「위협판단 23 · 발령 6」처럼 종류별로 적는다.
  const byKind = {};
  rows.forEach((r) => { byKind[r.jk] = (byKind[r.jk] || 0) + 1; });
  const kindTxt = Object.keys(byKind).map((k) => `${jobLabel(k)} ${byKind[k]}`).join(' · ');
  el('log-hint').innerHTML = `${rows.length}건` + (kindTxt ? ` <span class="dim">(${esc(kindTxt)})</span>` : '') +
    (waited ? ` · <b style="color:var(--warn)">대기 ${waited}건</b>` : '') +
    (dropped ? ` · <b style="color:var(--bad)">드롭 ${dropped}건</b>` : '');
  body.innerHTML = rows.length ? rows.map((r) => {
    const cls = r.drop != null ? (r.dropR === 'dead' ? 'dead' : 'chdrop')
      : (r.wait > 0.5 ? 'block' : '');
    // 정수 반올림은 0.3초를 「0초」로 적어 "처리를 안 했다"로 읽힌다 — 1초 미만은 「<1초」로 쓴다.
    // (정확한 값은 툴팁의 소수 첫째 자리.)
    const sec0 = (v) => (v > 0 && v < 1) ? '<1초' : `${v.toFixed(0)}초`;
    const tail =
      (r.wait > 0.5 ? `<span class="med" style="color:var(--warn)">대기 ${sec0(r.wait)}${r.openWait ? '+' : ''}</span>` : '') +
      (r.svc != null ? `<span class="med" style="color:var(--accent)">처리 ${sec0(r.svc)}${r.openSvc ? '+' : ''}</span>` : '') +
      (r.dropText ? `<span class="med" style="color:${r.dropR === 'dead' ? 'var(--dim)' : 'var(--bad)'}">${esc(r.dropText)}</span>` : '') +
      // 「그래서 무엇이 됐나」 — 이게 없으면 KAMDOC이 명령을 냈는데도 로그가 침묵한다.
      (r.outcome ? `<span class="med" style="color:${
        r.outcome.cls === 'ok' ? 'var(--ok)' : r.outcome.cls === 'warn' ? 'var(--warn)'
        : r.outcome.cls === 'bad' ? 'var(--bad)' : 'var(--dim)'}">→ ${esc(r.outcome.txt)}</span>` : '');
    const tip = [`${fmt(r.t)} 도착 — ${jobLabel(r.jk)}${r.th ? ` · ${r.th}` : ''}`,
      r.started
        ? `대기 ${r.wait.toFixed(1)}초 → 처리 ${r.svc.toFixed(1)}초` +
          (r.openSvc ? ' (관측 종료까지 미완)' : ` → ${fmt(r.done)} 완료`) +
          (r.outcome ? `\n결과 — ${r.outcome.txt}` : '')
        : r.drop != null
          ? `대기 ${r.wait.toFixed(1)}초 → ${fmt(r.drop)} ${r.dropText}`
          : `대기 ${r.wait.toFixed(1)}초 — 관측 종료까지 서비스에 못 들어감`,
      '클릭 — 전체 시계를 이 도착 시각으로'].join('\n');
    return `<div class="ev mark${cls ? ' ' + cls : ''}" data-t="${r.t}" title="${esc(tip)}">` +
      `<span class="t mono">${fmt(r.t)}</span>` +
      `<span class="x">${esc(jobLabel(r.jk) + (r.th ? ' — ' + r.th : ''))}${tail}</span></div>`;
  }).join('') : '<div class="empty">이 노드에는 도착한 작업이 없습니다.</div>';
  c2Log = { id, rows, els: [...body.querySelectorAll('.ev')], times: rows.map((r) => r.t) };
  c2Log.els.forEach((n) => n.addEventListener('click', () => {
    setPlaying(false);
    simT = +n.dataset.t;
    drawFrame();
  }));
  lastC2Idx = -2;
  renderTicks();
  paintC2Log();
}

function paintC2Log() {
  if (!c2Log || !c2Log.els.length) return;
  let idx = -1;
  for (let i = 0; i < c2Log.els.length; i++) {
    if (+c2Log.els[i].dataset.t <= simT) idx = i; else break;
  }
  if (idx === lastC2Idx) return;
  lastC2Idx = idx;
  c2Log.els.forEach((n, i) => {
    // ⚠️ className을 통째로 갈아엎지 않는다(paintLog와 같은 함정) — 진행 상태 세 개만 교체.
    n.classList.remove('past', 'now', 'future');
    n.classList.add(i < idx ? 'past' : (i === idx ? 'now' : 'future'));
  });
  if (idx >= 0) c2Log.els[idx].scrollIntoView({ block: 'nearest' });
}

/** 좌하단(병목 모드): 병목 이벤트 로그 (넘침·큐 이탈·포화 진입/해소). */
let lastBotIdx = -2;
function renderBotLog() {
  const body = el('log-body');
  const rows = gv.rows.filter((r) => !gv.focusNode || r.node === gv.focusNode);
  el('log-title').textContent = '병목 이벤트 로그' +
    (gv.focusNode ? ` — ${nodeNameOf(run, gv.focusNode)} (클릭 해제)` : '');
  el('log-hint').textContent = rows.length + '건';
  body.innerHTML = rows.length ? rows.map((r, i) => {
    const range = r.tEnd > r.t + 1e-6 ? `${fmt(r.t)} → ${fmt(r.tEnd)}` : fmt(r.t);
    const ths = liveTracks(r.ths);
    const tip = range + '\n' + r.text + (ths.length
      ? '\n\n클릭 — ' + (ths.length > 1 ? `걸린 항적 ${ths.length}건 펼치기` : `${ths[0]} 개별 보기로`)
      : '');
    return `<div class="ev mark ${r.type}${ths.length ? ' hit' : ''}" data-t="${r.t}" data-te="${r.tEnd}"` +
      ` data-i="${i}" title="${esc(tip)}">` +
      `<span class="t mono">${fmt(r.t)}</span><span class="x">${esc(r.text)}</span>` +
      (ths.length ? `<span class="go">${ths.length > 1 ? ths.length + '건 ' : ''}›</span>` : '') +
      `</div>`;
  }).join('') : '<div class="empty">병목 사건이 없습니다 — 이 실행에서는 어떤 노드도<br>넘치거나 포화에 들지 않았습니다.</div>';
  gv.logEls = [...body.querySelectorAll('.ev')];
  // 줄 클릭 → 그 항적의 개별 보기. 종전 입구는 그래프의 「느린 점」뿐이었는데, 105개 항적이
  // 겹친 화면에서 원하는 점을 찍는 것은 사실상 닿지 않는 길이었다(기계는 이미 다 있었다).
  body.querySelectorAll('.ev.hit').forEach((n) => {
    n.addEventListener('click', () => openRowTracks(rows[+n.dataset.i], n));
  });
  lastBotIdx = -2;
  renderTicks();
  paintBotLog();
}

/** 로그 줄에 실린 항적 중 이번 실행에 실제로 있는 것만. 없는 id로 뛰면 0번으로 튄다. */
function liveTracks(ths) {
  if (!ths || !ths.length || !run) return [];
  return ths.filter((id) => run.tracks.some((t) => t.id === id));
}

/**
 * 병목 로그 한 줄 → 항적 개별 보기.
 * ⚠️ 여러 항적이 묶인 줄에서 **첫 항적으로 바로 뛰지 않는다** — 꼬리표의 「외 N」건은 그러면
 *    화면에서 닿을 길이 영영 없다. 펼쳐 고르게 하고, 다시 누르면 접는다.
 */
function openRowTracks(r, rowEl) {
  const ths = liveTracks(r.ths);
  if (!ths.length) return;
  if (ths.length === 1) { drillToTrack(ths[0], r.t); return; }
  const wasOpen = rowEl.nextElementSibling &&
    rowEl.nextElementSibling.classList.contains('evsub');
  [...el('log-body').querySelectorAll('.evsub')].forEach((n) => n.remove());
  if (wasOpen) return;
  const box = document.createElement('div');
  box.className = 'evsub';
  box.innerHTML = ths.map((id) => {
    const t = run.tracks.find((x) => x.id === id);
    const oc = outcomeInfo(t);
    const cls = t.outcome === 'killed' ? 'ok' : (oc.leaked ? 'bad' : 'idle');
    const txt = t.outcome === 'killed' ? '격추' : (oc.leaked ? '누수 · ' + oc.text : '진행중');
    return `<div class="evtrk" data-th="${esc(id)}" title="${esc(id + ' 개별 보기로')}">` +
      `<span class="nm">${esc(id)}</span><span class="pill ${cls}">${esc(txt)}</span></div>`;
  }).join('');
  rowEl.after(box);
  box.querySelectorAll('.evtrk').forEach((n) => n.addEventListener('click', (ev) => {
    ev.stopPropagation();
    drillToTrack(n.dataset.th, r.t);
  }));
}

/**
 * 항적 하나로 내려간다. 시각 t를 주면 **그 사건이 난 순간**으로 맞춘다.
 * ⚠️ selectTrack은 시계를 생성 시각(spawnT)으로 되감는다 — 사건 시각을 알고 왔는데 그대로
 *    두면 「막힌 그 장면」이 아니라 항적이 뜨는 장면이 열려 문맥이 끊긴다.
 */
function drillToTrack(id, t) {
  const i = run.tracks.findIndex((x) => x.id === id);
  if (i < 0) return;
  renderTrackList();
  selectTrack(i);
  if (t != null && sel) {
    simT = Math.min(Math.max(t, sel.spawnT), sel.endT);
    paintClock();
    drawFrame();
  }
}

function paintBotLog() {
  if (!gv || !gv.logEls) return;
  // 구간 사건(포화·버스트)은 tEnd까지 「진행 중」이다 — 마지막 시작행 하나만 강조하면
  // 동시에 진행 중인 다른 노드의 포화가 과거로 보인다.
  let sig = '';
  const states = gv.logEls.map((n) => {
    const t = +n.dataset.t, te = +n.dataset.te;
    const s = simT < t ? 'future' : (simT <= te + 0.5 ? 'now' : 'past');
    sig += s[0];
    return s;
  });
  if (sig === lastBotIdx) return;
  lastBotIdx = sig;
  let lastNow = -1;
  gv.logEls.forEach((n, i) => {
    n.classList.remove('past', 'now', 'future');
    n.classList.add(states[i]);
    if (states[i] === 'now') lastNow = i;
  });
  if (lastNow >= 0) gv.logEls[lastNow].scrollIntoView({ block: 'nearest' });
}

/** 보기 전환 — 전체 흐름 ↔ 항적 개별. 시계·스크럽 축이 함께 바뀐다. */
function setView(v) {
  view = v;
  el('v-all').classList.toggle('on', v === 'all');
  el('v-track').classList.toggle('on', v === 'track');
  el('tracks-label').textContent = v === 'all' ? '노드 부하 순위 (현재 시각)' : '항적 (이벤트)';
  if (!run) return;
  if (v === 'all') {
    el('signal').hidden = true;   // 신호등은 항적 하나를 볼 때만 뜻이 있다
    layoutAll();
    renderAllLog();
    simT = Math.min(Math.max(simT, viewT0()), viewT1());
    el('scrub').disabled = el('play').disabled = el('skip').disabled = false;
    renderLoadRank(stateAt(simT), true);
    drawFrame();
  } else {
    renderTrackList();
    const keep = sel ? run.tracks.findIndex((t) => t.id === sel.id) : -1;
    selectTrack(keep >= 0 ? keep : Math.max(0, run.tracks.findIndex((t) => t.flows.length > 0)));
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   6. 프레임 — 시각 t에서 "선 위에 떠 있는 전문"과 "노드에서 일어나는 일"
   ══════════════════════════════════════════════════════════════════════════ */
function drawFrame() {
  if (view === 'all') { drawFrameAll(); }
  else { drawFrameTrack(); }
  followFlow();
}

/**
 * 재생 중 **흐름을 따라 세로 스크롤**한다. 배치 전체를 이름까지 그리면서 그래프가 창보다
 * 길어졌으므로(1126 vs 759), 지금 전문이 움직이는 자리가 화면 밖이면 흐름을 놓친다.
 * ⚠️ 사용자가 직접 스크롤하는 중에는 끼어들지 않는다 — 재생 중이고, 지금 그려진 점이
 *    보이는 구간 밖일 때만 움직인다. 지도를 끌어다 보는 손을 빼앗지 않기 위한 규율이다.
 */
let userScrollAt = 0, autoScrolling = false;
el('graph-wrap').addEventListener('scroll', () => {
  // 자기가 움직인 스크롤은 「사용자 조작」으로 치지 않는다.
  if (autoScrolling) { autoScrolling = false; return; }
  userScrollAt = Date.now();
});

function followFlow() {
  if (!playing) return;
  // 사용자가 직접 굴리는 중이면 4초간 손대지 않는다 — 보던 자리를 빼앗지 않는다.
  if (Date.now() - userScrollAt < 4000) return;
  const wrap = el('graph-wrap'), svg = el('graph');
  if (wrap.scrollHeight <= wrap.clientHeight + 2) return;
  const dots = svg.querySelectorAll('#lyr-dots circle');
  if (!dots.length) return;
  const vb = (svg.getAttribute('viewBox') || '').split(/\s+/);
  const vh = +vb[3] || 0;
  if (!vh) return;
  const scale = wrap.scrollHeight / vh;          // viewBox 좌표 → 화면 픽셀
  let sum = 0;
  dots.forEach((d) => { sum += +d.getAttribute('cy') || 0; });
  const y = (sum / dots.length) * scale;
  const top = wrap.scrollTop, bot = top + wrap.clientHeight;
  if (y > top + 70 && y < bot - 70) return;      // 이미 보이면 두 번 움직이지 않는다
  autoScrolling = true;
  wrap.scrollTop = Math.max(0, Math.min(wrap.scrollHeight - wrap.clientHeight, y - wrap.clientHeight / 2));
}

/**
 * 작업 이름 — `iads_track`은 발령이 별도 작업이 아닐 때(기본, ADR-096 OFF) 판단부터
 * 사수선정·교전승인·명령까지를 **한 번의 서비스가 대표한다**. 그때 「…준비」라고만 적으면
 * 표적할당·사수선정·교전승인이 없는 것처럼 읽힌다(사용자 지적 2026-09-03).
 */
function jobLabel(jk) {
  if (jk === 'iads_track') return P.issue ? '위협판단·표적할당 준비' : '위협판단·표적할당';
  return JOB_LABEL[jk] || jk;
}

/** 노드 작업 종류 → 「무엇을 하려는 중인가」. 큐에 선 작업의 **다음 할 일**을 말해 준다. */
const JOB_LABEL = {
  iads_track: '위협판단·표적할당 준비',
  approval: '교전 승인',
  approval_return: '승인 회신 처리·교전명령',   // ADR-093 — C2A가 승인 회신을 접수해 사수 확정·명령을 내는 작업
  directive_issue: '교전명령 발령',            // ADR-096 — 결심 노드가 명령을 작성해 계선에 올리는 작업
  directive_relay: 'ICC 중계 인가',            // ADR-094 — ICC가 교전명령을 접수·인가(필요시 권역 내 재배정)하는 작업
  directive_reception: '교전명령 접수',
  engage: '발사 처리'
};

/**
 * 시각 t에서 이 항적이 **어디서 무엇을 기다리는가**를 판정한다.
 *
 * 종전 화면은 점의 유무·꼬리 길이로 **추론하게** 했다. 같은 정보를 문장으로 말해 주는 것이
 * 이 함수의 목적이다 — 「지금 KAMDOC 큐에서 앞에 12건 두고 48초째 대기」처럼.
 *
 * ⚠️ 「가야 할 방향」을 아는 경우와 모르는 경우를 **섞지 않는다**:
 *    · 채널 막힘 — 목적지가 정해져 있다(from→to). 화살표로 그린다.
 *    · 노드 큐 대기 — 다음 목적지는 **아직 결정 전**이다(결심이 서비스 중에 난다).
 *      그래서 방향이 아니라 **그 노드에서 무엇을 기다리는지**만 적는다. 방향을 지어내지 않는다.
 *    · 공백 — 어느 계통도 일하지 않는다. 교전 가능 상태(사격통제·체공창)를 기다리는 구간이며,
 *      C2가 막은 것이 아니다. 그렇게 적는다.
 */
function trackSignals(t) {
  const out = [];
  if (!sel) return out;
  if (t < sel.spawnT) return [{ cls: 'idle', text: '아직 생성 전' }];
  if (sel.exitT != null && t >= sel.exitT) {
    const oc = outcomeInfo(sel);
    return [oc.leaked
      ? { cls: 'stop', text: '누수 — ' + oc.text, sub: oc.code || '' }
      : { cls: 'go', text: '격추 완료' }];
  }

  // ① 채널에 막혀 못 가는 전문 — 목적지가 정해진 유일한 경우
  (sel.blocks || []).forEach((b) => {
    if (b.kind !== 'wait' || t < b.t0 || t > b.t1) return;
    out.push({ cls: 'stop', kind: 'blocked', from: b.from, to: b.to,
      text: `${nodeName(b.from)} → ${nodeName(b.to)} 못 감`,
      sub: `채널이 안 비어 ${(t - b.t0).toFixed(0)}초째 대기` });
  });

  // ② 노드에서 대기/처리 중 — 앞에 몇 건인지까지 센다(전역 체류에서 직접).
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (t < s.arrive || t > endT) return;
    if (s.start != null && t >= s.start) {
      out.push({ cls: 'go', kind: 'service', node: s.at,
        text: `${nodeName(s.at)} 처리 중`,
        sub: `${jobLabel(s.jk)} · ${(t - s.start).toFixed(0)}초째` });
    } else {
      // 같은 노드에서 나보다 먼저 도착해 아직 서비스에 못 들어간 작업 수 = 내 앞 대기줄
      let ahead = 0;
      run.allSpans.forEach((o) => {
        if (o.at !== s.at || o === s) return;
        if (o.arrive > t || o.arrive >= s.arrive) return;
        const oe = o.drop != null ? o.drop : (o.done != null ? o.done : Infinity);
        if (t <= oe && !(o.start != null && t >= o.start)) ahead++;
      });
      out.push({ cls: 'wait', kind: 'queue', node: s.at,
        text: `${nodeName(s.at)}에서 ${jobLabel(s.jk)} 대기`,
        sub: `앞에 ${ahead}건 · ${(t - s.arrive).toFixed(0)}초째` });
    }
  });

  // ②-b 이미 다른 계통이 이 표적에 쐈다 — 중복교전이 성립한 뒤로는 계속 알린다.
  if (sel.dupT != null && t >= sel.dupT) {
    out.push({ cls: 'stop', kind: 'dup',
      text: `중복교전 — ${sel.fireShooters.length}개 사수가 각각 발사`,
      sub: sel.fireShooters.map((s) => nodeName(s)).join(' + ') });
  }

  // ③ 이동 중 — 선 위에 떠 있는 전문
  let moving = 0, slowest = null;
  sel.flows.forEach((f) => {
    if (f.d <= 0 || t < f.t0 || t > f.t1) return;
    moving++;
    if (!slowest || f.d > slowest.d) slowest = f;
  });
  if (moving) {
    out.push({ cls: 'go', kind: 'move',
      text: `전문 ${moving}건 이동 중`,
      sub: slowest ? `최장 ${media(slowest.mt).label} ${slowest.d.toFixed(0)}초` : '' });
  }

  // ④ 아무것도 없으면 — 공백. C2가 막은 게 아니라는 것을 분명히 적는다.
  if (!out.length) {
    out.push({ cls: 'idle',
      text: '교전 가능 상태 대기',
      sub: '어느 계통도 처리 중이 아님 — 사격통제·체공창을 기다리는 구간' });
  }
  return out;
}

function renderSignals(sigs) {
  const box = el('signal');
  if (view !== 'track' || !sel) { box.hidden = true; return; }
  box.hidden = false;
  // 붉은 것(막힘)을 앞으로 — 화면에서 먼저 읽혀야 한다.
  const order = { stop: 0, wait: 1, go: 2, idle: 3 };
  const shown = sigs.slice().sort((a, b) => order[a.cls] - order[b.cls]).slice(0, 4);
  box.innerHTML = shown.map((s) =>
    `<span class="sig ${s.cls}"><span class="lamp"></span>${esc(s.text)}` +
    (s.sub ? `<span class="sub">${esc(s.sub)}</span>` : '') + `</span>`).join('');
}

function drawFrameTrack() {
  if (!sel || !geo) return;
  const dots = el('graph').querySelector('#lyr-dots');
  const showSensor = el('show-sensor').checked;
  let out = '';

  const liveCols = new Set();
  const talking = new Map();   // nodeId → 지금 이 항적의 전문이 나는 계선 끝점의 전송 시간
  // 킬체인 프론티어 — 이 항적의 계선이 **지금까지 도달한** 가장 오른쪽 열.
  // 「항적이 움직이니 C2가 왼쪽부터 차례로 반응한다」를 한 줄로 못박는 표시다.
  let frontier = -1;

  // 「닿지 못한」 노드·계선 — 실패 증거의 최초 시각을 지나면 또렷해진다.
  if (geo.ghostEls) geo.ghostEls.forEach((g) => g.el.classList.toggle('on', simT >= g.t));

  sel.flows.forEach((f) => {
    const e = geo.edgeByKey[edgeKey(f)];
    if (!e || !e.el) return;
    // 도착이 끝난 전문은 프론티어를 그만큼 밀어 둔다(역방향 도착은 밀지 않는다).
    if (simT >= f.t1 && !e.back && e.cb != null) frontier = Math.max(frontier, e.cb);
    // 순간 전달(지연 0 — 병렬 통보)은 도착 직후 잠깐만 깜빡인다. 0초를 "이동"으로 그리면
    // 없는 시간을 지어내는 것이고, 아예 안 그리면 통보가 없었던 것처럼 보인다.
    const inFlight = f.d > 0 ? (simT >= f.t0 && simT <= f.t1) : (simT >= f.t0 && simT <= f.t0 + 1.5);
    if (!inFlight) return;
    if (e.ca != null) { liveCols.add(e.ca); liveCols.add(e.cb); }
    // 교신 맥동 재료 — 전체 보기와 같은 규칙(센서 보고 제외).
    if (f.d > 0 && f.mt !== 'report-cycle') {
      [f.from, f.to].forEach((id) => {
        const p = talking.get(id);
        if (p == null || f.d > p) talking.set(id, f.d);
      });
    }
    // 프론티어·열 밝기는 「센서 보고 표시」 토글과 무관하다(전체 보기와 같은 규율) —
    // 토글은 점의 혼잡을 줄이는 손잡이일 뿐이다. 점만 여기서 거른다.
    if (!showSensor && f.mt === 'report-cycle') return;
    const p = f.d > 0 ? (simT - f.t0) / f.d : 1;
    const pt = e.el.getPointAtLength(e.len * Math.min(1, Math.max(0, p)));
    const m = media(f.mt);
    out += `<circle class="dot" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5.5" fill="${m.color}"></circle>`;
    // 느린 매체는 이름표를 달아 준다 — 빠른 것에 달면 깜빡임만 늘어난다.
    if (f.d >= 10) {
      out += `<text class="dotlab" x="${(pt.x + 8).toFixed(1)}" y="${(pt.y - 7).toFixed(1)}">` +
        `${esc(m.label)} ${f.d.toFixed(0)}초</text>`;
    }
  });
  // 이 항적의 작업이 놓인 노드의 열도 밝힌다 — 대기든 처리든 「반응 중」이다.
  // 선 위의 이동만 세면 노드에서 시간을 다 보내는 구간이 통째로 꺼져 보인다.
  const myNodes = new Set();
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (simT >= s.arrive && simT <= endT) myNodes.add(s.at);
  });
  Object.keys(geo.nodes).forEach((k) => {
    if (myNodes.has(geo.nodes[k].id)) liveCols.add(geo.nodes[k].col);
  });
  paintLiveCols(geo, liveCols);

  // 킬체인 프론티어 — 왼쪽은 이미 지나온 단계, 오른쪽은 아직 도달 못 한 단계.
  // ⚠️ 좌표를 지어내는 것이 아니다. 「도착이 끝난 전문의 도착 열」 중 최댓값일 뿐이고,
  //    그 도착 시각은 실행이 기록한 t1이다.
  if (frontier >= 0 && frontier < COLS.length) {
    const fx = geo.colW * (frontier + 1);
    const fy = 40;   // 열 머리글(18·30) 바로 아래에서 시작해 그래프 바닥까지
    out += `<line class="frontier" x1="${fx.toFixed(1)}" y1="${fy.toFixed(1)}" x2="${fx.toFixed(1)}" y2="${geo.H}"></line>` +
      `<text class="frontier-lab" x="${(fx - 5).toFixed(1)}" y="${(fy + 11).toFixed(1)}" text-anchor="end">` +
      `킬체인 진행 ▸ ${esc(COLS[frontier].label)}</text>`;
  }

  // 이 항적의 전문 중 계선 입구에서 막힌 것 — 개별 보기에서도 같은 규칙으로 그린다.
  out += renderBlocks(sel.blocks, geo);

  // 신호등이 가리키는 지점을 그래프에서도 짚는다 — 문장과 그림이 같은 곳을 가리켜야
  // 「어디서」에 답이 된다. 붉은 맥동 = 막힘, 노랑 맥동 = 큐 대기.
  const sigs = trackSignals(simT);
  sigs.forEach((s) => {
    if (s.kind === 'queue' || s.kind === 'service') {
      if (s.kind !== 'queue') return;                 // 처리 중은 정상이라 표시하지 않는다
      const p = slotPos(geo, s.node);
      if (p) out += `<circle class="blockmark wait" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="15"></circle>`;
    } else if (s.kind === 'blocked') {
      const es = geo.edges.filter((e) => e.from === s.from && e.to === s.to);
      const e = es.find((x) => x.kind === 'status') || es[0];
      if (e) out += `<path class="wantpath" d="${e.d}"></path>`;   // 가야 할 방향을 흐르는 점선으로
      const p = geo.nodes[s.from];
      if (p) out += `<circle class="blockmark" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="15"></circle>`;
    }
  });
  renderSignals(sigs);

  // 종결 표시 — 이 항적이 어떻게 끝났는지. 종전에는 **아무것도 그리지 않아** 누수가
  // 「그냥 움직임이 멎음」으로만 보였다. 모델은 사유·계열·구조성을 다 갖고 있다(ADR-050).
  const oc = outcomeInfo(sel);
  if (sel.exitT != null && simT >= sel.exitT) {
    const W = geo.W, y = 34;
    if (oc.leaked) {
      out += `<g class="endbanner leak"><rect x="${(W / 2 - 230).toFixed(0)}" y="${y}" width="460" height="34" rx="6"></rect>` +
        `<text x="${(W / 2).toFixed(0)}" y="${y + 15}" text-anchor="middle">` +
        `누수 ${esc(fmt(sel.exitT))} — ${esc(oc.text)}</text>` +
        `<text class="sub" x="${(W / 2).toFixed(0)}" y="${y + 28}" text-anchor="middle">` +
        `${esc(oc.code || '')}${oc.family ? ` · ${esc(oc.family)} 계열 · ${esc(oc.struct)}` : ''}` +
        `${oc.contributors.length ? ` · 기여 ${esc(oc.contributors.join(', '))}` : ''}</text></g>`;
    } else {
      out += `<g class="endbanner kill"><rect x="${(W / 2 - 110).toFixed(0)}" y="${y}" width="220" height="22" rx="6"></rect>` +
        `<text x="${(W / 2).toFixed(0)}" y="${y + 15}" text-anchor="middle">격추 ${esc(fmt(sel.exitT))}</text></g>`;
    }
  }

  dots.innerHTML = out;

  // 노드 케파 — **전역 부하**를 그리고, 그 위에 이 항적의 작업이 몇 번째인지 표시한다.
  // ⚠️ 종전에는 `sel.spans`(이 항적 몫)만 세어 노드 상태를 그렸다. 그러면 앞에 남의 작업이
  //    20건 쌓여 있어도 「대기 1」로 보인다 — 왜 안 나아가는지 설명이 안 되는 화면이었다.
  const gstate = stateAt(simT);
  const mineAt = {};
  sel.spans.forEach((s) => {
    const endT = s.drop != null ? s.drop : (s.done != null ? s.done : Infinity);
    if (simT < s.arrive || simT > endT) return;
    if (s.start != null && simT >= s.start) { mineAt[s.at] = { kind: 'service' }; return; }
    // 내 앞에 선 건수 = 같은 노드에서 나보다 먼저 도착했고 아직 서비스에 못 들어간 작업
    let ahead = 0;
    run.allSpans.forEach((o) => {
      if (o.at !== s.at || o === s || o.arrive > simT || o.arrive >= s.arrive) return;
      const oe = o.drop != null ? o.drop : (o.done != null ? o.done : Infinity);
      if (simT <= oe && !(o.start != null && simT >= o.start)) ahead++;
    });
    if (!mineAt[s.at] || mineAt[s.at].kind !== 'service') mineAt[s.at] = { kind: 'queue', pos: ahead };
  });
  Object.keys(geo.nodeEls).forEach((k) => {
    const els = geo.nodeEls[k], id = els.id, n = run.nodes[id] || {};
    const cap = nodeCap(n); const c = cap ? cap.c : null;
    const st = gstate[id] || { busy: 0, q: 0 };
    const talkD = talking.get(id);
    if (els.fill && c) {
      paintCyl(els, geo.nodes[k], c, st, mineAt[id] || null);
      // 교신 맥동 — 처리 중이면 작업 맥동이 우선한다(전체 보기와 같은 규칙).
      const talkOn = talkD != null && !(st.busy > 0);
      els.cyl.classList.toggle('talking', talkOn);
      if (talkOn) commPulse(els.rim, talkD);
      return;
    }
    if (els.circ) {
      // ⚠️ 종전에는 대기중(queue)에도 `busy`를 걸었다. 그때는 색만 바뀌어 넘어갔지만
      //    이제 `busy`는 **맥동**한다 — 줄만 서 있는 노드가 일하는 것처럼 깜빡이면 안 된다.
      const mn = mineAt[id];
      const svcNow = !!(mn && mn.kind === 'service');
      els.circ.classList.toggle('busy', svcNow);
      els.circ.classList.toggle('queued', !!(mn && mn.kind === 'queue'));
      // 주기는 **전역 상태**에서 잡는다 — 실린더와 같은 규칙이라야 같은 노드가 두 보기에서
      // 다른 속도로 깜빡이지 않는다.
      if (svcNow) applyPulse(els.circ, st);
      const talkOn = talkD != null && !svcNow;
      els.circ.classList.toggle('talking', talkOn);
      if (talkOn) commPulse(els.circ, talkD);
    }
    if (els.badge) els.badge.textContent = st.q ? '대기 ' + st.q : '';
  });

  // 센서 점등 — 이 항적을 탐지·추적·사격통제 중인 센서의 테두리에 불이 들어온다.
  // 상태는 SENSOR_* 전이 마크의 구간 재생이라, 여러 센서가 동시에 켜지는 순간이 그대로 보인다.
  const SENSOR_BADGE = { det: '탐지', trk: '추적', fc: '사통' };
  if (sel.sensorStates) Object.keys(sel.sensorStates).forEach((sid) => {
    const evs = sel.sensorStates[sid];
    let st = null;
    for (let i = 0; i < evs.length && evs[i].t <= simT; i++) st = evs[i].st;
    Object.keys(geo.nodeEls).forEach((k) => {
      const els = geo.nodeEls[k];
      if (els.id !== sid) return;
      els.g.classList.remove('s-det', 's-trk', 's-fc');
      if (st) els.g.classList.add('s-' + st);
      if (els.badge) els.badge.textContent = st ? SENSOR_BADGE[st] : '';
    });
  });

  paintLog();
  paintClock();
}

/**
 * 「가야 할 방향은 있는데 못 가는」 전문을 계선 **입구에 줄 세워** 그린다.
 *
 * 움직이는 점(전송 중)과 반드시 달라 보여야 한다 — 채운 원이 아니라 **점선 테두리 빈 원**이고,
 * 시각이 흘러도 제자리다. 그것이 "선은 있는데 못 건넌다"의 그림이다.
 *
 * ⚠️ 대기 위치는 표시 관례일 뿐 모델의 좌표가 아니다(모델에 대기 위치라는 개념은 없다).
 *    실제인 것은 **언제부터 언제까지 못 갔는가**이며, 그것만 라벨과 툴팁에 적는다.
 * @param geoRef layoutGraph/layoutAll이 만든 geo 객체 (edges·nodes)
 */
function renderBlocks(blocks, geoRef) {
  if (!blocks || !blocks.length || !geoRef) return '';
  let out = '';
  const byEdge = {};
  blocks.forEach((b) => {
    if (b.kind === 'wait') { if (simT < b.t0 || simT > b.t1) return; }
    else if (simT < b.t0 || simT > b.t0 + 1.8) return;   // 드롭은 순간 — 잠깐만 튄다
    const k = b.from + '>' + b.to;
    (byEdge[k] = byEdge[k] || []).push(b);
  });
  Object.keys(byEdge).forEach((k) => {
    const items = byEdge[k];
    const [from, to] = k.split('>');
    // 그 쌍의 계선 중 status(교전현황)를 먼저 찾고, 없으면 아무 계선, 그것도 없으면 노드.
    const es = geoRef.edges.filter((e) => e.from === from && e.to === to);
    const edge = es.find((e) => e.kind === 'status') || es[0] || null;
    const at = (frac) => {
      if (edge && edge.el) return edge.el.getPointAtLength(edge.len * frac);
      const n = slotPos(geoRef, from, 'up');
      return n ? { x: n.x + 14, y: n.y } : null;
    };
    const waits = items.filter((b) => b.kind === 'wait');
    const drops = items.filter((b) => b.kind === 'drop');
    waits.slice(0, 8).forEach((b, i) => {
      const p = at(0.10 + i * 0.05);
      if (!p) return;
      const forever = !isFinite(b.t1);
      out += `<circle class="wait-dot${forever ? ' forever' : ''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5">` +
        `<title>${esc((b.th || '') + ' — ' + fmt(b.t0) + '부터 대기 중' +
          (forever ? ' (관측 종료까지 못 감)' : ' → ' + fmt(b.t1) + ' 출발') +
          '\n계선은 있으나 채널이 비지 않아 떠나지 못한다')}</title></circle>`;
    });
    if (waits.length) {
      const p = at(0.10);
      const oldest = Math.min.apply(null, waits.map((b) => b.t0));
      if (p) out += `<text class="blocklab" x="${(p.x + 9).toFixed(1)}" y="${(p.y - 9).toFixed(1)}">` +
        `막힘 ${waits.length}건 · ${(simT - oldest).toFixed(0)}초째</text>`;
    }
    drops.forEach((b) => {
      const p = at(0.10);
      if (!p) return;
      const age = (simT - b.t0) / 1.8;
      out += `<g class="drop-x" opacity="${(1 - age).toFixed(2)}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">` +
        `<line x1="-6" y1="-6" x2="6" y2="6"></line><line x1="-6" y1="6" x2="6" y2="-6"></line>` +
        `<title>${esc((b.th || '') + ' — ' + fmt(b.t0) + ' 채널 용량 초과로 버려짐(출발 못 함)')}</title></g>`;
    });
  });
  return out;
}

function paintClock() {
  if (!run || (view === 'track' && !sel)) { el('clock').textContent = '—'; return; }
  el('clock').textContent = fmt(simT) + ' / ' + fmt(viewT1());
  const t0 = viewT0(), span = Math.max(1e-6, viewT1() - t0);
  el('scrub').value = String(Math.round((simT - t0) / span * 1000));
}

/* ══════════════════════════════════════════════════════════════════════════
   7. 재생
   ══════════════════════════════════════════════════════════════════════════ */
/**
 * ⚠️ 재생 시계를 `requestAnimationFrame`으로 돌리지 않는다. 탭이 배경으로 가면 rAF는
 *    **정지**하고, 재생 버튼은 눌린 채로 시계만 멈춰 버린다(실측 — 2.5초 동안 시각 불변).
 *    타이머는 배경에서 느려질 뿐 계속 돌고, 경과는 벽시계(performance.now)에서 재므로
 *    화면이 끊길지언정 **시각이 어긋나지는 않는다**.
 */
function tick() {
  if (!playing || !run) return;
  const wall = performance.now();
  const dt = Math.min(.5, (wall - lastWall) / 1000);   // 탭 복귀 시 한 번에 튀는 것을 막는다
  lastWall = wall;
  simT += dt * speed;
  if (simT >= viewT1()) { simT = viewT1(); setPlaying(false); }
  drawFrame();
}

function setPlaying(on) {
  playing = on;
  el('play').textContent = on ? '❚❚' : '▶';
  el('play').classList.toggle('on', on);
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (on) {
    if (run && simT >= viewT1()) simT = viewT0();
    lastWall = performance.now();
    timerId = setInterval(tick, 33);
  }
}

el('run').addEventListener('click', doRun);
el('m-asis').addEventListener('click', () => setMode('asis'));

function setMode(m) {

  el('m-tobe').classList.toggle('on', m === 'tobe');
  // 계선 매체 교체는 모드마다 계선 자체가 다르므로 함께 비운다 — 남겨 두면 As-Is에서 고른
  // 계선이 To-Be에는 없어 "못 맞춘 계선"으로만 뜨고 아무 일도 일어나지 않는다.
  if (Object.keys(overrides).length) { overrides = {}; renderOverrides(); }
  markDirty();
}

}

 * 왼쪽 패널 접기/펴기.
 *
 * 접으면 그래프 칸이 549 → 889px로 넓어지고 열폭이 61 → 98.8px가 된다(800px 창 실측).
 * 그제서야 중앙 C2·ICC의 **이름과 케파 실린더가 읽히고**, 왼쪽 `ICC C1 ↑중계`와 오른쪽
 * `ICC C1`이 같은 부대라는 것이 눈에 들어온다 — 좁을 때 좌우가 서로 다른 조직처럼
 * 보이던 오독의 원인 하나가 그냥 폭 부족이었다.
 *
 * ⚠️ 그래도 **없애지 않는다.** 병목 로그의 줄은 항적 개별로 내려가는 입구이고(openRowTracks),
 *    그것을 지우면 그래프의 느린 점을 찍는 길 — 105개 항적이 겹친 화면에서 사실상 닿지 않는
 *    길 — 로 되돌아간다. 접는 것은 발표용 상태이지 기본 상태가 아니다.
 * ⚠️ 밀집 열(센서 19 · ECS 15 · 사수 15)은 접어도 나아지지 않는다(노드당 33.4 → 35.3px).
 *    그 자리는 세로 공간에 묶여 있어서, 열 너비 배분을 고치기 전에는 안 풀린다.
 */
function setSide(open) {
  el('side').hidden = !open;

  b.textContent = open ? '‹ 패널 접기' : '› 패널 펴기';
  b.title = open ? '왼쪽 패널을 접고 그래프를 넓게 쓴다'
    : '노드 부하 순위·이벤트 로그를 다시 연다 — 로그 줄이 항적 개별로 내려가는 입구다';
  b.classList.toggle('on', !open);
  relayout();
}
el('side-toggle').addEventListener('click', () => setSide(el('side').hidden));

el('v-track').addEventListener('click', () => { if (run) setView('track'); });

// 점은 매 프레임 다시 만들어지므로 위임으로 받는다.
el('graph').addEventListener('click', (ev) => {

  // 문맥이 끊긴다. 로그 줄 클릭과 **같은 함수**를 쓴다(두 벌을 두면 동선이 갈라진다).
  drillToTrack(dot.dataset.th, simT);
}, true);

el('status').textContent = '커널 로딩 완료 — [실행]을 누르세요.';
