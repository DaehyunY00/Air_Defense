<text x="940.0" y="625.0" text-anchor="middle" font-size="9.6" fill="#44525e">양보 뒤 상대 계획 종결을 332.1에 인지 → 재제안 시한 353.1 → 창 닫힘</text>
<text x="20" y="666" font-size="11.2" fill="#44525e">IAOC는 THAAD 지휘소의 제안(52.1)에 1초 만에 「내 자산이 최적」으로 회신하고 중북 L-SAM을 지정, THAAD는 양보합니다 — 결심 지휘소 1곳 · 음성 없음 · 교신 노드 8. 사수 지정 53.1은 As-Is의 첫 지정(54.0)과 같은 시각입니다.</text>
<text x="20" y="683" font-size="11.2" fill="#44525e">그 한 발이 324.4에 빗나가자 양보했던 THAAD 지휘소가 332.1에야 재협조를 시작해 창을 놓침 → 360.2 누수. As-Is는 엇갈린 중복 지정의 두 번째 발이 격추 — 명중 추첨이 결과를 가른 예.</text>
<text x="20" y="746" font-size="10.5" fill="#8a97a3">실선 = 데이터링크/통합 사격통제망 · 붉은 점선 = 음성 · 회색 점선 = 대기 지시(준비 지시 · 발사 권한 아님) · 시각은 seed 29 실행의 실측(초) · 큐 권한 「준비만」 조건</text>
